name: Add entry exit dead zone overlay v73 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-entry-exit-dead-zone-overlay-v73-once.yml"

permissions:
  contents: write

concurrency:
  group: "entry-exit-dead-zone-overlay-v73"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v73 runtime patch
        run: node scripts/apply-entry-exit-dead-zone-v73.js

      - name: Validate v73 overlay behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check app/map-overlay-renderer.js
          node --check app/mechanical-map-scene-renderer.js
          node --check app/simulation-map-scene-renderer.js
          node --check app/controllers/settings-controller.js
          node --check app/controllers/setup-event-controller-integration.js
          node --check app/defaults.js
          node --check app/bootstrap.js
          node tests/entry-exit-dead-zone-overlay.test.js
          node tests/bottle-orientation-panel.test.js
          node tests/apl-roller-coverage-default.test.js
          node tests/bootstrap-module-boundaries.test.js

      - name: Commit verified staging v73 runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Bry4nt06"
          git config user.email "139938543+Bry4nt06@users.noreply.github.com"
          git add index.html app/defaults.js app/controllers/settings-controller.js app/controllers/setup-event-controller-integration.js app/map-overlay-renderer.js app/mechanical-map-scene-renderer.js app/simulation-map-scene-renderer.js app/bootstrap.js update-manifest.json tests/entry-exit-dead-zone-overlay.test.js
          git commit -m "Add 330 to 30 degree entry exit overlay"
          git push origin main
