name: Add entry exit dead zone overlay v73 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-entry-exit-dead-zone-overlay-v73-once.yml"

permissions:
  contents: write

concurrency:
  group: "entry-exit-dead-zone-overlay-v73"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add independent 330 to 30 degree dead zone overlay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Missing {label} in {path}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'index.html',
              '''            <label class="switch-setting" for="showAllProgramMovesOverlay">
              <span class="switch-copy"><strong>Show all program moves</strong><small>Display every servo move and its HMI line.</small></span>
              <span class="switch-control"><input id="showAllProgramMovesOverlay" type="checkbox" /><span class="switch-track" aria-hidden="true"></span></span>
            </label>
''',
              '''            <label class="switch-setting" for="showAllProgramMovesOverlay">
              <span class="switch-copy"><strong>Show all program moves</strong><small>Display every servo move and its HMI line.</small></span>
              <span class="switch-control"><input id="showAllProgramMovesOverlay" type="checkbox" /><span class="switch-track" aria-hidden="true"></span></span>
            </label>
            <label class="switch-setting" for="showEntryExitDeadZoneOverlay">
              <span class="switch-copy"><strong>Show entry / exit dead zone</strong><small>Highlight the 330° → 30° bottle entry and exit region.</small></span>
              <span class="switch-control"><input id="showEntryExitDeadZoneOverlay" type="checkbox" /><span class="switch-track" aria-hidden="true"></span></span>
            </label>
''',
              'dead zone overlay switch'
          )
          replace_once(
              'index.html',
              'app/bootstrap.js?v=0.9.10-station1-bottle-orientation-v72-20260811-1600',
              'app/bootstrap.js?v=0.9.10-entry-exit-dead-zone-overlay-v73-20260811-1604',
              'v73 bootstrap cache bust'
          )

          replace_once(
              'app/defaults.js',
              '''  showMoveDistanceOverlay: false,
  showAllProgramMovesOverlay: false,
  showQuadrantReferences: false,
''',
              '''  showMoveDistanceOverlay: false,
  showAllProgramMovesOverlay: false,
  showEntryExitDeadZoneOverlay: false,
  showQuadrantReferences: false,
''',
              'dead zone state default'
          )
          replace_once(
              'app/defaults.js',
              '''  showMoveDistanceOverlay: document.querySelector("#showMoveDistanceOverlay"),
  showAllProgramMovesOverlay: document.querySelector("#showAllProgramMovesOverlay"),
  showQuadrantReferences: document.querySelector("#showQuadrantReferences"),
''',
              '''  showMoveDistanceOverlay: document.querySelector("#showMoveDistanceOverlay"),
  showAllProgramMovesOverlay: document.querySelector("#showAllProgramMovesOverlay"),
  showEntryExitDeadZoneOverlay: document.querySelector("#showEntryExitDeadZoneOverlay"),
  showQuadrantReferences: document.querySelector("#showQuadrantReferences"),
''',
              'dead zone element binding'
          )

          replace_once(
              'app/controllers/settings-controller.js',
              '''  function setAggregateSpacing(enabled) {
    commit("showAggregateSpacingOverlay", Boolean(enabled), { render: "map" });
  }
''',
              '''  function setEntryExitDeadZoneOverlay(enabled) {
    commit("showEntryExitDeadZoneOverlay", Boolean(enabled), {
      render: ["map", "simulation-map"]
    });
  }

  function setAggregateSpacing(enabled) {
    commit("showAggregateSpacingOverlay", Boolean(enabled), { render: "map" });
  }
''',
              'dead zone settings action'
          )
          replace_once(
              'app/controllers/settings-controller.js',
              '''    setMovementOverlay,
    setAggregateSpacing,
''',
              '''    setMovementOverlay,
    setEntryExitDeadZoneOverlay,
    setAggregateSpacing,
''',
              'dead zone settings export'
          )

          replace_once(
              'app/controllers/setup-event-controller-integration.js',
              '''    else if (target === els.showMoveDistanceOverlay) settings.setMovementOverlay("distance", target.checked);
    else if (target === els.showAllProgramMovesOverlay) settings.setMovementOverlay("all", target.checked);
    else if (target === els.direction) map.setDirection(target.value);
''',
              '''    else if (target === els.showMoveDistanceOverlay) settings.setMovementOverlay("distance", target.checked);
    else if (target === els.showAllProgramMovesOverlay) settings.setMovementOverlay("all", target.checked);
    else if (target === els.showEntryExitDeadZoneOverlay) settings.setEntryExitDeadZoneOverlay(target.checked);
    else if (target === els.direction) map.setDirection(target.value);
''',
              'dead zone change event'
          )

          overlay = Path('app/map-overlay-renderer.js')
          text = overlay.read_text()
          text = text.replace(
              '  const QUADRANT_REFERENCES = Object.freeze([90, 180, 270, 359.9]);\n',
              '''  const QUADRANT_REFERENCES = Object.freeze([90, 180, 270, 359.9]);
  const ENTRY_EXIT_DEAD_ZONE = Object.freeze({ start: 330, end: 30, span: 60 });

  function deadZoneSectorPath(innerRadius, outerRadius) {
    const points = [];
    const step = 2;
    for (let angle = ENTRY_EXIT_DEAD_ZONE.start; angle <= 360 + ENTRY_EXIT_DEAD_ZONE.end; angle += step) {
      points.push(angleToXY(angle, outerRadius));
    }
    const terminalOuter = angleToXY(360 + ENTRY_EXIT_DEAD_ZONE.end, outerRadius);
    if (!points.length || points[points.length - 1].x !== terminalOuter.x || points[points.length - 1].y !== terminalOuter.y) {
      points.push(terminalOuter);
    }
    for (let angle = 360 + ENTRY_EXIT_DEAD_ZONE.end; angle >= ENTRY_EXIT_DEAD_ZONE.start; angle -= step) {
      points.push(angleToXY(angle, innerRadius));
    }
    const terminalInner = angleToXY(ENTRY_EXIT_DEAD_ZONE.start, innerRadius);
    points.push(terminalInner);
    return points.map((point, index) => `${index ? "L" : "M"} ${point.x} ${point.y}`).join(" ") + " Z";
  }

  function drawEntryExitDeadZoneOverlay(add, parent) {
    if (!state.showEntryExitDeadZoneOverlay) return;
    const innerRadius = 45;
    const outerRadius = Math.max(innerRadius + 10, Number(state.radius || 0) + 9);
    add("path", {
      d: deadZoneSectorPath(innerRadius, outerRadius),
      fill: "#6e087f",
      "fill-opacity": 0.30,
      stroke: "#9e279c",
      "stroke-width": 1.2,
      "stroke-opacity": 0.56,
      "pointer-events": "none",
      "data-entry-exit-dead-zone": "330-30",
      "aria-label": "Bottle entry and exit dead zone from 330 to 30 degrees"
    }, parent);

    [ENTRY_EXIT_DEAD_ZONE.start, ENTRY_EXIT_DEAD_ZONE.end].forEach((angle) => {
      const inner = angleToXY(angle, innerRadius);
      const outer = angleToXY(angle, outerRadius);
      add("line", {
        x1: inner.x,
        y1: inner.y,
        x2: outer.x,
        y2: outer.y,
        stroke: "#d63163",
        "stroke-width": 2,
        "stroke-opacity": 0.78,
        "stroke-dasharray": "7 5",
        "vector-effect": "non-scaling-stroke",
        "pointer-events": "none",
        "data-dead-zone-boundary": angle
      }, parent);
    });

    const labelPoint = angleToXY(0, Math.max(innerRadius + 24, outerRadius * 0.63));
    add("text", {
      x: labelPoint.x,
      y: labelPoint.y,
      fill: "#df8fe8",
      "font-size": 8,
      "font-weight": 800,
      "letter-spacing": 0.5,
      "text-anchor": "middle",
      "dominant-baseline": "middle",
      stroke: "var(--map-surface)",
      "stroke-width": 2.5,
      "paint-order": "stroke fill",
      "pointer-events": "none",
      "data-dead-zone-label": "330-30"
    }, parent).textContent = "ENTRY / EXIT DEAD ZONE";
  }
''',
              1
          )
          if 'function drawEntryExitDeadZoneOverlay' not in text:
              raise SystemExit('Failed to insert dead zone renderer')
          old = '''  global.drawMapQuadrantReferences = drawMapQuadrantReferences;
  global.drawAggregateSpacingOverlay = drawAggregateSpacingOverlay;
  global.LabelerMapOverlayRenderer = Object.freeze({
    quadrantReferences: QUADRANT_REFERENCES,
    drawMapQuadrantReferences,
    drawAggregateSpacingOverlay
  });
'''
          new = '''  global.drawMapQuadrantReferences = drawMapQuadrantReferences;
  global.drawEntryExitDeadZoneOverlay = drawEntryExitDeadZoneOverlay;
  global.drawAggregateSpacingOverlay = drawAggregateSpacingOverlay;
  global.LabelerMapOverlayRenderer = Object.freeze({
    quadrantReferences: QUADRANT_REFERENCES,
    entryExitDeadZone: ENTRY_EXIT_DEAD_ZONE,
    deadZoneSectorPath,
    drawMapQuadrantReferences,
    drawEntryExitDeadZoneOverlay,
    drawAggregateSpacingOverlay
  });
'''
          if old not in text:
              raise SystemExit('Missing map overlay export block')
          overlay.write_text(text.replace(old, new, 1))

          replace_once(
              'app/mechanical-map-scene-renderer.js',
              '''    const bottleHeads = heads();
    drawBottleTableVisual(add, svg, state.radius, bottleHeads);
    const quadrantLayer = add("g", { "aria-label": "Table quadrant references" });
''',
              '''    const bottleHeads = heads();
    drawBottleTableVisual(add, svg, state.radius, bottleHeads);
    const deadZoneLayer = add("g", { "aria-label": "Bottle entry and exit dead zone", "data-entry-exit-dead-zone-layer": "true" });
    drawEntryExitDeadZoneOverlay(add, deadZoneLayer);
    const quadrantLayer = add("g", { "aria-label": "Table quadrant references" });
''',
              'mechanical dead zone layer'
          )

          replace_once(
              'app/simulation-map-scene-renderer.js',
              '''    const bottleHeads = heads();
    drawBottleTableVisual(add, svg, state.radius, bottleHeads);
    const quadrantLayer = add("g", { "aria-label": "Table quadrant references" });
''',
              '''    const bottleHeads = heads();
    drawBottleTableVisual(add, svg, state.radius, bottleHeads);
    const deadZoneLayer = add("g", { "aria-label": "Bottle entry and exit dead zone", "data-entry-exit-dead-zone-layer": "true" });
    drawEntryExitDeadZoneOverlay(add, deadZoneLayer);
    const quadrantLayer = add("g", { "aria-label": "Table quadrant references" });
''',
              'simulation dead zone layer'
          )

          bootstrap = Path('app/bootstrap.js')
          text = bootstrap.read_text()
          import re
          text = re.sub(r'const build = "[^"]+";', 'const build = "entry-exit-dead-zone-overlay-v73-20260811-1604";', text, count=1)
          text = re.sub(r'const buildUpdatedAt = "[^"]+";', 'const buildUpdatedAt = "Aug 11, 2026 4:04 PM ET";', text, count=1)
          text = text.replace('// Regression lineage:', '// Regression lineage: entry-exit-dead-zone-overlay-v73-20260811-1604 •', 1)
          bootstrap.write_text(text)

          Path('update-manifest.json').write_text('''{
  "schemaVersion": 1,
  "version": "0.9.10",
  "buildId": "entry-exit-dead-zone-overlay-v73-20260811-1604",
  "releaseUrl": "https://bry4nt06.github.io/labeler-tool-staging/",
  "downloadUrl": "https://bry4nt06.github.io/labeler-tool-staging/",
  "notes": "Staging v73 adds an independent Entry / Exit Dead Zone overlay covering 330° through 0° to 30°. It can remain visible at the same time as either Active Move Distance or All Program Moves, and is rendered beneath the motion overlays on both the mechanical map and simulation map."
}
''')
          PY

          cat > tests/entry-exit-dead-zone-overlay.test.js <<'EOF'
          "use strict";

          const assert = require("assert");
          const fs = require("fs");
          const path = require("path");

          const root = path.resolve(__dirname, "..");
          global.window = global;
          global.state = {
            radius: 250,
            showEntryExitDeadZoneOverlay: false,
            showMoveDistanceOverlay: false,
            showAllProgramMovesOverlay: false
          };
          global.angleToXY = (angle, radius) => {
            const radians = Number(angle) * Math.PI / 180;
            return { x: Math.cos(radians) * radius, y: Math.sin(radians) * radius };
          };
          global.fmt = (value) => String(value);

          const overlayPath = path.join(root, "app/map-overlay-renderer.js");
          delete require.cache[require.resolve(overlayPath)];
          require(overlayPath);

          assert.deepStrictEqual(global.LabelerMapOverlayRenderer.entryExitDeadZone, { start: 330, end: 30, span: 60 });

          function collect() {
            const nodes = [];
            const add = (name, attrs) => {
              const node = { name, attrs, textContent: "" };
              nodes.push(node);
              return node;
            };
            global.drawEntryExitDeadZoneOverlay(add, {});
            return nodes;
          }

          assert.equal(collect().length, 0, "overlay remains hidden when its independent toggle is off");

          state.showEntryExitDeadZoneOverlay = true;
          let nodes = collect();
          const sector = nodes.find((node) => node.attrs["data-entry-exit-dead-zone"] === "330-30");
          assert(sector, "330° → 30° sector should render");
          assert.equal(sector.name, "path");
          assert.match(sector.attrs.d, /^M /);
          assert.match(sector.attrs.d, / Z$/);
          const boundaries = nodes.filter((node) => node.attrs["data-dead-zone-boundary"] !== undefined);
          assert.deepStrictEqual(boundaries.map((node) => Number(node.attrs["data-dead-zone-boundary"])), [330, 30]);

          state.showMoveDistanceOverlay = true;
          state.showAllProgramMovesOverlay = true;
          nodes = collect();
          assert(nodes.some((node) => node.attrs["data-entry-exit-dead-zone"] === "330-30"), "dead zone must remain active regardless of other overlay state");

          const index = fs.readFileSync(path.join(root, "index.html"), "utf8");
          assert.match(index, /id="showEntryExitDeadZoneOverlay"/);
          assert.match(index, /330° → 30°/);
          assert.match(index, /entry-exit-dead-zone-overlay-v73-20260811-1604/);

          const defaults = fs.readFileSync(path.join(root, "app/defaults.js"), "utf8");
          assert.match(defaults, /showEntryExitDeadZoneOverlay:\s*false/);
          assert.match(defaults, /showEntryExitDeadZoneOverlay:\s*document\.querySelector/);

          const settings = fs.readFileSync(path.join(root, "app/controllers/settings-controller.js"), "utf8");
          assert.match(settings, /function setEntryExitDeadZoneOverlay/);
          assert.match(settings, /commit\("showEntryExitDeadZoneOverlay"/);
          assert.doesNotMatch(settings, /setEntryExitDeadZoneOverlay[\s\S]{0,300}showMoveDistanceOverlay\s*=/, "dead zone must not alter the move-distance toggle");
          assert.doesNotMatch(settings, /setEntryExitDeadZoneOverlay[\s\S]{0,300}showAllProgramMovesOverlay\s*=/, "dead zone must not alter the all-moves toggle");

          const events = fs.readFileSync(path.join(root, "app/controllers/setup-event-controller-integration.js"), "utf8");
          assert.match(events, /els\.showEntryExitDeadZoneOverlay\) settings\.setEntryExitDeadZoneOverlay/);

          for (const relative of ["app/mechanical-map-scene-renderer.js", "app/simulation-map-scene-renderer.js"]) {
            const source = fs.readFileSync(path.join(root, relative), "utf8");
            assert.match(source, /drawEntryExitDeadZoneOverlay\(add, deadZoneLayer\)/);
            assert(source.indexOf("drawEntryExitDeadZoneOverlay(add, deadZoneLayer)") < source.indexOf("drawMoveDistanceOverlay"), `${relative} should render dead zone beneath motion overlays`);
          }

          console.log("Entry / exit dead zone overlay v73 regression passed.");
          EOF

      - name: Validate v73 overlay behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check app/map-overlay-renderer.js
          node --check app/mechanical-map-scene-renderer.js
          node --check app/simulation-map-scene-renderer.js
          node --check app/controllers/settings-controller.js
          node --check app/controllers/setup-event-controller-integration.js
          node --check app/defaults.js
          node --check app/bootstrap.js
          node tests/entry-exit-dead-zone-overlay.test.js
          node tests/bottle-orientation-panel.test.js
          node tests/apl-roller-coverage-default.test.js
          node tests/bootstrap-module-boundaries.test.js

      - name: Commit verified staging v73 runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Bry4nt06"
          git config user.email "139938543+Bry4nt06@users.noreply.github.com"
          git add index.html app/defaults.js app/controllers/settings-controller.js app/controllers/setup-event-controller-integration.js app/map-overlay-renderer.js app/mechanical-map-scene-renderer.js app/simulation-map-scene-renderer.js app/bootstrap.js update-manifest.json tests/entry-exit-dead-zone-overlay.test.js
          git commit -m "Add 330 to 30 degree entry exit overlay"
          git push origin main
