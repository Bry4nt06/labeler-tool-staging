            /const buildUpdatedAt = "[^"]+";/,
            'const buildUpdatedAt = "Aug 11, 2026 4:00 PM ET";',
            'bootstrap timestamp'
          );
          bootstrap = replaceOrThrow(
            bootstrap,
            '// Regression lineage:',
            '// Regression lineage: station1-bottle-orientation-v72-20260811-1600 •',
            'bootstrap lineage'
          );
          bootstrap = replaceOrThrow(
            bootstrap,
            '    "app/servo-program-eight-row-grouping-integration.js",\n',
            '    "app/servo-program-eight-row-grouping-integration.js",\n    "app/bottle-orientation-panel-integration.js",\n',
            'bootstrap module manifest'
          );
          fs.writeFileSync('app/bootstrap.js', bootstrap);

          let index = fs.readFileSync('index.html', 'utf8');
          index = replaceOrThrow(
            index,
            /<script src="app\/bootstrap\.js\?v=[^"]+"><\/script>/,
            '<script src="app/bootstrap.js?v=0.9.10-station1-bottle-orientation-v72-20260811-1600"></script>',
            'bootstrap script cache key'
          );
          fs.writeFileSync('index.html', index);

          let sw = fs.readFileSync('service-worker.js', 'utf8');
          sw = replaceOrThrow(
