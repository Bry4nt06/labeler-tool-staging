          const fs = require('fs');

          function replaceOrThrow(source, pattern, replacement, label) {
            const updated = source.replace(pattern, replacement);
            if (updated === source) throw new Error(`Unable to update ${label}`);
            return updated;
          }

          let bootstrap = fs.readFileSync('app/bootstrap.js', 'utf8');
          bootstrap = replaceOrThrow(
