name: Apply Bottle Orientation Refinement

on:
  push:
    paths:
      - "scripts/apply-bottle-orientation-v78-direction.js"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bottle orientation refinement
        run: node scripts/apply-bottle-orientation-v78-direction.js

      - name: Validate orientation regression
        run: node tests/bottle-orientation-panel.test.js

      - name: Validate compact workspace regression
        run: node tests/map-workspace-bottle-visual-v75.test.js

      - name: Validate dead-zone overlay regression
        run: node tests/entry-exit-dead-zone-overlay.test.js

      - name: Check patch formatting
        run: git diff --check

      - name: Commit generated refinement
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/animation-runtime.js app/bottle-orientation-panel-integration.js app/bootstrap.js app/update-manager.js service-worker.js index.html update-manifest.json tests/bottle-orientation-panel.test.js tests/map-workspace-bottle-visual-v75.test.js tests/entry-exit-dead-zone-overlay.test.js
          git commit -m "Refine bottle orientation wrap and machine direction"
          git push origin HEAD:main
