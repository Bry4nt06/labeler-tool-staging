name: Apply Bottle Orientation Pseudo 3D v81

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-bottle-orientation-v81-pseudo-3d.yml"

permissions:
  contents: write

concurrency:
  group: bottle-orientation-v81
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v81 patch
        run: |
          python3 scripts/apply-v81-pseudo-3d.py
          python3 scripts/fix-v81-pseudo-3d-markers.py

      - name: Validate syntax
        run: |
          node --check app/bottle-orientation-panel-integration.js
          node --check app/bootstrap.js
          node --check app/update-manager.js
          node --check service-worker.js

      - name: Validate bottle orientation regression
        run: node tests/bottle-orientation-panel.test.js

      - name: Validate existing map regressions
        run: |
          node tests/compact-map-layout-v75.test.js
          node tests/entry-exit-dead-zone-overlay.test.js
          node tests/apl-roller-coverage-default.test.js

      - name: Commit v81
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bottle-orientation-panel-integration.js app/bootstrap.js app/update-manager.js service-worker.js update-manifest.json tests/bottle-orientation-panel.test.js
          git commit -m "Upgrade bottle orientation side view to pseudo-3D"
          git push origin main
