name: Apply brand selection transaction v92

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-brand-selection-v92.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/apply-v92-brand-selection.py

      - name: Align legacy build marker regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          build = "brand-selection-transaction-v92-20260811-2109"
          replacements = {
              "tests/bottle-orientation-panel.test.js": ["wipe-panel-semantic-direction-v89-20260811-2005"],
              "tests/entry-exit-dead-zone-overlay.test.js": ["head1-world-frame-top-view-v80-20260811-1830"],
          }
          for filename, stale_markers in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for marker in stale_markers:
                  if marker not in text:
                      raise SystemExit(f"stale build marker {marker} not found in {filename}")
                  text = text.replace(marker, build)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Validate syntax
        run: |
          node --check app/setup-bindings.js
          node --check app/controllers/workspace-action-service.js
          node --check app/controllers/build-inputs-controller.js
          node --check app/controllers/setup-event-controller-integration.js
          node --check app/bootstrap.js
          node --check app.js
          node --check service-worker.js

      - name: Run targeted regressions
        run: |
          node tests/brand-selection-regeneration.test.js
          node tests/brand-selection-transaction-v92.test.js
          node tests/setup-bindings-retirement.test.js
          node tests/top-navigation-recovery.test.js
          node tests/workspace-selection-delivery-v92.test.js
          node tests/bottle-orientation-panel.test.js
          node tests/entry-exit-dead-zone-overlay.test.js
          node tests/apl-roller-coverage-default.test.js

      - name: Commit v92
        run: |
          if git diff --quiet; then
            echo "No v92 changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Build Inputs brand selection race v92"
          git push origin HEAD:main
