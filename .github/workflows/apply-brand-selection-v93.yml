name: Validate brand selection presentation v93

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-brand-selection-v93.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate syntax
        run: |
          node --check app/controllers/workspace-action-service.js
          node --check app/controllers/build-inputs-controller.js
          node --check app/controllers/setup-event-controller-integration.js
          node --check app/rendering-coordinator-integration.js
          node --check app/bootstrap.js
          node --check app.js
          node --check service-worker.js
          node --check tests/workspace-selection-delivery-v93.test.js

      - name: Brand regeneration regression
        run: node tests/brand-selection-regeneration.test.js

      - name: Brand presentation regression
        run: node tests/brand-selection-presentation-v93.test.js

      - name: v93 delivery regression
        run: node tests/workspace-selection-delivery-v93.test.js

      - name: Setup binding ownership regression
        run: node tests/setup-bindings-retirement.test.js

      - name: Top navigation regression
        run: node tests/top-navigation-recovery.test.js

      - name: Bottle orientation regression
        run: node tests/bottle-orientation-panel.test.js

      - name: Entry exit overlay regression
        run: node tests/entry-exit-dead-zone-overlay.test.js

      - name: APL roller regression
        run: node tests/apl-roller-coverage-default.test.js

      - name: APL handoff regression
        run: node tests/apl-section-handoff-continuity.test.js
