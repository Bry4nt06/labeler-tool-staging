name: Apply Brand selection event authority v94

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-brand-selection-v94.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v94 patch
        run: python3 scripts/apply-v94-brand-event-authority.py

      - name: Validate syntax
        run: |
          node --check app/controllers/specification-sensor-guidance-controller.js
          node --check app/controllers/setup-event-controller-integration.js
          node --check app/controllers/build-inputs-controller.js
          node --check app/controllers/workspace-action-service.js
          node --check app/bootstrap.js
          node --check app.js
          node --check service-worker.js
          node --check tests/brand-selection-event-authority-v94.test.js
          node --check tests/workspace-selection-delivery-v94.test.js

      - name: Brand event authority regression
        run: node tests/brand-selection-event-authority-v94.test.js

      - name: Brand transaction regression
        run: node tests/brand-selection-presentation-v93.test.js

      - name: Brand regeneration regression
        run: node tests/brand-selection-regeneration.test.js

      - name: v94 delivery regression
        run: node tests/workspace-selection-delivery-v94.test.js

      - name: Navigation ownership regression
        run: node tests/top-navigation-recovery.test.js

      - name: Specs unrestricted editing regression
        run: node tests/specs-unrestricted-editing.test.js

      - name: Spec number retirement regression
        run: node tests/spec-number-retirement.test.js

      - name: Bottle orientation regression
        run: node tests/bottle-orientation-panel.test.js

      - name: Entry exit overlay regression
        run: node tests/entry-exit-dead-zone-overlay.test.js

      - name: APL roller regression
        run: node tests/apl-roller-coverage-default.test.js

      - name: APL handoff regression
        run: node tests/apl-section-handoff-continuity.test.js

      - name: Commit v94
        run: |
          if git diff --quiet; then
            echo 'No v94 changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Brand selection event ownership v94'
          git push origin HEAD:main
