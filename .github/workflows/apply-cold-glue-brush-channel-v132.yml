name: Apply canonical Cold Glue brush channel v132

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-cold-glue-brush-channel-v132.yml"

permissions:
  contents: write

concurrency:
  group: "cold-glue-brush-channel-v132"
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out staging main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check migration patch syntax
        run: node --check .github/patches/apply-cold-glue-brush-channel-v132.js

      - name: Apply v132 canonical brush-channel migration
        run: node .github/patches/apply-cold-glue-brush-channel-v132.js

      - name: Check affected JavaScript syntax
        run: |
          set -euo pipefail
          node --check drivers/mechanical/cold-glue-motion-driver.js
          node --check app/cold-glue-profile-generation.js
          node --check app/profile-generation.js
          node --check app/bootstrap.js
          node --check app.js
          node --check service-worker.js

      - name: Validate Cold Glue brush-channel behavior
        run: |
          set -euo pipefail
          node tests/cold-glue-brush-channel-authority-v132.test.js
          node tests/assembly-drivers.test.js
          node tests/profile-generation-module-boundaries.test.js
          node tests/physical-wipe-direction-v125.test.js
          git diff --check

      - name: Commit canonical Cold Glue brush authority
        run: |
          set -euo pipefail
          git config user.name "Bry4nt06"
          git config user.email "139938543+Bry4nt06@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Make Cold Glue brush channels canonical v132"
            git push origin main
          fi
