name: Apply packaged default sensor and map fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-default-sensor-map-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update packaged defaults and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          DEFAULT_VERSION = 5
          default_maps = {
              'config/default-programs/map-l85-workbook-reference-3-label-apl.json': 'Standard 45H TopModul',
              'config/default-programs/map-45h-topmodul-3-label-apl-wipe-down-pads.json': 'Standard 45H TopModul Wipe-Down Pads',
          }

          manifest_path = Path('config/company-default-settings.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['companyDefaultsVersion'] = DEFAULT_VERSION
          manifest['exportedAt'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          fragments = manifest.setdefault('fragments', {})
          map_sources = list(fragments.get('mapLibrary') or [])
          required_sources = [
              './config/default-programs/map-blank-apl.json',
              './config/default-programs/map-l85-workbook-reference-3-label-apl.json',
              './config/default-programs/map-45h-topmodul-3-label-apl-wipe-down-pads.json',
          ]
          fragments['mapLibrary'] = list(dict.fromkeys(required_sources + map_sources))
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          for filename, name in default_maps.items():
              path = Path(filename)
              data = json.loads(path.read_text(encoding='utf-8'))
              data['name'] = name
              data['companyDefaultProgram'] = True
              data['companyDefaultProgramVersion'] = DEFAULT_VERSION
              data['protectedDefaultMap'] = True
              for item in data.get('objects', []):
                  if item.get('kind') in {'sensor', 'coding'}:
                      item['orientationLabelSection'] = 'auto'
                      item['orientationConfigured'] = True
              path.write_text(json.dumps(data, separators=(',', ':')) + '\n', encoding='utf-8')

          integration_path = Path('app/sensor-orientation-default-map-fix-integration.js')
          integration = integration_path.read_text(encoding='utf-8')
          integration = integration.replace(
              'return Boolean(map?.companyDefaultProgram === true || map?.protectedDefaultMap === true || DEFAULT_IDS.has(String(map?.id || "")));',
              'return Boolean(map?.protectedDefaultMap === true || DEFAULT_IDS.has(String(map?.id || "")));'
          )
          integration_path.write_text(integration, encoding='utf-8')

          worker_path = Path('service-worker.js')
          worker = worker_path.read_text(encoding='utf-8')
          worker = worker.replace(
              'const CACHE_NAME = "servoforge-labeler-staging-v0.9.10-validation-brand-hotfix-v1";',
              'const CACHE_NAME = "servoforge-labeler-staging-v0.9.10-default-sensor-targets-v1";'
          )

          def insert_after(text, marker, additions):
              missing = [line for line in additions if line not in text]
              if not missing:
                  return text
              if marker not in text:
                  raise RuntimeError(f'Missing service-worker marker: {marker}')
              return text.replace(marker, marker + '\n' + '\n'.join(missing), 1)

          worker = insert_after(worker,
              '  "./config/default-programs/map-l85-workbook-reference-3-label-apl.json",',
              ['  "./config/default-programs/map-45h-topmodul-3-label-apl-wipe-down-pads.json",'])
          worker = insert_after(worker,
              '  "./drivers/profile/profile-pipeline-driver.js",',
              [
                  '  "./drivers/profile/orientation-constraint-planner-driver.js",',
                  '  "./drivers/profile/sensor-target-policy-driver.js",',
              ])
          worker = insert_after(worker,
              '  "./app/profile-pipeline-orchestrator-integration.js",',
              [
                  '  "./app/orientation-constraint-target-service.js",',
                  '  "./app/orientation-constraint-program-planner.js",',
                  '  "./app/orientation-constraint-planner-integration.js",',
                  '  "./app/sensor-orientation-default-map-fix-integration.js",',
              ])
          worker_path.write_text(worker, encoding='utf-8')

          test_path = Path('tests/sensor-target-policy.test.js')
          test_path.write_text(r'''"use strict";

const assert = require("assert");
const policy = require("../drivers/profile/sensor-target-policy-driver.js");

const map = {
  enabledStations: [true, true, true, true, true, true],
  aggregateAngles: { "1": 68.5, "2": 108.5, "3": 148.5, "4": 188.5, "5": 229.5, "6": 269.5 },
  stationSections: { "1": "neck", "2": "neck", "3": "body", "4": "body", "5": "back", "6": "back" },
  objects: [
    { kind: "pad", station: 1, labelSection: "neck", start: 72, end: 100 },
    { kind: "pad", station: 2, labelSection: "neck", start: 112, end: 140 },
    { kind: "pad", station: 3, labelSection: "body", start: 149, end: 169 },
    { kind: "pad", station: 4, labelSection: "body", start: 189, end: 209 },
    { kind: "pad", station: 5, labelSection: "back", start: 230, end: 250 },
    { kind: "pad", station: 6, labelSection: "back", start: 270, end: 290 }
  ]
};
const activeApplications = { neck: true, body: true, back: true };
const stationSections = map.stationSections;

const neckBodySensor = { kind: "sensor", station: 4, angle: 216, orientationLabelSection: "back" };
assert.deepStrictEqual(
  policy.eligibleSections({ item: neckBodySensor, map, activeApplications, stationSections }),
  ["neck", "body"],
  "The 216-degree inspection must only offer labels completed before it."
);
assert.strictEqual(
  policy.normalizeSelection({ selection: "back", item: neckBodySensor, map, activeApplications, stationSections }),
  "body",
  "An invalid Back selection at 216 degrees must fall back to the latest completed Body label."
);
assert.strictEqual(
  policy.normalizeSelection({ selection: "neck", item: neckBodySensor, map, activeApplications, stationSections }),
  "neck",
  "A valid explicit Neck inspection must remain selected."
);

const backCoder = { kind: "coding", start: 304, end: 315, orientationLabelSection: "auto" };
assert.strictEqual(
  policy.latestEligibleSection({ item: backCoder, map, activeApplications, stationSections }),
  "back",
  "The 304-degree coder must resolve Auto to the completed Back label."
);

console.log("Sensor target policy regression passed.");
''', encoding='utf-8')

          Path('.github/workflows/apply-default-sensor-map-fix.yml').unlink(missing_ok=True)
          PY

      - name: Validate changes
        shell: bash
        run: |
          node --check app.js
          node --check drivers/profile/sensor-target-policy-driver.js
          node --check app/sensor-orientation-default-map-fix-integration.js
          node --check service-worker.js
          node tests/sensor-target-policy.test.js
          node tests/orientation-constraint-planner.test.js
          python -m json.tool config/company-default-settings.json >/dev/null
          python -m json.tool config/default-programs/map-l85-workbook-reference-3-label-apl.json >/dev/null
          python -m json.tool config/default-programs/map-45h-topmodul-3-label-apl-wipe-down-pads.json >/dev/null
          grep -q 'Standard 45H TopModul' config/default-programs/map-l85-workbook-reference-3-label-apl.json
          grep -q 'Standard 45H TopModul Wipe-Down Pads' config/default-programs/map-45h-topmodul-3-label-apl-wipe-down-pads.json
          grep -q 'sensor-target-policy-driver.js' app.js
          grep -q 'sensor-orientation-default-map-fix-integration.js' app.js
          grep -q 'default-sensor-targets-v1' service-worker.js
          ! grep -q 'companyDefaultProgram === true || map?.protectedDefaultMap' app/sensor-orientation-default-map-fix-integration.js
          git diff --check

      - name: Commit packaged default fix
        shell: bash
        run: |
          git config user.name "ServoForge Staging Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix packaged sensor targets and protect standard maps"
          git push origin HEAD:main
