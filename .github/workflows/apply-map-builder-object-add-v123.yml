name: Apply Map Builder object-add v123
# retry after lifecycle test version cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-map-builder-object-add-v123.yml"

permissions:
  contents: write

concurrency:
  group: "map-builder-object-add-v123"
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out staging main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply v123 Map Builder repair
        run: |
          set -euo pipefail
          node .github/patches/apply-map-builder-object-add-v123.js

      - name: Check affected JavaScript
        run: |
          set -euo pipefail
          node --check app/defaults.js
          node --check app/controllers/map-controller.js
          node --check app/map-builder-history-service.js
          node --check app/map-builder-controller.js
          node --check app/controllers/map-builder-row-controller.js
          node --check app/controllers/map-builder-event-controller.js
          node --check app/company-default-map-catalog-integration.js
          node --check app/bootstrap.js
          node --check app.js
          node --check service-worker.js

      - name: Run Map Builder regressions
        run: |
          set -euo pipefail
          node tests/map-builder-action-dispatch.test.js
          node tests/map-builder-lifecycle.test.js
          node tests/map-builder-row-controller.test.js
          node tests/map-builder-object-add-v123.test.js
          node tests/company-catalog-reconciliation.test.js
          node tests/autocol-coder-codebox-v122.test.js
          node tests/printed-codebox-left-edge-v121.test.js
          git diff --check

      - name: Commit staging v123
        run: |
          set -euo pipefail
          git config user.name "Bry4nt06"
          git config user.email "139938543+Bry4nt06@users.noreply.github.com"
          git add app/defaults.js app/controllers/map-controller.js app/map-builder-history-service.js app/map-builder-controller.js app/controllers/map-builder-row-controller.js app/controllers/map-builder-event-controller.js app/company-default-map-catalog-integration.js app/bootstrap.js app.js service-worker.js index.html update-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Fix Map Builder object adds and persistence v123"
            git push origin main
          fi
