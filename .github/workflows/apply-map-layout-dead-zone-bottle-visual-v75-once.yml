name: Apply map layout dead zone bottle visual v75 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-map-layout-dead-zone-bottle-visual-v75-once.yml"

permissions:
  contents: write

concurrency:
  group: "map-layout-dead-zone-bottle-visual-v75"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v75 presentation update
        run: node scripts/apply-map-layout-dead-zone-bottle-visual-v75.js

      - name: Validate v75 syntax and regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check app/map-overlay-renderer.js
          node --check app/mechanical-map-scene-renderer.js
          node --check app/simulation-map-scene-renderer.js
          node --check app/map-workspace-compact-support-integration.js
          node --check app/bottle-orientation-panel-recovery-integration.js
          node --check app/bootstrap.js
          node --check app/update-manager.js
          node --check service-worker.js
          node tests/entry-exit-dead-zone-overlay.test.js
          node tests/bottle-orientation-panel.test.js
          node tests/map-workspace-bottle-visual-v75.test.js
          node tests/apl-roller-coverage-default.test.js

      - name: Commit verified v75 runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/map-overlay-renderer.js app/mechanical-map-scene-renderer.js app/simulation-map-scene-renderer.js app/map-workspace-compact-support-integration.js app/bottle-orientation-panel-recovery-integration.js app/bootstrap.js app/update-manager.js service-worker.js index.html update-manifest.json tests/entry-exit-dead-zone-overlay.test.js tests/map-workspace-bottle-visual-v75.test.js
          git commit -m "Refine map workspace and dead zone overlay v75"
          git push origin main
