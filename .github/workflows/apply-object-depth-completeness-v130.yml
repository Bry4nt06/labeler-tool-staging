name: Apply Object Depth completeness v130

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-object-depth-completeness-v130.yml"

permissions:
  contents: write

concurrency:
  group: "object-depth-completeness-v130"
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out staging main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check patch syntax
        run: node --check .github/patches/apply-object-depth-completeness-v130.js

      - name: Apply complete Object Depth configuration
        run: |
          set -euo pipefail
          node .github/patches/apply-object-depth-completeness-v130.js

      - name: Check affected JavaScript
        run: |
          set -euo pipefail
          node --check app/defaults.js
          node --check app/controllers/setup-state-controller.js
          node --check app/controllers/setup-event-controller-integration.js
          node --check app/map-runtime-service.js
          node --check app/assembly-map-renderer.js
          node --check app.js
          node --check service-worker.js
          node --check tests/object-depth-completeness-v130.test.js

      - name: Run object-depth and neighboring regressions
        run: |
          set -euo pipefail
          node tests/object-depth-completeness-v130.test.js
          node tests/map-builder-lifecycle.test.js
          node tests/map-builder-object-add-v123.test.js
          node tests/physical-wipe-direction-v125.test.js
          git diff --check

      - name: Commit staging v130
        run: |
          set -euo pipefail
          git config user.name "Bry4nt06"
          git config user.email "139938543+Bry4nt06@users.noreply.github.com"
          git add index.html app/defaults.js app/controllers/setup-state-controller.js app/controllers/setup-event-controller-integration.js app/map-runtime-service.js app/assembly-map-renderer.js app.js service-worker.js tests/object-depth-completeness-v130.test.js
          if ! git diff --cached --quiet; then
            git commit -m "Complete Map Builder object depth configuration v130"
            git push origin main
          fi
