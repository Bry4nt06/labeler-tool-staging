name: Apply Side View Grid v82

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-side-view-grid-v82.yml"

permissions:
  contents: write

concurrency:
  group: side-view-grid-v82
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v82 patch
        run: python3 scripts/apply-v82-side-grid.py

      - name: Validate syntax
        run: |
          node --check app/bottle-orientation-panel-integration.js
          node --check app/bootstrap.js
          node --check app/update-manager.js
          node --check service-worker.js

      - name: Validate bottle orientation regression
        run: node tests/bottle-orientation-panel.test.js

      - name: Validate supporting regressions
        run: |
          node tests/entry-exit-dead-zone-overlay.test.js
          node tests/apl-roller-coverage-default.test.js

      - name: Commit v82
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bottle-orientation-panel-integration.js app/bootstrap.js app/update-manager.js service-worker.js update-manifest.json tests/bottle-orientation-panel.test.js
          git commit -m "Add side-view orientation grid and degree reference v82"
          git push origin main

# rerun after updating v81 glass assertions
