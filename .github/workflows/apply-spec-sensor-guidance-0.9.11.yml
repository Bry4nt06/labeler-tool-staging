const assert = require("assert");
const fs = require("fs");
const path = require("path");
const vm = require("vm");
const root = path.resolve(__dirname, "..");
const read = (...parts) => fs.readFileSync(path.join(root, ...parts), "utf8");

const factorySource = read("drivers", "profile", "orientation-issue-factory-driver.js");
const issueSource = read("drivers", "validation", "validation-issue-driver.js");
const aggregatorSource = read("drivers", "validation", "validation-result-aggregator-driver.js");
const sensorSource = read("app", "apl-label-sensor-reference-integration.js");
const rendererSource = read("app", "workspace-status-renderer.js");
const healthSource = read("app", "controllers", "health-status-ui-controller.js");

[factorySource, issueSource, aggregatorSource, sensorSource, rendererSource, healthSource].forEach((source) => {
  assert.doesNotThrow(() => new vm.Script(source));
});

const sandbox = { window: null, globalThis: null, console, LabelerDriverRegistry: { register() {} } };
sandbox.window = sandbox;
sandbox.globalThis = sandbox;
vm.createContext(sandbox);
