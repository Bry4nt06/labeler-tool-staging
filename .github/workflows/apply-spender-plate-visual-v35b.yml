name: Apply spender plate visual v35b

# One-time retry after updating the migration regression fixture.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-spender-plate-visual-v35b.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v35 patch
        run: python tools/apply_spender_plate_v35.py
      - name: Validate changed runtime
        run: |
          node --check app/assembly-map-renderer.js
          node --check app/map-builder-controls.js
          node --check app/map-builder-controller.js
          node --check app/controllers/map-builder-layout-controller.js
          node --check app/map-schema-adapter-integration.js
          node --check drivers/map/map-schema-driver.js
          node --check drivers/map/map-migration-driver.js
          node --check app/bootstrap.js
          node tests/wipe-component-visuals.test.js
          node tests/spender-plate-visual-controls.test.js
          node tests/servoforge-brand-theme.test.js
          node tests/default-workspace-view.test.js
          node tests/map-schema-driver.test.js
          node tests/map-migration-driver.test.js
          node tests/feature-integration-readiness.test.js
          node tests/bootstrap-module-boundaries.test.js
      - name: Commit v35 runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add physical spender plates and authoritative wipe bevel"
          git push
