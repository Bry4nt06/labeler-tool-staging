name: Apply Top View Only v84
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-v84-top-view-only.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/apply-v84-top-view-only.py
      - run: python3 scripts/update-v84-orientation-test.py
      - run: |
          node --check app/bottle-orientation-panel-integration.js
          node --check app/bootstrap.js
          node --check app/update-manager.js
          node --check service-worker.js
      - run: node tests/bottle-orientation-panel.test.js
      - run: |
          node tests/entry-exit-dead-zone-overlay.test.js
          node tests/apl-roller-coverage-default.test.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bottle-orientation-panel-integration.js app/bootstrap.js app/update-manager.js service-worker.js update-manifest.json tests/bottle-orientation-panel.test.js
          git commit -m "Simplify bottle orientation to top view only v84"
          git push origin main
