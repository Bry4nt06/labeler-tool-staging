name: Apply Top View Mount Recovery v85
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-v85-top-view-mount-recovery.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/apply-v85-top-view-mount-recovery.py
      - run: |
          node --check app/bottle-orientation-panel-recovery-integration.js
          node --check app/bottle-orientation-panel-integration.js
          node --check app/bootstrap.js
          node --check app/update-manager.js
          node --check service-worker.js
      - run: node tests/bottle-orientation-panel.test.js
      - run: node tests/bottle-orientation-mount-recovery.test.js
      - run: node tests/entry-exit-dead-zone-overlay.test.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bottle-orientation-panel-recovery-integration.js app/bootstrap.js app/update-manager.js service-worker.js update-manifest.json tests/bottle-orientation-panel.test.js tests/bottle-orientation-mount-recovery.test.js
          git commit -m "Keep Bottle Orientation Top View mounted v85"
          git push origin main
