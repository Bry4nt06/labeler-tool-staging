name: Retry wipe panel semantic direction v89

on:
  push:
    paths:
      - ".github/workflows/apply-v89-wipe-semantic-direction-rerun.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch semantic direction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          BUILD = "wipe-panel-semantic-direction-v89-20260811-2005"
          UPDATED = "Aug 11, 2026 8:05 PM ET"

          p = Path("app/wipe-telemetry-service.js")
          s = p.read_text(encoding="utf-8")
          new_fn = '''function liveWipeMachineDirection() {
            // Use the operator-facing Map Builder direction first. The legacy
            // runtime state.direction uses the opposite internal motion convention,
            // so it is only an inverted fallback when no semantic map direction exists.
            const selected = typeof document !== "undefined"
              ? String(document.getElementById("mapDirection")?.value || "").toLowerCase()
              : "";
            if (selected === "cw" || selected === "ccw") return selected;
            try {
              const configured = String(activeMachineMap?.()?.machineSettings?.direction || "").toLowerCase();
              if (configured === "cw" || configured === "ccw") return configured;
            } catch {
              // Fall through to the internal runtime convention below.
            }
            const runtime = String(state.direction || "").toLowerCase();
            if (runtime === "cw") return "ccw";
            if (runtime === "ccw") return "cw";
            return "ccw";
          }

          function wipeVisualApplication'''
          s, n = re.subn(r'function liveWipeMachineDirection\(\) \{.*?\n\}\n\nfunction wipeVisualApplication', new_fn, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("liveWipeMachineDirection patch failed")
          s = s.replace("runtimeDirectionParityV88: true", "semanticMachineDirectionV89: true")
          p.write_text(s, encoding="utf-8")

          p = Path("app/simulation-collapsible-integration.js")
          s = p.read_text(encoding="utf-8")
          s = s.replace("app/wipe-telemetry-service.js?v=0.9.7-table-rendering-retired-v1", "app/wipe-telemetry-service.js?v=0.9.10-wipe-direction-v89")
          s = s.replace("app/wipe-telemetry-renderer.js?v=0.9.7-table-rendering-retired-v1", "app/wipe-telemetry-renderer.js?v=0.9.10-wipe-direction-v89")
          p.write_text(s, encoding="utf-8")

          p = Path("app/bootstrap.js")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'const build = "[^"]+";', f'const build = "{BUILD}";', s, count=1)
          s = re.sub(r'const buildUpdatedAt = "[^"]+";', f'const buildUpdatedAt = "{UPDATED}";', s, count=1)
          if BUILD not in s.splitlines()[6]:
              s = s.replace("// Regression lineage: ", f"// Regression lineage: {BUILD} • ", 1)
          p.write_text(s, encoding="utf-8")

          p = Path("app.js")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'const build = "[^"]+";', f'const build = "{BUILD}";', s, count=1)
          p.write_text(s, encoding="utf-8")

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("head1-world-frame-top-view-v80-20260811-1830", BUILD)
          p.write_text(s, encoding="utf-8")

          p = Path("app/update-manager.js")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'const BUILD_ID = "[^"]+";', f'const BUILD_ID = "{BUILD}";', s, count=1)
          p.write_text(s, encoding="utf-8")

          p = Path("update-manifest.json")
          m = json.loads(p.read_text(encoding="utf-8"))
          m["buildId"] = BUILD
          m["notes"] = "v89 keeps the confirmed Top View-only Bottle Orientation and working Map Builder machine settings unchanged. Label Wipe-Down now uses the operator-facing machine direction: clockwise is left-to-right and counter-clockwise is right-to-left; the legacy runtime direction is only an inverted fallback."
          p.write_text(json.dumps(m, indent=2) + "\n", encoding="utf-8")

          Path("tests/wipe-panel-runtime-direction-v88.test.js").write_text('''"use strict";
          const assert = require("assert");
          const fs = require("fs");
          const path = require("path");
          const source = fs.readFileSync(path.resolve(__dirname, "../app/wipe-telemetry-service.js"), "utf8");
          const start = source.indexOf("function liveWipeMachineDirection()");
          const end = source.indexOf("function wipeVisualApplication", start);
          assert.ok(start >= 0 && end > start);
          const fn = source.slice(start, end);
          const semanticIndex = fn.indexOf('document.getElementById("mapDirection")');
          const mapIndex = fn.indexOf("activeMachineMap");
          const runtimeIndex = fn.indexOf("const runtime = String(state.direction");
          assert.ok(semanticIndex >= 0 && mapIndex >= 0 && runtimeIndex >= 0);
          assert.ok(semanticIndex < mapIndex && mapIndex < runtimeIndex, "semantic UI/map direction must precede internal runtime convention");
          assert.match(source, /semanticMachineDirectionV89: true/);
          console.log("Wipe direction compatibility regression passed under v89 semantic parity.");
          ''', encoding="utf-8")

          Path("tests/wipe-panel-semantic-direction-v89.test.js").write_text('''"use strict";
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const vm = require("node:vm");
          const source = fs.readFileSync(path.resolve(__dirname, "../app/wipe-telemetry-service.js"), "utf8");
          const loader = fs.readFileSync(path.resolve(__dirname, "../app/simulation-collapsible-integration.js"), "utf8");
          let selectedDirection = "cw";
          const sandbox = {
            console,
            document: { getElementById(id) { return id === "mapDirection" ? { value: selectedDirection } : null; } },
            state: { direction: "ccw", buildInputs: { neckApplication: "Center Tack", neckContactMm: 10, bodyContactMm: 10, backContactMm: 0 } },
            activeMachineMap() { return { machineSettings: { direction: "ccw" } }; },
            num(value, fallback = 0) { const parsed = Number(value); return Number.isFinite(parsed) ? parsed : fallback; }
          };
          sandbox.window = sandbox;
          vm.createContext(sandbox);
          vm.runInContext(source, sandbox);
          const service = sandbox.LabelerWipeTelemetryService;
          assert.equal(service.liveWipeMachineDirection(), "cw");
          assert.equal(service.wipeVisualApplication("body", 100).direction, "ltr");
          selectedDirection = "ccw";
          sandbox.state.direction = "cw";
          assert.equal(service.liveWipeMachineDirection(), "ccw");
          assert.equal(service.wipeVisualApplication("body", 100).direction, "rtl");
          assert.match(loader, /wipe-telemetry-service\.js\?v=0\.9\.10-wipe-direction-v89/);
          assert.match(loader, /wipe-telemetry-renderer\.js\?v=0\.9\.10-wipe-direction-v89/);
          console.log("Wipe panel semantic direction v89 regression passed: CW=L->R, CCW=R->L.");
          ''', encoding="utf-8")
          PY

      - name: Validate v89
        run: |
          node --check app/wipe-telemetry-service.js
          node --check app/wipe-telemetry-renderer.js
          node --check app/simulation-collapsible-integration.js
          node --check app/bootstrap.js
          node tests/wipe-direction-machine-parity-v87.test.js
          node tests/wipe-panel-runtime-direction-v88.test.js
          node tests/wipe-panel-semantic-direction-v89.test.js
          node tests/bottle-orientation-runtime-load.test.js
          node tests/bottle-orientation-panel.test.js
          node tests/entry-exit-dead-zone-overlay.test.js
          node tests/apl-roller-coverage-default.test.js

      - name: Commit v89 runtime
        run: |
          git config user.name "ServoForge Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/wipe-telemetry-service.js app/simulation-collapsible-integration.js app/bootstrap.js app.js index.html app/update-manager.js update-manifest.json tests/wipe-panel-runtime-direction-v88.test.js tests/wipe-panel-semantic-direction-v89.test.js
          git commit -m "Fix wipe panel semantic machine direction v89"
          git push
