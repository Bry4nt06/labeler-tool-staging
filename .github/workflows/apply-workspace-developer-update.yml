name: Apply workspace and developer controls

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-workspace-developer-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply ServoForge staging update
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64
          import gzip
          import json
          from datetime import datetime, timezone

          version = "0.9.2"
          integration_payload = ""
          integration_path = Path("app/workspace-developer-integration.js")
          integration_path.write_bytes(gzip.decompress(base64.b64decode(integration_payload)))

          index_path = Path("index.html")
          index_text = index_path.read_text(encoding="utf-8").replace("0.9.1", version)
          index_path.write_text(index_text, encoding="utf-8")

          manager_path = Path("app/update-manager.js")
          manager_text = manager_path.read_text(encoding="utf-8").replace("0.9.1", version)
          module_line = '    "app/workspace-developer-integration.js",'
          diagnostics_line = '    "app/diagnostics-workspace-integration.js",'
          if module_line not in manager_text:
              manager_text = manager_text.replace(diagnostics_line, diagnostics_line + "\n" + module_line)
          manager_path.write_text(manager_text, encoding="utf-8")

          worker_path = Path("service-worker.js")
          worker_text = worker_path.read_text(encoding="utf-8").replace("0.9.1", version)
          asset_line = '  "./app/workspace-developer-integration.js",'
          diagnostics_asset = '  "./app/diagnostics-workspace-integration.js",'
          if asset_line not in worker_text:
              worker_text = worker_text.replace(diagnostics_asset, diagnostics_asset + "\n" + asset_line)
          worker_path.write_text(worker_text, encoding="utf-8")

          manifest_path = Path("update-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = version
          manifest["releaseUrl"] = "https://bry4nt06.github.io/labeler-tool-staging/"
          manifest["downloadUrl"] = manifest["releaseUrl"]
          manifest["notes"] = "STAGING 0.9.2 adds ordered workspace tabs, outside-click panel closing, Developer Mode, panel visibility controls, and read-only locked maps."
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          notes_path = Path("release-notes.json")
          notes = json.loads(notes_path.read_text(encoding="utf-8"))
          notes["environment"] = "staging"
          notes["currentVersion"] = version
          notes["generatedAt"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          release = {
              "version": version,
              "milestone": 12,
              "title": "Workspace Navigation and Developer Controls",
              "summary": "Moves Map Builder into the primary workspace tabs and adds locally authenticated developer controls for panel visibility and read-only map locking.",
              "changes": [
                  "Order the primary navigation as Map Builder, Specs, Build Inputs, Servo Program, Servo Simulation, and Diagnostics.",
                  "Close Settings, Map Builder, map-reference, wipe-data, and open builder detail panels when the user clicks outside them.",
                  "Create a first-use Developer Mode login with locally hashed credentials and session-only unlocking.",
                  "Allow Developer Mode to hide or restore operator panels without modifying saved map data.",
                  "Allow selected maps to be locked and loaded from a Locked Maps dropdown in read-only mode.",
                  "Hide Map Builder and disable specification, Build Input, Servo Program, and direct map editing while a locked map is active."
              ]
          }
          notes["releases"] = [entry for entry in notes.get("releases", []) if entry.get("version") != version]
          notes["releases"].insert(0, release)
          notes_path.write_text(json.dumps(notes, indent=2) + "\n", encoding="utf-8")

          workflow_path = Path(".github/workflows/apply-workspace-developer-update.yml")
          workflow_path.unlink(missing_ok=True)
          PYCODE

      - name: Validate updated application files
        shell: bash
        run: |
          node --check app/workspace-developer-integration.js
          node --check app/update-manager.js
          node --check service-worker.js
          python -m json.tool update-manifest.json >/dev/null
          python -m json.tool release-notes.json >/dev/null
          grep -q 'workspace-developer-integration.js' app/update-manager.js
          grep -q 'workspace-developer-integration.js' service-worker.js
          grep -q 'application-version" content="0.9.2' index.html
          git diff --check

      - name: Commit synchronized staging update
        shell: bash
        run: |
          git config user.name "ServoForge Staging Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add workspace tabs and developer map controls"
          git push origin HEAD:main
