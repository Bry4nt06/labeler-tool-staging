name: Build TopModul DTS3 RPC Angle v328

on:
  push:
    branches:
      - feature/topmodul-dts3-rpc-angle-v328
    paths:
      - .github/workflows/build-topmodul-dts3-rpc-angle-v328.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/topmodul-dts3-rpc-angle-v328
          fetch-depth: 0

      - name: Add TopModul DTS variant and RPC angle driver
        shell: bash
        run: |
          set -euo pipefail
          cat > drivers/translation/topmodul-rpc-angle-driver.js <<'EOF'
          "use strict";

          (function installTopModulRpcAngleDriver(global) {
            if (global.LabelerTopModulRpcAngleDriver) {
              if (typeof module !== "undefined" && module.exports) module.exports = global.LabelerTopModulRpcAngleDriver;
              return;
            }
            const DTS3_PHYSICAL_DEG_PER_RPC_DEG = 8;
            function finite(value) {
              const parsed = Number(value);
              return Number.isFinite(parsed) ? parsed : NaN;
            }
            function token(value) {
              return String(value || "").toUpperCase().replace(/[^A-Z0-9]+/g, "");
            }
            function variant(machineType) {
              const identity = token(machineType);
              if (!identity.includes("TOPMODUL")) return "";
              if (identity.includes("DTS3")) return "dts3";
              return "dts4";
            }
            function fullRpcTableRotation(machineType) {
              return variant(machineType) === "dts3" ? 45 : 360;
            }
            function physicalToRpcTableAngle(value, machineType) {
              const angle = finite(value);
              if (!Number.isFinite(angle)) return angle;
              return variant(machineType) === "dts3" ? angle / DTS3_PHYSICAL_DEG_PER_RPC_DEG : angle;
            }
            function rpcToPhysicalTableAngle(value, machineType) {
              const angle = finite(value);
              if (!Number.isFinite(angle)) return angle;
              return variant(machineType) === "dts3" ? angle * DTS3_PHYSICAL_DEG_PER_RPC_DEG : angle;
            }
            function displayDigits(machineType) {
              return variant(machineType) === "dts3" ? 4 : 1;
            }
            const api = Object.freeze({
              DTS3_PHYSICAL_DEG_PER_RPC_DEG,
              variant,
              fullRpcTableRotation,
              physicalToRpcTableAngle,
              rpcToPhysicalTableAngle,
              displayDigits
            });
            global.LabelerTopModulRpcAngleDriver = api;
            global.LabelerDriverRegistry?.register?.("translation.topmodulRpcAngle", api, {
              version: 1,
              responsibilities: ["topmodul-dts-version", "rpc-table-angle-presentation", "dts3-45-degree-command-domain"]
            });
            if (typeof module !== "undefined" && module.exports) module.exports = api;
          })(typeof window !== "undefined" ? window : globalThis);
          EOF

          cat > app/topmodul-dts-machine-variant-integration.js <<'EOF'
          "use strict";

          (function installTopModulDtsMachineVariant(global) {
            if (global.LabelerTopModulMachineVariant) return;
            const MACHINE_TYPES = Object.freeze([
              "TopMatic",
              "Autocol",
              "TopModul (DTS4)",
              "TopModul (DTS3)",
              "MultiModul"
            ]);
            function canonicalMachineType(value) {
              const raw = String(value || "").trim();
              const token = raw.toUpperCase().replace(/[^A-Z0-9]+/g, "");
              if (token === "TOPMODUL") return "TopModul (DTS4)";
              if (token.includes("TOPMODUL") && token.includes("DTS3")) return "TopModul (DTS3)";
              if (token.includes("TOPMODUL") && token.includes("DTS4")) return "TopModul (DTS4)";
              return raw;
            }
            function migrateState() {
              if (typeof state === "undefined" || !state) return false;
              let changed = false;
              state.machineTypes = MACHINE_TYPES.slice();
              for (const field of ["machineType", "selectedMachineType"]) {
                if (!(field in state)) continue;
                const next = canonicalMachineType(state[field]);
                if (next && next !== state[field]) {
                  state[field] = next;
                  changed = true;
                }
              }
              for (const map of Array.isArray(state.mapLibrary) ? state.mapLibrary : []) {
                if (!map || typeof map !== "object") continue;
                const next = canonicalMachineType(map.machineType);
                if (next && next !== map.machineType) {
                  map.machineType = next;
                  changed = true;
                }
              }
              return changed;
            }
            const api = Object.freeze({ MACHINE_TYPES, canonicalMachineType, migrateState });
            global.LabelerTopModulMachineVariant = api;
            migrateState();
          })(window);
          EOF

      - name: Wire DTS variants into map builder and RPC program presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('app/defaults.js')
          s = p.read_text(encoding='utf-8')
          old = 'machineTypes: ["TopMatic", "Autocol", "TopModul"],'
          new = 'machineTypes: ["TopMatic", "Autocol", "TopModul (DTS4)", "TopModul (DTS3)", "MultiModul"],'
          if old not in s: raise SystemExit('defaults machineTypes anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('app/map-builder-controls.js')
          s = p.read_text(encoding='utf-8')
          old = '''function renderMapLibraryControls() {\n  const map = activeMachineMap();\n  if (!map) return;\n  const libraryLocation = mapLibraryLocation();'''
          new = '''function renderMapLibraryControls() {\n  const map = activeMachineMap();\n  if (!map) return;\n  const topModulVariant = window.LabelerTopModulMachineVariant;\n  if (topModulVariant?.canonicalMachineType) {\n    const canonicalType = topModulVariant.canonicalMachineType(map.machineType);\n    if (canonicalType) map.machineType = canonicalType;\n  }\n  const libraryLocation = mapLibraryLocation();'''
          if old not in s: raise SystemExit('map builder render anchor missing')
          s = s.replace(old, new, 1)
          old = '''    const types = [...new Set(["TopMatic", "Autocol", "TopModul", "MultiModul", ...(state.machineTypes || []), map.machineType || "TopModul"])];'''
          new = '''    const canonicalMachineType = (value) => topModulVariant?.canonicalMachineType?.(value) || String(value || "");\n    const selectedMachineType = canonicalMachineType(map.machineType || "TopModul (DTS4)") || "TopModul (DTS4)";\n    map.machineType = selectedMachineType;\n    const types = [...new Set([\n      "TopMatic", "Autocol", "TopModul (DTS4)", "TopModul (DTS3)", "MultiModul",\n      ...(state.machineTypes || []).map(canonicalMachineType), selectedMachineType\n    ])].filter((type) => type && type !== "TopModul");'''
          if old not in s: raise SystemExit('map builder type list anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('option.selected = type === (map.machineType || "TopModul");', 'option.selected = type === selectedMachineType;', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('app/servo-program-table-renderer.js')
          s = p.read_text(encoding='utf-8')
          anchor = '''function renderProgram() {\n  const commandHeading = activeMachineUsesAutocolCommands() ? "Travel command" : "CMD";\n  els.program.innerHTML = `<table><thead><tr><th>HMI</th><th>PLC</th><th>${commandHeading}</th><th class="num">Table angle</th>'''
          repl = '''function activeServoProgramMachineType() {\n  try {\n    const map = typeof activeMachineMap === "function" ? activeMachineMap() : null;\n    return map?.machineType || state?.machineType || state?.selectedMachineType || "";\n  } catch {\n    return state?.machineType || state?.selectedMachineType || "";\n  }\n}\n\nfunction rpcTableValue(value, machineType) {\n  const driver = window.LabelerTopModulRpcAngleDriver;\n  const converted = driver?.physicalToRpcTableAngle?.(value, machineType);\n  return Number.isFinite(converted) ? converted : value;\n}\n\nfunction renderProgram() {\n  const commandHeading = activeMachineUsesAutocolCommands() ? "Travel command" : "CMD";\n  const machineType = activeServoProgramMachineType();\n  const rpcAngleDriver = window.LabelerTopModulRpcAngleDriver;\n  const dts3 = rpcAngleDriver?.variant?.(machineType) === "dts3";\n  const tableDigits = rpcAngleDriver?.displayDigits?.(machineType) ?? 1;\n  const tableHeading = dts3 ? "Table angle (DTS3 0–45°)" : "Table angle";\n  const tableStep = dts3 ? "0.0001" : "0.5";\n  els.program.innerHTML = `<table><thead><tr><th>HMI</th><th>PLC</th><th>${commandHeading}</th><th class="num">${tableHeading}</th>'''
          if anchor not in s: raise SystemExit('servo renderer header anchor missing')
          s = s.replace(anchor, repl, 1)
          s = s.replace('const tableOverride = Number.isFinite(row.tableAngleOverride) ? fmt(row.tableAngleOverride, 1) : "";', 'const tableOverride = Number.isFinite(row.tableAngleOverride) ? fmt(rpcTableValue(row.tableAngleOverride, machineType), tableDigits) : "";', 1)
          old = '<td><input class="num compact-input generated-angle" type="number" value="${fmt(row.generatedTableAngle, 1)}" readonly title="Generated table angle"></td><td><input class="num compact-input angle-override${tableOverride !== "" ? " active-override" : ""}" data-program-field="tableAngle" type="number" step="0.5" placeholder="Override" value="${tableOverride}" aria-label="Override table angle for HMI ${row.hmi}"></td>'
          new = '<td><input class="num compact-input generated-angle" type="number" value="${fmt(rpcTableValue(row.generatedTableAngle, machineType), tableDigits)}" readonly title="${dts3 ? "DTS3 RPC table angle; 45° equals one physical table revolution" : "Generated table angle"}"></td><td><input class="num compact-input angle-override${tableOverride !== "" ? " active-override" : ""}" data-program-field="tableAngle" type="number" step="${tableStep}" placeholder="Override" value="${tableOverride}" aria-label="Override ${dts3 ? "DTS3 RPC " : ""}table angle for HMI ${row.hmi}"></td>'
          if old not in s: raise SystemExit('servo renderer angle input anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('<td class="num">${fmt(row.tableTravel, 1)}</td>', '<td class="num">${fmt(rpcTableValue(row.tableTravel, machineType), tableDigits)}</td>', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('app/controllers/servo-program-event-controller.js')
          s = p.read_text(encoding='utf-8')
          anchor = '''  function isOverrideField(field) {\n    return field === "tableAngle" || field === "plateAngle";\n  }\n\n  function stageOverride(target) {'''
          repl = '''  function isOverrideField(field) {\n    return field === "tableAngle" || field === "plateAngle";\n  }\n\n  function internalOverrideValue(field, value) {\n    if (field !== "tableAngle" || String(value ?? "").trim() === "") return value;\n    const driver = global.LabelerTopModulRpcAngleDriver;\n    if (!driver?.rpcToPhysicalTableAngle) return value;\n    let machineType = "";\n    try {\n      const map = typeof activeMachineMap === "function" ? activeMachineMap() : null;\n      machineType = map?.machineType || state?.machineType || state?.selectedMachineType || "";\n    } catch {\n      machineType = state?.machineType || state?.selectedMachineType || "";\n    }\n    const converted = driver.rpcToPhysicalTableAngle(value, machineType);\n    return Number.isFinite(converted) ? String(converted) : value;\n  }\n\n  function stageOverride(target) {'''
          if anchor not in s: raise SystemExit('servo event override anchor missing')
          s = s.replace(anchor, repl, 1)
          s = s.replace('program.updateOverride(context.hmi, context.field, target.value);', 'program.updateOverride(context.hmi, context.field, internalOverrideValue(context.field, target.value));', 1)
          s = s.replace('program.commitOverride(context.hmi, context.field, target.value);', 'program.commitOverride(context.hmi, context.field, internalOverrideValue(context.field, target.value));', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('app/controllers/servo-program-controller.js')
          s = p.read_text(encoding='utf-8')
          anchor = '''  function finishedMetric(value) {\n    const rendered = actions.call("finishAngle", value);\n    const number = Number(rendered);\n    return Number.isFinite(number) ? number : Number(value);\n  }\n\n  function refreshProgramMetricsInPlace() {'''
          repl = '''  function finishedMetric(value) {\n    const rendered = actions.call("finishAngle", value);\n    const number = Number(rendered);\n    return Number.isFinite(number) ? number : Number(value);\n  }\n\n  function activeRpcMachineType() {\n    try {\n      const map = typeof activeMachineMap === "function" ? activeMachineMap() : null;\n      return map?.machineType || state?.machineType || state?.selectedMachineType || "";\n    } catch {\n      return state?.machineType || state?.selectedMachineType || "";\n    }\n  }\n\n  function displayTableMetric(value) {\n    const machineType = activeRpcMachineType();\n    const driver = global.LabelerTopModulRpcAngleDriver;\n    const converted = driver?.physicalToRpcTableAngle?.(value, machineType);\n    return { value: Number.isFinite(converted) ? converted : value, digits: driver?.displayDigits?.(machineType) ?? 1 };\n  }\n\n  function refreshProgramMetricsInPlace() {'''
          if anchor not in s: raise SystemExit('servo controller metric anchor missing')
          s = s.replace(anchor, repl, 1)
          old = 'cells[7].textContent = formatMetric(row.tableTravel, 1);'
          new = 'const tableMetric = displayTableMetric(row.tableTravel);\n      cells[7].textContent = formatMetric(tableMetric.value, tableMetric.digits);'
          if old not in s: raise SystemExit('servo controller table travel anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('app/controllers/transfer-controller.js')
          s = p.read_text(encoding='utf-8')
          anchor = '''  function exportCsv() {\n    const autocol = Boolean(actions.call("activeMachineUsesAutocolCommands"));\n    const rows = [['''
          repl = '''  function activeRpcMachineType() {\n    try {\n      const map = typeof activeMachineMap === "function" ? activeMachineMap() : null;\n      return map?.machineType || state?.machineType || state?.selectedMachineType || "";\n    } catch {\n      return state?.machineType || state?.selectedMachineType || "";\n    }\n  }\n\n  function rpcTableOutput(value, machineType) {\n    const driver = global.LabelerTopModulRpcAngleDriver;\n    const converted = driver?.physicalToRpcTableAngle?.(value, machineType);\n    const result = Number.isFinite(converted) ? converted : Number(value);\n    if (!Number.isFinite(result)) return value;\n    return driver?.variant?.(machineType) === "dts3" ? result.toFixed(4) : (actions.call("oneDecimalOutput", result) ?? result);\n  }\n\n  function exportCsv() {\n    const autocol = Boolean(actions.call("activeMachineUsesAutocolCommands"));\n    const machineType = activeRpcMachineType();\n    const dts3 = global.LabelerTopModulRpcAngleDriver?.variant?.(machineType) === "dts3";\n    const rows = [['''
          if anchor not in s: raise SystemExit('transfer export anchor missing')
          s = s.replace(anchor, repl, 1)
          s = s.replace('      "Table Angle",', '      dts3 ? "Table Angle (DTS3 0-45)" : "Table Angle",', 1)
          s = s.replace('      actions.call("oneDecimalOutput", row.tableAngle) ?? row.tableAngle,', '      rpcTableOutput(row.tableAngle, machineType),', 1)
          s = s.replace('      actions.call("oneDecimalOutput", row.tableTravel) ?? row.tableTravel,', '      rpcTableOutput(row.tableTravel, machineType),', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('app/servo-program-print-integration.js')
          s = p.read_text(encoding='utf-8')
          anchor = '  function selectedLabelSnapshot() {'
          helper = '''  function rpcTableValue(value, machineType) {\n    const driver = global.LabelerTopModulRpcAngleDriver;\n    const converted = driver?.physicalToRpcTableAngle?.(value, machineType);\n    return Number.isFinite(converted) ? converted : value;\n  }\n\n  function selectedLabelSnapshot() {'''
          if anchor not in s: raise SystemExit('print helper anchor missing')
          s = s.replace(anchor, helper, 1)
          old = '''    const rows = programRows(sourceKind);\n    const profile = sourceKind === "simulation" ? activeProfileSnapshot() : null;'''
          new = '''    const rows = programRows(sourceKind);\n    const rpcDriver = global.LabelerTopModulRpcAngleDriver;\n    const dts3 = rpcDriver?.variant?.(map?.machineType) === "dts3";\n    const rpcTableDigits = rpcDriver?.displayDigits?.(map?.machineType) ?? 1;\n    const displayRows = rows.map((row) => ({\n      ...row,\n      tableAngle: rpcTableValue(row?.tableAngle, map?.machineType),\n      generatedTableAngle: rpcTableValue(row?.generatedTableAngle, map?.machineType),\n      tableTravel: rpcTableValue(row?.tableTravel, map?.machineType)\n    }));\n    const profile = sourceKind === "simulation" ? activeProfileSnapshot() : null;'''
          if old not in s: raise SystemExit('print rows anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('      rows,\n      parameters:', '      rows: displayRows,\n      rpcTableDigits,\n      rpcTableHeading: dts3 ? "Table Angle (DTS3 0–45°)" : "Table Angle",\n      rpcTableScale: dts3 ? "45° RPC = 360° physical table" : "360° RPC = 360° physical table",\n      parameters:', 1)
          s = s.replace('  function printRowsHtml(rows) {', '  function printRowsHtml(rows, tableDigits = 1) {', 1)
          s = s.replace('formatted(row?.tableAngle ?? row?.generatedTableAngle, 1)', 'formatted(row?.tableAngle ?? row?.generatedTableAngle, tableDigits)', 1)
          s = s.replace('formatted(row?.tableTravel, 1)', 'formatted(row?.tableTravel, tableDigits)', 1)
          s = s.replace('      summaryItem("Machine Type", model.machineType),', '      summaryItem("Machine Type", model.machineType),\n      summaryItem("RPC Table Scale", model.rpcTableScale, true),', 1)
          s = s.replace('<thead><tr><th>HMI</th><th>CMD</th><th>Table Angle</th><th>Bottle Angle</th>', '<thead><tr><th>HMI</th><th>CMD</th><th>${escapeHtml(model.rpcTableHeading)}</th><th>Bottle Angle</th>', 1)
          s = s.replace('<tbody>${printRowsHtml(model.rows)}</tbody>', '<tbody>${printRowsHtml(model.rows, model.rpcTableDigits)}</tbody>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Load DTS runtime and bump staging build
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          old_build = 'troubleshooting-machine-scope-v375-20260910-1426'
          new_build = 'topmodul-dts3-rpc-angle-v328-20260910-1832'
          p = Path('app/bootstrap.js')
          s = p.read_text(encoding='utf-8')
          anchor = '    "app/update-loop-guard-integration.js",\n'
          add = '    "drivers/translation/topmodul-rpc-angle-driver.js",\n    "app/topmodul-dts-machine-variant-integration.js",\n' + anchor
          if 'topmodul-rpc-angle-driver.js' not in s:
              if anchor not in s: raise SystemExit('bootstrap module anchor missing')
              s = s.replace(anchor, add, 1)
          s = s.replace(old_build, new_build).replace('Sep 10, 2026 2:26 PM ET', 'Sep 10, 2026 6:32 PM ET')
          p.write_text(s, encoding='utf-8')
          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          anchor = '  "./drivers/translation/profile-translator-driver.js",\n'
          if './drivers/translation/topmodul-rpc-angle-driver.js' not in s:
              if anchor not in s: raise SystemExit('service worker driver anchor missing')
              s = s.replace(anchor, '  "./drivers/translation/topmodul-rpc-angle-driver.js",\n' + anchor, 1)
          anchor = '  "./app/machine-profile-framing.js",\n'
          if './app/topmodul-dts-machine-variant-integration.js' not in s:
              if anchor not in s: raise SystemExit('service worker app anchor missing')
              s = s.replace(anchor, '  "./app/topmodul-dts-machine-variant-integration.js",\n' + anchor, 1)
          s = s.replace(old_build, new_build)
          p.write_text(s, encoding='utf-8')
          for name in ['app.js', 'app/profile-generation.js', 'app/update-manager.js', 'index.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if old_build not in s: raise SystemExit(f'expected prior build id missing from {name}')
              p.write_text(s.replace(old_build, new_build), encoding='utf-8')
          manifest = {
            'schemaVersion': 1, 'version': '0.9.10', 'buildId': new_build,
            'releaseUrl': './', 'downloadUrl': './',
            'notes': 'TopModul DTS variant support v328. Existing TopModul maps are treated as DTS4. New TopModul (DTS3) maps keep physical machine geometry at 0-360 degrees but present/edit/export RPC table angles on the legacy 0-45 degree command domain (8 physical degrees per 1 DTS3 RPC table degree). Adds 4-decimal DTS3 table-angle precision and preserves TopModul family validation.'
          }
          Path('update-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Add DTS3 regression coverage
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/topmodul-dts3-rpc-angle-v328.test.js <<'EOF'
          "use strict";
          const test = require("node:test");
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const driver = require("../drivers/translation/topmodul-rpc-angle-driver.js");
          const read = (file) => fs.readFileSync(path.join(__dirname, "..", file), "utf8");
          test("legacy TopModul remains DTS4 while DTS3 gets a 45 degree RPC table domain", () => {
            assert.equal(driver.variant("TopModul"), "dts4");
            assert.equal(driver.variant("TopModul (DTS4)"), "dts4");
            assert.equal(driver.variant("TopModul (DTS3)"), "dts3");
            assert.equal(driver.fullRpcTableRotation("TopModul (DTS4)"), 360);
            assert.equal(driver.fullRpcTableRotation("TopModul (DTS3)"), 45);
          });
          test("DTS3 table angles scale linearly between physical and RPC coordinates", () => {
            assert.equal(driver.physicalToRpcTableAngle(0, "TopModul (DTS3)"), 0);
            assert.equal(driver.physicalToRpcTableAngle(90, "TopModul (DTS3)"), 11.25);
            assert.equal(driver.physicalToRpcTableAngle(180, "TopModul (DTS3)"), 22.5);
            assert.equal(driver.physicalToRpcTableAngle(270, "TopModul (DTS3)"), 33.75);
            assert.equal(driver.physicalToRpcTableAngle(360, "TopModul (DTS3)"), 45);
            assert.equal(driver.rpcToPhysicalTableAngle(45, "TopModul (DTS3)"), 360);
            assert.equal(driver.physicalToRpcTableAngle(450, "TopModul (DTS3)"), 56.25);
          });
          test("DTS4 and non-TopModul coordinates remain unchanged", () => {
            assert.equal(driver.physicalToRpcTableAngle(360, "TopModul (DTS4)"), 360);
            assert.equal(driver.physicalToRpcTableAngle(360, "TopModul"), 360);
            assert.equal(driver.physicalToRpcTableAngle(360, "Autocol"), 360);
            assert.equal(driver.displayDigits("TopModul (DTS3)"), 4);
            assert.equal(driver.displayDigits("TopModul (DTS4)"), 1);
          });
          test("machine builder exposes explicit DTS variants and RPC-facing outputs use the adapter", () => {
            const defaults = read("app/defaults.js");
            const controls = read("app/map-builder-controls.js");
            const renderer = read("app/servo-program-table-renderer.js");
            const events = read("app/controllers/servo-program-event-controller.js");
            const transfer = read("app/controllers/transfer-controller.js");
            const print = read("app/servo-program-print-integration.js");
            assert.match(defaults, /TopModul \(DTS4\)/);
            assert.match(defaults, /TopModul \(DTS3\)/);
            assert.match(controls, /canonicalMachineType/);
            assert.match(renderer, /DTS3 0–45°/);
            assert.match(renderer, /physicalToRpcTableAngle/);
            assert.match(events, /rpcToPhysicalTableAngle/);
            assert.match(transfer, /Table Angle \(DTS3 0-45\)/);
            assert.match(print, /RPC Table Scale/);
          });
          EOF

      - name: Validate DTS3 implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check drivers/translation/topmodul-rpc-angle-driver.js
          node --check app/topmodul-dts-machine-variant-integration.js
          node --check app/map-builder-controls.js
          node --check app/servo-program-table-renderer.js
          node --check app/controllers/servo-program-controller.js
          node --check app/controllers/servo-program-event-controller.js
          node --check app/controllers/transfer-controller.js
          node --check app/servo-program-print-integration.js
          node tests/topmodul-dts3-rpc-angle-v328.test.js
          node tests/servo-simulation-presentation-boundaries.test.js

      - name: Commit DTS3 support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ServoForge Staging Builder"
          git config user.email "actions@users.noreply.github.com"
