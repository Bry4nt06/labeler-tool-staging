name: Build Troubleshooting Machine Scope v375

on:
  push:
    branches:
      - feature/troubleshooting-machine-scope-v375
    paths:
      - .github/workflows/build-troubleshooting-machine-scope-v375.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/troubleshooting-machine-scope-v375
          fetch-depth: 0

      - name: Add machine and application scope runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > app/troubleshooting/machine-scope-filter-v375.js <<'EOF'
          "use strict";

          (function installTroubleshootingMachineScope(global) {
            const base = global.ServoForgeTroubleshootingLibrary;
            if (!base || global.ServoForgeTroubleshootingMachineScope) return;

            const SCOPE_KEY = "servoforge-troubleshooting-scope-v1";
            const SETTINGS_KEY = "labelerToolSettings";
            const VALID_MACHINES = new Set(["auto", "all", "autocol", "multimodul", "topmodul"]);
            const VALID_APPLICATIONS = new Set(["auto", "all", "apl", "cold-glue"]);
            const MACHINE_LABELS = Object.freeze({
              all: "All Machines",
              autocol: "Autocol",
              multimodul: "MultiModul",
              topmodul: "TopModul"
            });
            const APPLICATION_LABELS = Object.freeze({
              all: "All Applications",
              apl: "APL",
              "cold-glue": "Cold Glue"
            });

            function safeJson(raw, fallback = null) {
              try { return JSON.parse(raw); }
              catch { return fallback; }
            }

            function normalizeText(value) {
              return String(value ?? "")
                .replace(/[_-]+/g, " ")
                .replace(/\s+/g, " ")
                .trim()
                .toUpperCase();
            }

            function canonicalMachine(value) {
              const text = normalizeText(value).replaceAll(" ", "");
              if (text.includes("AUTOCOL")) return "autocol";
              if (text.includes("MULTIMODUL")) return "multimodul";
              if (text.includes("TOPMODUL")) return "topmodul";
              return "all";
            }

            function canonicalApplication(value) {
              const text = normalizeText(value).replaceAll(" ", "");
              if (text === "APL" || text.includes("AUTOMATICPRESSURESENSITIVE")) return "apl";
              if (text.includes("COLDGLUE")) return "cold-glue";
              return "all";
            }

            function readSavedMachineContext() {
              let saved = {};
              try { saved = safeJson(global.localStorage?.getItem(SETTINGS_KEY), {}) || {}; } catch { saved = {}; }
              const mapLibrary = Array.isArray(saved.mapLibrary) ? saved.mapLibrary : [];
              const activeMap = mapLibrary.find((map) => map?.id === saved.activeMapId) || null;
              return {
                machineType: activeMap?.machineType || saved.machineType || "",
                applicationMode: activeMap?.applicationMode || activeMap?.application || saved.applicationMode || ""
              };
            }

            function readSelections() {
              let stored = {};
              try { stored = safeJson(global.localStorage?.getItem(SCOPE_KEY), {}) || {}; } catch { stored = {}; }
              const machine = VALID_MACHINES.has(String(stored.machine || "")) ? String(stored.machine) : "auto";
              const application = VALID_APPLICATIONS.has(String(stored.application || "")) ? String(stored.application) : "auto";
              return { machine, application };
            }

            let selections = readSelections();

            function writeSelections() {
              try { global.localStorage?.setItem(SCOPE_KEY, JSON.stringify(selections)); } catch { }
            }

            function resolvedScope(context = {}) {
              const detected = { ...readSavedMachineContext(), ...(context || {}) };
              const detectedMachine = canonicalMachine(detected.machineType);
              const detectedApplication = canonicalApplication(detected.applicationMode);
              const machine = selections.machine === "auto" ? detectedMachine : selections.machine;
              const application = selections.application === "auto" ? detectedApplication : selections.application;
              return {
                machine,
                application,
                detectedMachine,
                detectedApplication,
                context: {
                  ...(context || {}),
                  machineType: machine === "all" ? "" : MACHINE_LABELS[machine],
                  applicationMode: application === "all" ? "" : application
                }
              };
            }

            function sourceFor(ref) {
              try { return base.getSource?.(ref?.sourceId) || null; }
              catch { return null; }
            }

            function recordText(record) {
              const parts = [
                record?.id,
                record?.code,
                record?.title,
                record?.summary,
                record?.description,
                record?.category,
                record?.machineType,
                record?.machineFamily,
                record?.applicationMode,
                record?.application,
                ...(Array.isArray(record?.aliases) ? record.aliases : []),
                ...(Array.isArray(record?.machineTypes) ? record.machineTypes : []),
                ...(Array.isArray(record?.machineFamilies) ? record.machineFamilies : []),
                ...(Array.isArray(record?.applications) ? record.applications : []),
                ...(Array.isArray(record?.topics) ? record.topics : [])
              ];
              for (const ref of Array.isArray(record?.sourceRefs) ? record.sourceRefs : []) {
                const source = sourceFor(ref);
                if (!source) continue;
                parts.push(source.id, source.title, source.file, source.notes, ...(Array.isArray(source.topics) ? source.topics : []));
              }
              return normalizeText(parts.filter(Boolean).join(" "));
            }

            function explicitMachines(record) {
              const text = recordText(record);
              const machines = new Set();
              if (/\bAUTOCOL\b/.test(text)) machines.add("autocol");
              if (/\bMULTI\s*MODUL\b/.test(text) || /\bMULTIMODUL\b/.test(text)) machines.add("multimodul");
              if (/\bTOP\s*MODUL\b/.test(text) || /\bTOPMODUL\b/.test(text)) machines.add("topmodul");
              return machines;
            }

            function explicitApplications(record) {
              const text = recordText(record);
              const applications = new Set();
              if (/\bAPL\b/.test(text)) applications.add("apl");
              if (/\bCOLD\s*GLUE\b/.test(text) || /\bCOLDGLUE\b/.test(text)) applications.add("cold-glue");
              return applications;
            }

            function recordMatches(record, scope) {
              const machines = explicitMachines(record);
              const applications = explicitApplications(record);
              const machineOk = scope.machine === "all" || machines.size === 0 || machines.has(scope.machine);
              const applicationOk = scope.application === "all" || applications.size === 0 || applications.has(scope.application);
              return machineOk && applicationOk;
            }

            function searchEntries(query, context = {}, limit = 8) {
              const requested = Math.max(1, Number(limit) || 8);
              const scope = resolvedScope(context);
              const poolLimit = Math.max(requested, Array.isArray(base.entries) ? base.entries.length : 128);
              const rows = base.searchEntries.call(base, query, scope.context, poolLimit);
              return rows.filter((entry) => recordMatches(entry, scope)).slice(0, requested);
            }

            function recommendFlows(context = {}) {
              const scope = resolvedScope(context);
              const rows = typeof base.recommendFlows === "function"
                ? base.recommendFlows.call(base, scope.context)
                : (Array.isArray(base.flows) ? base.flows : []);
              return rows.filter((flow) => recordMatches(flow, scope));
            }

            function searchSources(query, limit) {
              const requested = Math.max(1, Number(limit) || (Array.isArray(base.sources) ? base.sources.length : 100));
              const scope = resolvedScope(readSavedMachineContext());
              const poolLimit = Math.max(requested, Array.isArray(base.sources) ? base.sources.length : requested);
              const rows = base.searchSources.call(base, query, poolLimit);
              return rows.filter((source) => recordMatches(source, scope)).slice(0, requested);
            }

            function setMachineScope(value) {
              const next = String(value || "auto");
              selections.machine = VALID_MACHINES.has(next) ? next : "auto";
              writeSelections();
              return selections.machine;
            }

            function setApplicationScope(value) {
              const next = String(value || "auto");
              selections.application = VALID_APPLICATIONS.has(next) ? next : "auto";
              writeSelections();
              return selections.application;
            }

            function getScope(context = {}) {
              return { selections: { ...selections }, ...resolvedScope(context) };
            }

            const api = Object.freeze({
              version: "v375",
              getScope,
              setMachineScope,
              setApplicationScope,
              recordMatches,
              canonicalMachine,
              canonicalApplication
            });

            global.ServoForgeTroubleshootingMachineScope = api;
            global.ServoForgeTroubleshootingLibrary = Object.freeze({
              ...base,
              searchEntries,
              recommendFlows,
              searchSources,
              machineScope: api
            });

            function installControls() {
              if (typeof document === "undefined" || document.getElementById("troubleshootingMachineScope")) return;
              const context = document.getElementById("troubleshootingContext");
              if (!context?.parentElement) return;
              const wrapper = document.createElement("div");
              wrapper.className = "sf-machine-scope-controls";
              wrapper.innerHTML = `
                <label>Machine Scope
                  <select id="troubleshootingMachineScope" aria-label="Troubleshooting machine scope">
                    <option value="auto">Auto (current setup)</option>
                    <option value="autocol">Autocol</option>
                    <option value="multimodul">MultiModul</option>
                    <option value="topmodul">TopModul</option>
                    <option value="all">All Machines</option>
                  </select>
                </label>
                <label>Application
                  <select id="troubleshootingApplicationScope" aria-label="Troubleshooting application scope">
                    <option value="auto">Auto (current setup)</option>
                    <option value="apl">APL</option>
                    <option value="cold-glue">Cold Glue</option>
                    <option value="all">All Applications</option>
                  </select>
                </label>
                <span id="troubleshootingScopeStatus" class="sf-machine-scope-status"></span>`;
              context.insertAdjacentElement("afterend", wrapper);

              const style = document.createElement("style");
              style.id = "troubleshootingMachineScopeStyles";
              style.textContent = `
                .sf-machine-scope-controls{display:grid;grid-template-columns:minmax(180px,240px) minmax(180px,240px) 1fr;gap:10px;align-items:end;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
                .sf-machine-scope-controls label{display:grid;gap:5px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
                .sf-machine-scope-controls select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--input);color:var(--ink)}
                .sf-machine-scope-status{align-self:center;color:var(--muted);font-size:11px;line-height:1.45}
                @media(max-width:780px){.sf-machine-scope-controls{grid-template-columns:1fr}.sf-machine-scope-status{padding-top:2px}}
              `;
              document.head.appendChild(style);

              const machineSelect = document.getElementById("troubleshootingMachineScope");
              const applicationSelect = document.getElementById("troubleshootingApplicationScope");
              const status = document.getElementById("troubleshootingScopeStatus");
              machineSelect.value = selections.machine;
              applicationSelect.value = selections.application;

              const renderStatus = () => {
                const saved = readSavedMachineContext();
                const scope = resolvedScope(saved);
                const machineText = selections.machine === "auto"
                  ? (scope.detectedMachine === "all" ? "Auto: no machine detected" : `Auto detected: ${MACHINE_LABELS[scope.detectedMachine]}`)
                  : MACHINE_LABELS[scope.machine];
                const appText = selections.application === "auto"
                  ? (scope.detectedApplication === "all" ? "all applications" : APPLICATION_LABELS[scope.detectedApplication])
                  : APPLICATION_LABELS[scope.application];
                status.textContent = `${machineText} • ${appText}. Machine-specific records outside this scope are hidden; universal records remain available.`;
              };
              renderStatus();

              const apply = () => {
                setMachineScope(machineSelect.value);
                setApplicationScope(applicationSelect.value);
                renderStatus();
                global.location?.reload?.();
              };
              machineSelect.addEventListener("change", apply);
              applicationSelect.addEventListener("change", apply);
            }

            if (typeof document !== "undefined") {
              if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", installControls, { once: true });
              else installControls();
            }
          })(typeof window !== "undefined" ? window : globalThis);
          EOF

      - name: Add scope UI to troubleshooting shell and offline cache
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          idx = Path('app/troubleshooting/index.html')
          text = idx.read_text(encoding='utf-8')
          text = text.replace('data-troubleshooting-version="v374">STAGING / TEST BUILD — TROUBLESHOOTING v374', 'data-troubleshooting-version="v375">STAGING / TEST BUILD — TROUBLESHOOTING v375', 1)
          anchor = '        "./troubleshooting-app.js?v=0.9.10&build=troubleshooting-app-v367.2-20260906&shell=v358",\n'
          addition = '        "./machine-scope-filter-v375.js?v=0.9.10&build=troubleshooting-machine-scope-v375-20260910-1426&shell=v358",\n' + anchor
          if 'machine-scope-filter-v375.js' not in text:
              if anchor not in text:
                  raise SystemExit('troubleshooting app manifest anchor missing')
              text = text.replace(anchor, addition, 1)
          idx.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_anchor = '  "./app/troubleshooting/troubleshooting-app.js",\n'
          sw_add = '  "./app/troubleshooting/machine-scope-filter-v375.js",\n' + sw_anchor
          if 'machine-scope-filter-v375.js' not in sw_text:
              if sw_anchor not in sw_text:
                  raise SystemExit('service worker troubleshooting anchor missing')
              sw_text = sw_text.replace(sw_anchor, sw_add, 1)
          sw.write_text(sw_text, encoding='utf-8')
          PY

      - name: Bump staging build identity
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          old = 'multimodul-router-cmd7-grammar-v327-20260910-1210'
          new = 'troubleshooting-machine-scope-v375-20260910-1426'
          for name in ['app.js','app/bootstrap.js','app/profile-generation.js','app/update-manager.js','index.html','service-worker.js']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected prior build id missing from {name}')
              text = text.replace(old, new)
              if name == 'app/bootstrap.js':
                  text = text.replace('Sep 10, 2026 12:10 PM ET', 'Sep 10, 2026 2:26 PM ET')
              path.write_text(text, encoding='utf-8')

          manifest_path = Path('update-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('buildId') != old:
              raise SystemExit(f'unexpected manifest build {manifest.get("buildId")}')
          manifest['buildId'] = new
          manifest['notes'] = ('Troubleshooting v375: adds persistent Machine Scope and Application filters. Auto reads the active ServoForge map, while explicit Autocol, MultiModul, TopModul, APL, or Cold Glue scopes hide conflicting machine/application-specific records and retain universal diagnostic evidence.')
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Add regression coverage
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/troubleshooting-machine-scope-v375.test.js <<'EOF'
          "use strict";

          const test = require("node:test");
          const assert = require("node:assert/strict");

          function install(settings = {}) {
            global.window = global;
            delete global.document;
            const storage = new Map();
            storage.set("labelerToolSettings", JSON.stringify(settings));
            global.localStorage = {
              getItem: (key) => storage.has(key) ? storage.get(key) : null,
              setItem: (key, value) => storage.set(key, String(value))
            };

            const sources = [
              { id: "src-autocol", title: "Autocol RPC reference", topics: ["Autocol", "RPC"] },
              { id: "src-topmodul", title: "TopModul station reference", topics: ["TopModul"] },
              { id: "src-apl", title: "APL common reference", topics: ["APL"] },
              { id: "src-cold", title: "Cold Glue common reference", topics: ["Cold Glue"] },
              { id: "src-universal", title: "Universal encoder reference", topics: ["encoder"] }
            ];
            const entries = [
              { id: "autocol", title: "Autocol encoder", summary: "Autocol machine fault", sourceRefs: [{ sourceId: "src-autocol" }] },
              { id: "topmodul", title: "TopModul encoder", summary: "TopModul machine fault", sourceRefs: [{ sourceId: "src-topmodul" }] },
              { id: "multimodul", title: "MultiModul encoder", summary: "MultiModul machine fault", sourceRefs: [] },
              { id: "apl", title: "APL label supply", summary: "APL application fault", sourceRefs: [{ sourceId: "src-apl" }] },
              { id: "cold", title: "Cold Glue brush", summary: "Cold Glue application fault", sourceRefs: [{ sourceId: "src-cold" }] },
              { id: "universal", title: "Encoder fault", summary: "Generic encoder diagnostic", sourceRefs: [{ sourceId: "src-universal" }] }
            ];
            const flows = [
              { id: "flow-top", title: "TopModul station", description: "TopModul station diagnosis" },
              { id: "flow-auto", title: "Autocol RPC", description: "Autocol RPC diagnosis" },
              { id: "flow-general", title: "Electrical power", description: "Universal power diagnosis" }
            ];
            const base = {
              entries,
              sources,
              flows,
              getSource: (id) => sources.find((source) => source.id === id) || null,
              searchEntries: (_query, _context, limit) => entries.slice(0, limit),
              searchSources: (_query, limit) => sources.slice(0, limit),
              recommendFlows: () => flows.slice(),
              normalize: (value) => String(value || "").toLowerCase()
            };
            global.ServoForgeTroubleshootingLibrary = base;
            delete global.ServoForgeTroubleshootingMachineScope;
            delete require.cache[require.resolve("../app/troubleshooting/machine-scope-filter-v375.js")];
            require("../app/troubleshooting/machine-scope-filter-v375.js");
            return { library: global.ServoForgeTroubleshootingLibrary, api: global.ServoForgeTroubleshootingMachineScope };
          }

          test("Auto machine/application scope follows the active Autocol APL map", () => {
            const { library, api } = install({
              activeMapId: "map-1",
              mapLibrary: [{ id: "map-1", machineType: "Autocol", applicationMode: "apl" }]
            });
            assert.equal(api.getScope({}).machine, "autocol");
            assert.equal(api.getScope({}).application, "apl");
            assert.deepEqual(library.searchEntries("encoder", {}, 20).map((row) => row.id), ["autocol", "apl", "universal"]);
            assert.deepEqual(library.recommendFlows({}).map((row) => row.id), ["flow-auto", "flow-general"]);
            assert.deepEqual(library.searchSources("", 20).map((row) => row.id), ["src-autocol", "src-apl", "src-universal"]);
          });

          test("explicit scopes override the active map and All Machines removes machine filtering", () => {
            const { library, api } = install({ machineType: "TopModul", applicationMode: "cold-glue" });
            api.setMachineScope("autocol");
            api.setApplicationScope("all");
            assert.deepEqual(library.searchEntries("fault", {}, 20).map((row) => row.id), ["autocol", "apl", "cold", "universal"]);
            api.setMachineScope("all");
            assert.deepEqual(library.searchEntries("fault", {}, 20).map((row) => row.id), ["autocol", "topmodul", "multimodul", "apl", "cold", "universal"]);
          });
          EOF

      - name: Validate troubleshooting v375
        shell: bash
        run: |
          set -euo pipefail
          node --check app/troubleshooting/machine-scope-filter-v375.js
          node --test tests/troubleshooting-machine-scope-v375.test.js
          node --test tests/troubleshooting-library.test.js tests/troubleshooting-startup-responsiveness.test.js
          grep -q 'data-troubleshooting-version="v375"' app/troubleshooting/index.html
          grep -q 'machine-scope-filter-v375.js' app/troubleshooting/index.html
          grep -q 'app/troubleshooting/machine-scope-filter-v375.js' service-worker.js
          grep -q 'troubleshooting-machine-scope-v375-20260910-1426' update-manifest.json

      - name: Commit troubleshooting v375
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ServoForge Staging Fix"
          git config user.email "actions@users.noreply.github.com"
          git add app/troubleshooting/machine-scope-filter-v375.js app/troubleshooting/index.html service-worker.js app.js app/bootstrap.js app/profile-generation.js app/update-manager.js index.html update-manifest.json tests/troubleshooting-machine-scope-v375.test.js
          git commit -m "feat: add troubleshooting machine and application scope v375 [skip ci]"
          git push origin HEAD:feature/troubleshooting-machine-scope-v375
