name: Diagnose animation runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-animation-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Trace animation state and runtime ownership
        run: |
          echo '=== normalizeAssembly references ==='
          grep -R -n --exclude-dir=.git -E 'normalizeAssembly' app drivers app.js index.html || true
          echo '=== isPlaying references ==='
          grep -R -n --exclude-dir=.git -E 'isPlaying' app app.js index.html || true
          echo '=== renderAnimationFrame owners ==='
          grep -R -n --exclude-dir=.git -E '^function renderAnimationFrame|global\.renderAnimationFrame|window\.renderAnimationFrame' app app.js index.html || true
          echo '=== renderer loader references ==='
          grep -R -n --exclude-dir=.git -E 'workspace-status-renderer\.js|map-animation-renderer\.js|animation-runtime\.js' app app.js index.html service-worker.js || true
          echo '=== overlay panel source ==='
          grep -n -A12 -B3 'map-overlay-control' index.html || true
      - name: Install browser harness
        run: npm install --no-save puppeteer-core@24.16.0
      - name: Exercise actual app in headless Chrome
        run: |
          python3 -m http.server 8000 >/tmp/servoforge-http.log 2>&1 &
          cat > /tmp/servoforge-browser-test.cjs <<'NODE'
          const puppeteer = require(process.cwd() + '/node_modules/puppeteer-core');
          const fs = require('fs');

          (async () => {
            const candidates = ['/usr/bin/google-chrome', '/usr/bin/google-chrome-stable', '/usr/bin/chromium', '/usr/bin/chromium-browser'];
            const executablePath = candidates.find((path) => fs.existsSync(path));
            if (!executablePath) throw new Error('No Chrome/Chromium executable found on runner.');
            const browser = await puppeteer.launch({ executablePath, headless: true, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const page = await browser.newPage();
            const consoleMessages = [];
            const pageErrors = [];
            page.on('console', async (msg) => {
              const args = [];
              for (const handle of msg.args()) {
                try {
                  args.push(await handle.evaluate((value) => value instanceof Error
                    ? { name: value.name, message: value.message, stack: value.stack }
                    : value));
                } catch { args.push('[unserializable]'); }
              }
              consoleMessages.push({ type: msg.type(), text: msg.text(), args });
            });
            page.on('pageerror', (error) => pageErrors.push(error.stack || error.message || String(error)));
            await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'networkidle0', timeout: 30000 });
            await new Promise((resolve) => setTimeout(resolve, 5000));

            const promiseStatus = async (name) => page.evaluate(async (promiseName) => {
              const promise = window[promiseName];
              if (!promise || typeof promise.then !== 'function') return 'missing';
              return Promise.race([
                promise.then(() => 'resolved', (error) => `rejected: ${error?.message || error}`),
                new Promise((resolve) => setTimeout(() => resolve('pending'), 50))
              ]);
            }, name);

            const snapshot = async () => page.evaluate(() => ({
              build: window.ServoForgeBootstrapBuild || null,
              normalizeAssemblyType: typeof window.normalizeAssembly,
              assemblyAdapter: Boolean(window.LabelerAssemblyDriverAdapter),
              assemblyModelDriver: Boolean(window.LabelerAssemblyModelDriver),
              assemblyGeometryDriver: Boolean(window.LabelerAssemblyGeometryDriver),
              animationRuntime: Boolean(window.LabelerAnimationRuntime),
              mapAnimationRenderer: Boolean(window.LabelerMapAnimationRenderer),
              workspaceStatusRenderer: Boolean(window.LabelerWorkspaceStatusRenderer),
              globalFrameIsMapCoordinator: window.renderAnimationFrame === window.LabelerMapAnimationRenderer?.renderAnimationFrame,
              globalFrameIsWorkspaceStatus: window.renderAnimationFrame === window.LabelerWorkspaceStatusRenderer?.renderAnimationFrame,
              playing: typeof state !== 'undefined' ? state.isPlaying : null,
              activeTab: typeof state !== 'undefined' ? state.activeTab : null,
              stateAngle: typeof state !== 'undefined' ? state.previewAngle : null,
              centerAngle: document.querySelector('[data-animation-center]')?.textContent || null,
              jumpAngle: document.querySelector('#tableAngleJump')?.value || null,
              sliderAngle: document.querySelector('#previewAngle')?.value || null,
              playLabel: document.querySelector('#playPause')?.textContent || null,
              startupError: document.querySelector('.startup-error')?.textContent || null,
              validationText: document.querySelector('#validationList')?.textContent?.trim() || null
            }));

            console.log('FEATURE STATUS', await promiseStatus('ServoForgeFeatureIntegrationsReady'));
            console.log('MAP BUILDER STATUS', await promiseStatus('ServoForgeMapBuilderReady'));
            console.log('BOOTSTRAP STATUS', await promiseStatus('ServoForgeBootstrapReady'));
            const before = await snapshot();
            await new Promise((resolve) => setTimeout(resolve, 1200));
            const after = await snapshot();
            console.log('BROWSER BEFORE', JSON.stringify(before));
            console.log('BROWSER AFTER ', JSON.stringify(after));
            console.log('ANGLE DELTA BEFORE MANUAL START', Number(after.stateAngle) - Number(before.stateAngle));

            await page.evaluate(() => window.LabelerAnimationRuntime?.start?.());
            const manualBefore = await snapshot();
            await new Promise((resolve) => setTimeout(resolve, 1200));
            const manualAfter = await snapshot();
            console.log('MANUAL BEFORE', JSON.stringify(manualBefore));
            console.log('MANUAL AFTER ', JSON.stringify(manualAfter));
            console.log('ANGLE DELTA AFTER MANUAL START', Number(manualAfter.stateAngle) - Number(manualBefore.stateAngle));
            console.log('PAGE ERRORS', JSON.stringify(pageErrors));
            console.log('CONSOLE ERRORS', JSON.stringify(consoleMessages.filter((entry) => entry.type === 'error')));
            await browser.close();
          })().catch((error) => {
            console.error(error.stack || error);
            process.exitCode = 1;
          });
          NODE
          node /tmp/servoforge-browser-test.cjs
