name: Diagnose Brand selection v94

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-brand-selection-v94.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory Brand state writers and DOM listeners
        shell: bash
        run: |
          echo '=== selectedBrand references ==='
          grep -RIn --exclude-dir=.git --exclude='*.map' 'selectedBrand' app app.js index.html drivers tests | head -n 500 || true
          echo '=== brandSelect references ==='
          grep -RIn --exclude-dir=.git --exclude='*.map' 'brandSelect' app app.js index.html drivers tests | head -n 500 || true
          echo '=== selectBrand references ==='
          grep -RIn --exclude-dir=.git --exclude='*.map' 'selectBrand' app app.js index.html drivers tests | head -n 500 || true
          echo '=== capture change listeners ==='
          grep -RIn --exclude-dir=.git --exclude='*.map' -E 'addEventListener\(["'"']change["'"']' app app.js drivers | head -n 500 || true
      - name: Inventory render wrappers and feature loaders
        shell: bash
        run: |
          echo '=== renderBuildInputs references ==='
          grep -RIn --exclude-dir=.git 'renderBuildInputs' app app.js drivers | head -n 500 || true
          echo '=== ensureSelectedBrandForApplication references ==='
          grep -RIn --exclude-dir=.git 'ensureSelectedBrandForApplication' app app.js drivers | head -n 500 || true
          echo '=== FeatureIntegrationsReady definition ==='
          grep -RIn --exclude-dir=.git 'ServoForgeFeatureIntegrationsReady' . | head -n 100 || true
