name: Validate Mic Family three-label rest sequence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-mic-three-label-rest-sequence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run handoff unit regression
        run: node tests/apl-section-handoff-continuity.test.js
      - name: Install browser harness
        run: npm install --no-save puppeteer-core@24.16.0
      - name: Serve staging
        run: python3 -m http.server 8000 >/tmp/servoforge-http.log 2>&1 &
      - name: Verify Mic Family APL 6-Aggregate program
        shell: bash
        run: |
          cat > /tmp/mic-three-label.cjs <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('fs');
          const puppeteer = require(process.cwd() + '/node_modules/puppeteer-core');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          (async () => {
            const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find((p) => fs.existsSync(p));
            assert.ok(executablePath, 'Chrome/Chromium unavailable');
            const browser = await puppeteer.launch({ executablePath, headless: true, args: ['--no-sandbox','--disable-dev-shm-usage'] });
            try {
              const page = await browser.newPage();
              await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await sleep(6500);
              const result = await page.evaluate(async () => {
                const [labelSpecs, bottleSpecs, machineMap] = await Promise.all([
                  fetch('./config/default-programs/label-specs.json').then((r) => r.json()),
                  fetch('./config/default-programs/bottle-specs.json').then((r) => r.json()),
                  fetch('./config/default-programs/map-apl-6-aggregate.json').then((r) => r.json())
                ]);
                window.ensurePersistentApplicationMaps = () => state.mapLibrary;
                state.labelSpecs = labelSpecs;
                state.bottleSpecs = bottleSpecs;
                state.mapLibrary = [machineMap];
                state.applicationMode = 'apl';
                state.activeMapId = machineMap.id;
                state.selectedBrand = '12oz Mic Family (T6,41,FO,79,BT,87)';
                state.selectedBottle = 'SSNR - 12 Oz';
                applyGeneratedServoProfile();
                const rows = state.program.map((row) => ({
                  hmi: row.hmi, cmd: Number(row.cmd), tableAngle: Number(row.tableAngle), plateAngle: Number(row.plateAngle),
                  action: row.action, logicalReferenceEvents: row.logicalReferenceEvents || []
                }));
                return {
                  rows,
                  collapsed: state.motionPlan?.aplSectionHandoffContinuity?.collapsedPassiveRests || []
                };
              });

              const redundant = result.rows.filter((row, index, rows) => {
                const next = rows[index + 1];
                return next && row.cmd === 3 && next.cmd === 3 && Math.abs(row.plateAngle - next.plateAngle) <= 0.001;
              });
              assert.equal(redundant.length, 0, `Redundant 3 -> 3 rows remain: ${JSON.stringify(redundant)}`);
              assert.ok(result.collapsed.length >= 3, `Expected at least three passive reference rows collapsed; got ${result.collapsed.length}`);

              const agg1Hold = result.rows.find((row) => row.action === 'Wipe Hold Neck - Agg 1');
              const agg2Wipe = result.rows.find((row) => row.action === 'Wipe Turn 1 Neck - Agg 2');
              const agg2Hold = result.rows.find((row) => row.action === 'Wipe Hold Neck - Agg 2');
              const agg3Wipe = result.rows.find((row) => row.action === 'Wipe Turn 1 Body - Agg 3');
              assert.equal(agg1Hold?.tableAngle, 105);
              assert.equal(agg2Wipe?.tableAngle, 112);
              assert.equal(agg2Hold?.tableAngle, 147.5);
              assert.equal(agg3Wipe?.tableAngle, 149);
              assert.ok(agg1Hold.logicalReferenceEvents.some((event) => event.tableAngle === 110.5 && event.wipeResetReference));
              assert.ok(agg2Hold.logicalReferenceEvents.some((event) => event.tableAngle === 148.5 && event.applicationReference));

              console.log(JSON.stringify({
                rowCount: result.rows.length,
                commands: result.rows.slice(0, 12).map((row) => row.cmd),
                collapsed: result.collapsed,
                earlyRows: result.rows.slice(0, 12)
              }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch((error) => { console.error(error.stack || error); process.exitCode = 1; });
          NODE
          node /tmp/mic-three-label.cjs
