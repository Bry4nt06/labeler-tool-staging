name: Export staging runtime for production promotion

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging
        uses: actions/checkout@v4

      - name: Package staging repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/servoforge-export
          git archive --format=tar HEAD | tar -xf - -C /tmp/servoforge-export
          printf '%s\n' "${GITHUB_SHA}" > /tmp/servoforge-export/source-staging-commit.txt

      - name: Upload production promotion snapshot
        uses: actions/upload-artifact@v4
        with:
          name: servoforge-staging-production-snapshot
          path: /tmp/servoforge-export
          if-no-files-found: error
          retention-days: 1
