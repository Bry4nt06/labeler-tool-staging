name: Export Troubleshooting v374 and PLC Analyzer v14

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-troubleshooting-plc-v374-v14.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated staging source
        uses: actions/checkout@v4
        with:
          ref: 1ffdbb780f958dc79514f2ef1858faacfed01a54
      - name: Build migration bundle
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/servoforge-troubleshooting-plc
          rm -rf "$out"
          mkdir -p "$out/app" "$out/tests" "$out/docs/troubleshooting"
          cp -a app/troubleshooting "$out/app/"
          cp -a app/plc-analyzer "$out/app/"
          find tests -maxdepth 1 -type f \( -name 'troubleshooting*.test.js' -o -name 'plc*.test.js' \) -print0 | while IFS= read -r -d '' file; do cp "$file" "$out/tests/"; done
          if [[ -f docs/PLC_L5K_ANALYZER_PHASE13_RESET_RECOVERY.md ]]; then cp docs/PLC_L5K_ANALYZER_PHASE13_RESET_RECOVERY.md "$out/docs/"; fi
          if [[ -d docs/troubleshooting ]]; then cp -a docs/troubleshooting/. "$out/docs/troubleshooting/"; fi
          cp index.html "$out/STAGING_ROOT_INDEX.html"
          cp app.js "$out/STAGING_ROOT_APP.js"
          cp app/bootstrap.js "$out/STAGING_BOOTSTRAP.js"
          cp styles.css "$out/STAGING_ROOT_STYLES.css"
          printf '%s\n' '1ffdbb780f958dc79514f2ef1858faacfed01a54' > "$out/STAGING_SOURCE_SHA"
          printf '%s\n' 'troubleshooting-v374-plc-analyzer-v14' > "$out/STAGING_FEATURE_SET"
          {
            echo '=== troubleshooting HTML refs ==='
            grep -RhoE '(src|href)="[^"]+"' app/troubleshooting --include='*.html' | sort -u || true
            echo '=== plc-analyzer HTML refs ==='
            grep -RhoE '(src|href)="[^"]+"' app/plc-analyzer --include='*.html' | sort -u || true
            echo '=== root references to feature pages ==='
            grep -nEi 'troubleshoot|plc.analy|plc-analy' index.html app.js app/bootstrap.js styles.css || true
          } > "$out/REFERENCE_AUDIT.txt"
          find "$out/app/troubleshooting" "$out/app/plc-analyzer" -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          test -s "$out/app/troubleshooting/index.html"
          test -s "$out/app/plc-analyzer/index.html"
      - name: Upload exact migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: troubleshooting-v374-plc-analyzer-v14
          path: /tmp/servoforge-troubleshooting-plc
          retention-days: 1
          if-no-files-found: error
