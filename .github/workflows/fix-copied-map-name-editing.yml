name: Fix copied map name editing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-copied-map-name-editing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate locked-builder disabled-state restoration
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/simulation-collapsible-integration.js")
          text = path.read_text(encoding="utf-8")

          old = '''    drawer.querySelectorAll("input,select,textarea,button").forEach((control) => {
              if (control.id === "closeApplicationSetup") {
                if (control.disabled) control.disabled = false;
                return;
              }
              if (locked) {
                if (!control.hasAttribute("data-locked-builder-was-disabled")) {
                  control.dataset.lockedBuilderWasDisabled = String(control.disabled);
                }
                if (!control.disabled) control.disabled = true;
              } else if (control.hasAttribute("data-locked-builder-was-disabled")) {
                const previous = control.dataset.lockedBuilderWasDisabled === "true";
                if (control.disabled !== previous) control.disabled = previous;
                delete control.dataset.lockedBuilderWasDisabled;
              }
            });'''

          new = '''    const closeButton = drawer.querySelector("#closeApplicationSetup");
            if (closeButton?.disabled) closeButton.disabled = false;

            // The primary workspace read-only layer owns disabled-state tracking.
            // Remove markers left by the older duplicate layer so copied or newly
            // unlocked maps immediately regain editable fields, including Map name.
            if (!locked) {
              drawer.querySelectorAll("[data-locked-builder-was-disabled]").forEach((control) => {
                delete control.dataset.lockedBuilderWasDisabled;
                if (!control.hasAttribute("data-developer-was-disabled")) control.disabled = false;
              });
              const mapName = drawer.querySelector("#mapName");
              if (mapName && !mapName.hasAttribute("data-developer-was-disabled")) mapName.disabled = false;
            }'''

          if old not in text:
              raise SystemExit("Expected duplicate disabled-state block was not found")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-copied-map-name-editing.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/simulation-collapsible-integration.js .github/workflows/fix-copied-map-name-editing.yml
          git commit -m "Restore copied map name editing"
          git push
