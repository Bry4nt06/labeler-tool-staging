name: Fix neck-body coder final aggregate

on:
  push:
    paths:
      - ".github/workflows/fix-neck-body-coder-window.yml"
      - "scripts/fix-neck-body-coder.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply repair
        run: |
          python3 scripts/fix-neck-body-coder.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/apl-coder-neck-body-final-aggregate.test.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
            '  Promise,\n  state:',
            '  Promise: { resolve() { return { catch() { return this; }, finally(callback) { callback(); return this; } }; } },\n  state:',
            1
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate repair
        run: |
          node --check app/apl-coder-codebox-orientation-integration.js
          node --check app/apl-final-aggregate-terminal-integration.js
          node --check app/profile-generation.js
          node --check app/bootstrap.js
          node tests/apl-coder-neck-body-final-aggregate.test.js
          node tests/apl-final-aggregate-terminal.test.js
          git diff --check
      - name: Commit runtime repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/apl-coder-codebox-orientation-integration.js app/apl-final-aggregate-terminal-integration.js app/profile-generation.js app/bootstrap.js tests/apl-coder-neck-body-final-aggregate.test.js
          git commit -m "Fix neck-body coder final aggregate boundary"
          git push origin HEAD:main
