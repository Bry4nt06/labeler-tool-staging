name: Fix panel controls and Map Builder visibility

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-panel-controls-map-builder.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compact panel controls and locked Map Builder state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          path = Path('app/workspace-developer-integration.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              '.workspace-panel-toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:9px}\n'
              '       .workspace-panel-toggle{display:flex!important;grid-template-columns:none!important;align-items:center;gap:8px;min-width:0;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--input);font-size:10px;line-height:1.25}\n'
              '       .workspace-panel-toggle input{flex:0 0 auto}',
              '.workspace-panel-toggles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:9px}\n'
              '       .workspace-panel-toggle{display:grid!important;grid-template-columns:16px minmax(0,1fr)!important;align-items:center;justify-content:start;gap:7px;min-width:0;min-height:34px;margin:0!important;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--input);font-size:9px;line-height:1.2;overflow:hidden}\n'
              '       .workspace-panel-toggle input{width:16px!important;height:16px!important;min-width:16px!important;max-width:16px!important;margin:0!important;padding:0!important;flex:0 0 16px!important}\n'
              '       .workspace-panel-toggle span{display:block;min-width:0;overflow-wrap:anywhere}\n'
              '       .map-builder-tab[disabled]{opacity:.7;cursor:not-allowed;border-color:#d79a3c;color:#ffc56b;background:color-mix(in srgb,var(--panel) 82%,#d79a3c 18%)}'
            ),
            (
              '        .workspace-panel-toggles{grid-template-columns:1fr}',
              '        .workspace-panel-toggles{grid-template-columns:repeat(2,minmax(0,1fr))}'
            ),
            (
              '        .locked-map-viewer{grid-template-columns:1fr;align-items:stretch}',
              '        .workspace-panel-toggles{grid-template-columns:1fr}\n'
              '        .locked-map-viewer{grid-template-columns:1fr;align-items:stretch}'
            ),
            (
              '      <small class="workspace-controls-note">Locked maps load in read-only mode. Map Builder is hidden and map, specification, Build Input, and Servo Program editing are disabled.</small>`;',
              '      <small class="workspace-controls-note">Locked maps load in read-only mode. Map Builder stays visible but is disabled, and map, specification, Build Input, and Servo Program editing are disabled.</small>`;'
            ),
            (
              '      return `<label class="workspace-panel-toggle"><input type="checkbox" data-developer-panel="${id}"${checked}> Hide ${label}</label>`;',
              '      return `<label class="workspace-panel-toggle"><input type="checkbox" data-developer-panel="${id}"${checked}><span>Hide ${label}</span></label>`;'
            ),
            (
              '      const shouldHide = hidden.has(id) || (id === "mapBuilder" && mapIsLocked());\n'
              '      panelTargets(id).forEach((target) => { target.dataset.developerHidden = String(shouldHide); });\n'
              '      if (id === "mapBuilder" && shouldHide) closeBuilder();',
              '      const shouldHide = hidden.has(id);\n'
              '      panelTargets(id).forEach((target) => { target.dataset.developerHidden = String(shouldHide); });\n'
              '      if (id === "mapBuilder" && shouldHide) closeBuilder();'
            ),
            (
              '    const mapLock = document.querySelector("#mapLockToggle");',
              '    const builderTab = document.querySelector("#wipeDownBuilderButton");\n'
              '    if (builderTab) {\n'
              '      builderTab.disabled = locked;\n'
              '      builderTab.setAttribute("aria-disabled", String(locked));\n'
              '      builderTab.textContent = locked ? "Map Builder 🔒" : "Map Builder";\n'
              '      builderTab.title = locked ? "Unlock the selected map to use Map Builder." : "Open Map Builder";\n'
              '    }\n\n'
              '    const mapLock = document.querySelector("#mapLockToggle");'
            )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected integration block was not found: {old[:90]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          version = '0.9.3'
          for filename in ['index.html', 'app/update-manager.js', 'service-worker.js']:
              file_path = Path(filename)
              source = file_path.read_text(encoding='utf-8')
              if '0.9.2' not in source:
                  raise SystemExit(f'Expected 0.9.2 version marker missing in {filename}')
              file_path.write_text(source.replace('0.9.2', version), encoding='utf-8')

          manifest_path = Path('update-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = version
          manifest['notes'] = 'STAGING 0.9.3 compacts panel-visibility controls, restores the Map Builder tab for locked maps, and keeps locked-map editing read only.'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          notes_path = Path('release-notes.json')
          notes = json.loads(notes_path.read_text(encoding='utf-8'))
          notes['currentVersion'] = version
          notes['generatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          release = {
              'version': version,
              'milestone': 12,
              'title': 'Compact Workspace Controls',
              'summary': 'Improves the Settings panel layout and keeps Map Builder visible when a locked map is selected.',
              'changes': [
                  'Reduce panel-visibility controls to compact checkbox cards with contained labels.',
                  'Keep Map Builder in the main tab row for locked maps and mark it as disabled with a lock indicator.',
                  'Preserve read-only protection until the selected map is unlocked.'
              ]
          }
          notes['releases'] = [entry for entry in notes.get('releases', []) if entry.get('version') != version]
          notes['releases'].insert(0, release)
          notes_path.write_text(json.dumps(notes, indent=2) + '\n', encoding='utf-8')

          Path('.github/workflows/fix-panel-controls-map-builder.yml').unlink(missing_ok=True)
          PY

      - name: Validate update
        shell: bash
        run: |
          node --check app/workspace-developer-integration.js
          node --check app/update-manager.js
          node --check service-worker.js
          python -m json.tool update-manifest.json >/dev/null
          python -m json.tool release-notes.json >/dev/null
          grep -q 'Map Builder 🔒' app/workspace-developer-integration.js
          grep -q 'grid-template-columns:16px minmax(0,1fr)' app/workspace-developer-integration.js
          grep -q 'application-version" content="0.9.3' index.html
          git diff --check

      - name: Commit update
        shell: bash
        run: |
          git config user.name "ServoForge Staging Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Compact panel controls and restore Map Builder tab"
          git push origin HEAD:main