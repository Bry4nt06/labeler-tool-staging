name: Apply sensor aim safeguards

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-sensor-aim-observer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prevent aim indicator observer loops
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/sensor-station-label-inheritance-integration.js')
          text = path.read_text(encoding='utf-8')
          old = '''    observer = new MutationObserver((mutations) => {
      if (mutations.some((mutation) => mutation.type === "childList" && mutation.addedNodes.length)) enforceSoon();
    });'''
          new = '''    observer = new MutationObserver((mutations) => {
      const meaningfulAddition = mutations.some((mutation) => {
        if (mutation.type !== "childList" || !mutation.addedNodes.length) return false;
        return [...mutation.addedNodes].some((node) => !(
          node instanceof Element
          && node.matches?.("[data-sensor-aim-indicator]")
        ));
      });
      if (meaningfulAddition) enforceSoon();
    });'''
          if old not in text:
              raise SystemExit('Expected sensor observer block was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          worker_path = Path('service-worker.js')
          worker = worker_path.read_text(encoding='utf-8')
          worker = worker.replace(
              'servoforge-labeler-staging-v0.9.10-default-sensor-targets-v1',
              'servoforge-labeler-staging-v0.9.10-sensor-aim-v11',
              1
          )
          worker_path.write_text(worker, encoding='utf-8')

          Path('.github/workflows/fix-sensor-aim-observer.yml').unlink()
          PY

      - name: Validate sensor aiming
        shell: bash
        run: |
          node --check app.js
          node --check app/orientation-constraint-target-service.js
          node --check app/sensor-station-label-inheritance-integration.js
          node --check drivers/profile/sensor-station-label-driver.js
          node --check service-worker.js
          node tests/sensor-station-label-driver.test.js
          node tests/sensor-aim-geometry.test.js
          git diff --check

      - name: Commit safeguards
        shell: bash
        run: |
          git config user.name "ServoForge Staging Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Prevent sensor aim render loops and refresh cache"
          git push origin HEAD:main
