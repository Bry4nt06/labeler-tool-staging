name: Fix Station 1 bottle orientation v72 workflow once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-station1-bottle-orientation-v72-workflow-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct regression assertion and remove this repair workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/add-station1-bottle-orientation-v72-once.yml')
          text = path.read_text()
          old = 'assert.match(source, /LabelerWipeTelemetryService\\?\\.contactedLabelCoverage/);'
          new = 'assert.match(source, /service\\.contactedLabelCoverage/);'
          if old not in text:
              raise SystemExit('Expected v72 regression assertion was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-station1-bottle-orientation-v72-workflow-once.yml
          git config user.name "Bry4nt06"
          git config user.email "139938543+Bry4nt06@users.noreply.github.com"
          git add -A
          git commit -m "Fix v72 bottle orientation regression check"
          git push origin main
