name: Publish Bottle Orientation physical wipe v127

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-bottle-orientation-wipe-v127.yml"

permissions:
  contents: write

concurrency:
  group: "publish-bottle-orientation-wipe-v127"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out staging main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply Bottle Orientation physical wipe v127
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re

          root = pathlib.Path('.')
          VERSION = '0.9.10'
          BUILD = 'bottle-orientation-wipe-direction-v127-20260816-0935'
          UPDATED = 'Aug 16, 2026 9:35 AM ET'

          def read(path): return (root/path).read_text(encoding='utf-8')
          def write(path, text): (root/path).write_text(text, encoding='utf-8')

          panel = read('app/bottle-orientation-panel-integration.js')
          panel = panel.replace('  const VERSION = 10;', '  const VERSION = 11;', 1)

          old_machine = '''  function machineVisualAngle(angleDeg) {
            const angle = finite(angleDeg, 0);
            return String(runtimeState()?.direction || "cw").toLowerCase() === "cw" ? -angle : angle;
          }

          function tableFrameVisualAngle(tableAngle) {'''
          new_machine = '''  function machineVisualAngle(angleDeg) {
            const angle = finite(angleDeg, 0);
            return String(runtimeState()?.direction || "cw").toLowerCase() === "cw" ? -angle : angle;
          }

          function physicalMachineDirection() {
            try {
              const v125 = global.ServoForgePhysicalWipeDirectionV125;
              if (typeof v125?.physicalMachineDirection === "function") {
                const resolved = String(v125.physicalMachineDirection() || "").toLowerCase();
                if (resolved === "cw" || resolved === "ccw") return resolved;
              }
            } catch {
              // Resolve from the shared telemetry/driver fallbacks below.
            }
            try {
              const service = global.LabelerWipeTelemetryService;
              if (typeof service?.liveWipeMachineDirection === "function") {
                const resolved = String(service.liveWipeMachineDirection() || "").toLowerCase();
                if (resolved === "cw" || resolved === "ccw") return resolved;
              }
            } catch {
              // Resolve from the legacy stored direction below.
            }
            let stored = "";
            try { stored = String(global.document?.getElementById?.("mapDirection")?.value || "").toLowerCase(); } catch { }
            if (stored !== "cw" && stored !== "ccw") stored = String(runtimeState()?.direction || "ccw").toLowerCase();
            if (stored !== "cw" && stored !== "ccw") stored = "ccw";
            try {
              const driver = global.LabelerCoderOrientationDriver;
              if (typeof driver?.physicalDirection === "function") {
                const resolved = String(driver.physicalDirection(stored) || "").toLowerCase();
                if (resolved === "cw" || resolved === "ccw") return resolved;
              }
            } catch {
              // Mirror the legacy-token conversion used by the shared driver.
            }
            return stored === "cw" ? "ccw" : "cw";
          }

          function topViewWipeDirection() {
            // The shared wipe panel linearizes physical CW as left-to-right and
            // physical CCW as right-to-left. Bottle Orientation is different:
            // increasing SVG angle travels clockwise around the bottle-local arc,
            // while a fixed wipe contact sweeps across the label opposite bottle
            // rotation. Convert the physical direction into that angular frame.
            return physicalMachineDirection() === "cw" ? "rtl" : "ltr";
          }

          function tableFrameVisualAngle(tableAngle) {'''
          if old_machine not in panel:
              raise SystemExit('Unable to locate Bottle Orientation machineVisualAngle block.')
          panel = panel.replace(old_machine, new_machine, 1)

          old_coverage = '    if (!coverage.direction) coverage.direction = runtimeState()?.direction === "cw" ? "ltr" : "rtl";'
          if old_coverage not in panel:
              raise SystemExit('Unable to locate Bottle Orientation direction fallback.')
          panel = panel.replace(old_coverage, '    coverage.direction = topViewWipeDirection();', 1)

          old_arc = '    const direction = String(coverage?.direction || (runtimeState()?.direction === "cw" ? "ltr" : "rtl")).toLowerCase() === "rtl"'
          if old_arc not in panel:
              raise SystemExit('Unable to locate Bottle Orientation labelArcModel direction.')
          panel = panel.replace(old_arc, '    const direction = String(coverage?.direction || topViewWipeDirection()).toLowerCase() === "rtl"', 1)

          old_export = '''    contextFor,
            machineVisualAngle,'''
          new_export = '''    contextFor,
            physicalMachineDirection,
            topViewWipeDirection,
            machineVisualAngle,'''
          if old_export not in panel:
              raise SystemExit('Unable to locate Bottle Orientation API export block.')
          panel = panel.replace(old_export, new_export, 1)

          old_marker = '    staleSideViewExportRemovedV86: true,\n'
          new_marker = old_marker + '    physicalMachineDirectionWipeV127: true,\n    topViewAngularWipeParityV127: true,\n'
          if old_marker not in panel:
              raise SystemExit('Unable to locate Bottle Orientation capability marker block.')
          panel = panel.replace(old_marker, new_marker, 1)
          write('app/bottle-orientation-panel-integration.js', panel)

          index = read('index.html')
          index = re.sub(r'build=[^"&]+', f'build={BUILD}', index)
          write('index.html', index)

          app = read('app.js')
          app = re.sub(r'const build = "[^"]+";', f'const build = "{BUILD}";', app, count=1)
          write('app.js', app)

          bootstrap = read('app/bootstrap.js')
          bootstrap = re.sub(r'const build = "[^"]+";', f'const build = "{BUILD}";', bootstrap, count=1)
          bootstrap = re.sub(r'const buildUpdatedAt = "[^"]+";', f'const buildUpdatedAt = "{UPDATED}";', bootstrap, count=1)
          write('app/bootstrap.js', bootstrap)

          updater = read('app/update-manager.js')
          updater = re.sub(r'const BUILD_ID = "[^"]+";', f'const BUILD_ID = "{BUILD}";', updater)
          write('app/update-manager.js', updater)

          profile = read('app/profile-generation.js')
          profile = re.sub(r'const moduleBuild = "[^"]+";', f'const moduleBuild = "{BUILD}";', profile, count=1)
          write('app/profile-generation.js', profile)

          worker = read('service-worker.js')
          worker = re.sub(r'const CACHE_NAME = "[^"]+";', f'const CACHE_NAME = "servoforge-labeler-staging-v{VERSION}-{BUILD}";', worker, count=1)
          write('service-worker.js', worker)

          manifest = {
            'schemaVersion': 1,
            'version': VERSION,
            'buildId': BUILD,
            'releaseUrl': 'https://bry4nt06.github.io/labeler-tool-staging/',
            'downloadUrl': 'https://bry4nt06.github.io/labeler-tool-staging/',
            'notes': 'v127 corrects Bottle Orientation label wipe-down direction after the physical machine-direction changes. The top-view label arc now resolves live physical CW/CCW on every render and converts the shared linear wipe convention into the bottle-local angular frame: physical CW wipes high-angle to low-angle and physical CCW mirrors it. Bottle/table transforms, Servo Program commands, coder geometry, v125 physical wipe telemetry, and v126 Community Admin delete are retained.'
          }
          write('update-manifest.json', json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Validate Bottle Orientation physical wipe v127
        shell: bash
        run: |
          set -euo pipefail
          node --check app/bottle-orientation-panel-integration.js
          node --check app.js
          node --check app/bootstrap.js
          node --check app/update-manager.js
          node --check app/profile-generation.js
          node --check service-worker.js
          node tests/bottle-orientation-physical-wipe-v127.test.js
          node tests/bottle-orientation-panel.test.js
          node tests/top-view-bottle-renderer.test.js
          node tests/physical-wipe-direction-v125.test.js
          node tests/wipe-direction-machine-parity-v87.test.js
          node tests/community-admin-delete-v126.test.js
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('.')
          build = 'bottle-orientation-wipe-direction-v127-20260816-0935'
          panel = (root/'app/bottle-orientation-panel-integration.js').read_text(encoding='utf-8')
          app = (root/'app.js').read_text(encoding='utf-8')
          index = (root/'index.html').read_text(encoding='utf-8')
          manifest = json.loads((root/'update-manifest.json').read_text(encoding='utf-8'))
          assert 'const VERSION = 11;' in panel
          assert 'coverage.direction = topViewWipeDirection();' in panel
          assert 'physicalMachineDirectionWipeV127: true' in panel
          assert 'topViewAngularWipeParityV127: true' in panel
          assert manifest['buildId'] == build
          assert 'v126 Community Admin delete' in manifest['notes']
          ids = re.findall(r'build=([^"&]+)', index)
          assert ids and set(ids) == {build}, set(ids)
          assert build in app
          assert build in (root/'app/bootstrap.js').read_text(encoding='utf-8')
          assert build in (root/'app/profile-generation.js').read_text(encoding='utf-8')
          assert build in (root/'service-worker.js').read_text(encoding='utf-8')
          assert (root/'app/update-manager.js').read_text(encoding='utf-8').count(f'const BUILD_ID = "{build}";') >= 2
          PY
          git diff --check

      - name: Commit staging v127
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Bry4nt06"
          git config user.email "139938543+Bry4nt06@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Fix Bottle Orientation wipe direction v127"
            git push origin main
          fi
