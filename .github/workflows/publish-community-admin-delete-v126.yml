# v126 regression rerun after cross-realm assertion fix
name: Publish Community Admin delete v126

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-community-admin-delete-v126.yml"

permissions:
  contents: write

concurrency:
  group: "publish-community-admin-delete-v126"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out staging main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply v126 delivery identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('.')
          VERSION = '0.9.10'
          BUILD = 'community-admin-delete-v126-20260816-0920'
          UPDATED = 'Aug 16, 2026 9:20 AM ET'

          def read(path): return (root/path).read_text(encoding='utf-8')
          def write(path, text): (root/path).write_text(text, encoding='utf-8')

          index = read('index.html')
          index = re.sub(r'build=[^"&]+', f'build={BUILD}', index)
          write('index.html', index)

          app = read('app.js')
          app = re.sub(r'const build = "[^"]+";', f'const build = "{BUILD}";', app, count=1)
          needle = '    await loadScript("app/physical-wipe-direction-v125.js", version);\n'
          addition = needle + '\n    progress?.set(74.7, "Enabling Community Admin delete…");\n    await loadScript("app/community-admin-delete-v126.js", version);\n'
          if 'app/community-admin-delete-v126.js' not in app:
              if needle not in app: raise SystemExit('Unable to locate v125 load point.')
              app = app.replace(needle, addition, 1)
          write('app.js', app)

          bootstrap = read('app/bootstrap.js')
          bootstrap = re.sub(r'const build = "[^"]+";', f'const build = "{BUILD}";', bootstrap, count=1)
          bootstrap = re.sub(r'const buildUpdatedAt = "[^"]+";', f'const buildUpdatedAt = "{UPDATED}";', bootstrap, count=1)
          write('app/bootstrap.js', bootstrap)

          updater = read('app/update-manager.js')
          updater = re.sub(r'const BUILD_ID = "[^"]+";', f'const BUILD_ID = "{BUILD}";', updater)
          write('app/update-manager.js', updater)

          profile = read('app/profile-generation.js')
          profile = re.sub(r'const moduleBuild = "[^"]+";', f'const moduleBuild = "{BUILD}";', profile, count=1)
          write('app/profile-generation.js', profile)

          worker = read('service-worker.js')
          worker = re.sub(r'const CACHE_NAME = "[^"]+";', f'const CACHE_NAME = "servoforge-labeler-staging-v{VERSION}-{BUILD}";', worker, count=1)
          write('service-worker.js', worker)

          manifest = {
            'schemaVersion': 1,
            'version': VERSION,
            'buildId': BUILD,
            'releaseUrl': 'https://bry4nt06.github.io/labeler-tool-staging/',
            'downloadUrl': 'https://bry4nt06.github.io/labeler-tool-staging/',
            'notes': 'v126 adds a permanent Delete action to Community Admin. Delete requires the active Community Admin key, calls the existing server-authorized adminDelete action, confirms before removal, deletes dependent ratings through the database cascade, and refreshes the active admin queue. Physical wipe direction v125, update delivery v124, Map Builder v123, Autocol coder v122, and printed-codebox v121 behavior are retained.'
          }
          write('update-manifest.json', json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Validate Community Admin delete v126
        shell: bash
        run: |
          set -euo pipefail
          node --check app/community-admin-delete-v126.js
          node --check app/community-library-integration.js
          node --check app.js
          node --check app/bootstrap.js
          node --check app/update-manager.js
          node --check app/profile-generation.js
          node --check service-worker.js
          node tests/community-admin-delete-v126.test.js
          node tests/community-library-current.test.js
          node tests/community-library-v103.test.js
          node tests/community-library-v104.test.js
          node tests/community-library-v97.test.js
          node tests/physical-wipe-direction-v125.test.js
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('.')
          build = 'community-admin-delete-v126-20260816-0920'
          app = (root/'app.js').read_text(encoding='utf-8')
          index = (root/'index.html').read_text(encoding='utf-8')
          manifest = json.loads((root/'update-manifest.json').read_text(encoding='utf-8'))
          assert manifest['buildId'] == build
          assert 'app/community-admin-delete-v126.js' in app
          assert app.index('app/physical-wipe-direction-v125.js') < app.index('app/community-admin-delete-v126.js')
          ids = re.findall(r'build=([^"&]+)', index)
          assert ids and set(ids) == {build}, set(ids)
          assert build in (root/'app/bootstrap.js').read_text(encoding='utf-8')
          assert build in (root/'app/profile-generation.js').read_text(encoding='utf-8')
          assert build in (root/'service-worker.js').read_text(encoding='utf-8')
          assert (root/'app/update-manager.js').read_text(encoding='utf-8').count(f'const BUILD_ID = "{build}";') >= 2
          assert 'Community Admin' in manifest['notes'] and 'v125' in manifest['notes']
          PY
          git diff --check

      - name: Commit staging v126
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Bry4nt06"
          git config user.email "139938543+Bry4nt06@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add Community Admin delete v126"
            git push origin main
          fi
