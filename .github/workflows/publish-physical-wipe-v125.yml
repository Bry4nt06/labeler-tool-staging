name: Publish physical wipe direction v125

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-physical-wipe-v125.yml"

permissions:
  contents: write

concurrency:
  group: "publish-physical-wipe-v125"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out staging main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply physical wipe direction v125
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('.')
          VERSION = '0.9.10'
          BUILD = 'physical-wipe-direction-v125-20260816-0905'
          UPDATED = 'Aug 16, 2026 9:05 AM ET'

          def read(path): return (root/path).read_text(encoding='utf-8')
          def write(path, text): (root/path).write_text(text, encoding='utf-8')

          index = read('index.html')
          index = re.sub(r'build=[^"&]+', f'build={BUILD}', index)
          write('index.html', index)

          app = read('app.js')
          app = re.sub(r'const build = "[^"]+";', f'const build = "{BUILD}";', app, count=1)
          needle = '    await loadScript("app/wipe-side-servo-parity-v119.js", version);\n'
          addition = needle + '\n    progress?.set(74.5, "Following physical machine wipe direction…");\n    await loadScript("app/physical-wipe-direction-v125.js", version);\n'
          if 'app/physical-wipe-direction-v125.js' not in app:
              if needle not in app: raise SystemExit('Unable to locate v119 startup load.')
              app = app.replace(needle, addition, 1)
          write('app.js', app)

          bootstrap = read('app/bootstrap.js')
          bootstrap = re.sub(r'const build = "[^"]+";', f'const build = "{BUILD}";', bootstrap, count=1)
          bootstrap = re.sub(r'const buildUpdatedAt = "[^"]+";', f'const buildUpdatedAt = "{UPDATED}";', bootstrap, count=1)
          write('app/bootstrap.js', bootstrap)

          updater = read('app/update-manager.js')
          updater = re.sub(r'const BUILD_ID = "[^"]+";', f'const BUILD_ID = "{BUILD}";', updater)
          write('app/update-manager.js', updater)

          profile = read('app/profile-generation.js')
          profile = re.sub(r'const moduleBuild = "[^"]+";', f'const moduleBuild = "{BUILD}";', profile, count=1)
          write('app/profile-generation.js', profile)

          worker = read('service-worker.js')
          worker = re.sub(r'const CACHE_NAME = "[^"]+";', f'const CACHE_NAME = "servoforge-labeler-staging-v{VERSION}-{BUILD}";', worker, count=1)
          write('service-worker.js', worker)

          manifest = {
              'schemaVersion': 1,
              'version': VERSION,
              'buildId': BUILD,
              'releaseUrl': 'https://bry4nt06.github.io/labeler-tool-staging/',
              'downloadUrl': 'https://bry4nt06.github.io/labeler-tool-staging/',
              'notes': 'v125 restores label wipe progression to physical machine-direction authority. Center-tack coverage no longer receives the legacy v119 servo-coordinate side swap. CW and CCW machines now mirror the label wipe visual correctly while bottle orientation transforms remain unchanged. v124 update delivery, v123 Map Builder, v122 Autocol coder, and v121 printed-codebox behavior are retained.'
          }
          write('update-manifest.json', json.dumps(manifest, indent=2) + '\n')

          legacy = root/'tests/wipe-side-servo-parity-v119.test.js'
          if legacy.exists(): legacy.unlink()
          PY

      - name: Validate v125
        shell: bash
        run: |
          set -euo pipefail
          node --check app/physical-wipe-direction-v125.js
          node --check app/wipe-side-servo-parity-v119.js
          node --check app/update-manager.js
          node --check app/bootstrap.js
          node --check app/profile-generation.js
          node --check app.js
          node --check service-worker.js
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('.')
          build = 'physical-wipe-direction-v125-20260816-0905'
          app = (root/'app.js').read_text(encoding='utf-8')
          index = (root/'index.html').read_text(encoding='utf-8')
          manifest = json.loads((root/'update-manifest.json').read_text(encoding='utf-8'))
          assert manifest['buildId'] == build
          assert app.index('app/wipe-side-servo-parity-v119.js') < app.index('app/physical-wipe-direction-v125.js')
          ids = re.findall(r'build=([^"&]+)', index)
          assert ids and set(ids) == {build}, set(ids)
          assert build in (root/'app/bootstrap.js').read_text(encoding='utf-8')
          assert build in (root/'app/profile-generation.js').read_text(encoding='utf-8')
          assert build in (root/'service-worker.js').read_text(encoding='utf-8')
          assert (root/'app/update-manager.js').read_text(encoding='utf-8').count(f'const BUILD_ID = "{build}";') >= 2
          assert not (root/'tests/wipe-side-servo-parity-v119.test.js').exists()
          PY
          node tests/physical-wipe-direction-v125.test.js
          node tests/map-builder-object-add-v123.test.js
          node tests/autocol-coder-codebox-v122.test.js
          node tests/printed-codebox-left-edge-v121.test.js
          git diff --check

      - name: Commit staging v125
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Bry4nt06"
          git config user.email "139938543+Bry4nt06@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore physical label wipe direction v125"
            git push origin main
          fi
