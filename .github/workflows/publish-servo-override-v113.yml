name: Publish Servo Program Scroll-Stable Override v115

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-servo-override-v113.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Align v115 runtime and cache identities
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          build = "servo-override-scroll-stable-v115-20260814-1755"
          previous_build = "servo-override-live-row-v114-20260814-1741"
          updated_at = "Aug 14, 2026 5:55 PM ET"

          bootstrap = Path("app/bootstrap.js")
          text = bootstrap.read_text(encoding="utf-8")
          text = text.replace(f'const build = "{previous_build}";', f'const build = "{build}";')
          text = text.replace('const buildUpdatedAt = "Aug 14, 2026 5:41 PM ET";', f'const buildUpdatedAt = "{updated_at}";')
          if f'const build = "{build}";' not in text:
              raise SystemExit("bootstrap build identity was not updated")
          bootstrap.write_text(text, encoding="utf-8")

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          text = text.replace(
              f'app/bootstrap.js?v=0.9.10&build={previous_build}',
              f'app/bootstrap.js?v=0.9.10&build={build}'
          )
          if f'app/bootstrap.js?v=0.9.10&build={build}' not in text:
              raise SystemExit("index bootstrap cache identity was not updated")
          index.write_text(text, encoding="utf-8")

          sw = Path("service-worker.js")
          text = sw.read_text(encoding="utf-8")
          text = text.replace(
              f'const CACHE_NAME = "servoforge-labeler-staging-v0.9.10-{previous_build}";',
              f'const CACHE_NAME = "servoforge-labeler-staging-v0.9.10-{build}";'
          )
          if f'servoforge-labeler-staging-v0.9.10-{build}' not in text:
              raise SystemExit("service-worker cache identity was not updated")
          sw.write_text(text, encoding="utf-8")

          manifest_path = Path("update-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["buildId"] = build
          manifest["notes"] = (
              "Servo Program scroll-stable override v115 keeps the existing program table DOM in place "
              "when Table or Bottle overrides are committed, recalculates travel/status/speed metrics "
              "in place, preserves the actual document and nested scroll containers, and prevents the "
              "workspace from jumping to the top after an override edit."
          )
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Validate v115 publication
        run: |
          node --check app/servo-overrides.js
          node --check app/controllers/servo-program-controller.js
          node --check app/controllers/servo-program-event-controller.js
          node --check app/bootstrap.js
          node --check service-worker.js
          node tests/servo-program-override-editing.test.js
          grep -F "servo-override-scroll-stable-v115-20260814-1755" app/bootstrap.js
          grep -F "servo-override-scroll-stable-v115-20260814-1755" index.html
          grep -F "servo-override-scroll-stable-v115-20260814-1755" service-worker.js
          grep -F "servo-override-scroll-stable-v115-20260814-1755" update-manifest.json
          git diff --check
      - name: Commit v115 publication
        run: |
          git config user.name "Bry4nt06"
          git config user.email "139938543+Bry4nt06@users.noreply.github.com"
          git add app/bootstrap.js index.html service-worker.js update-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Servo Program scroll-stable override v115"
            git push origin main
          fi
