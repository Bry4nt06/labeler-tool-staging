name: Publish v102 delivery once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v102-delivery-once.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize v102 delivery identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          build = "coder-radial-codebox-alignment-v102-20260813-1613"
          old = [
              "coder-left-edge-parity-v98-20260813-1402",
              "coder-servo-direction-transform-v99-20260813-1436",
              "coder-measured-input-transform-v100-20260813-1546",
              "top-action-icon-cluster-v101-20260813-1603",
          ]
          for name in ["index.html", "app.js", "app/bootstrap.js", "app/update-manager.js", "service-worker.js"]:
              path = Path(name)
              text = path.read_text()
              for value in old:
                  text = text.replace(value, build)
              if name == "app/bootstrap.js":
                  text = re.sub(r'const buildUpdatedAt = "[^"]+";', 'const buildUpdatedAt = "Aug 13, 2026 4:34 PM ET";', text)
                  text = re.sub(r'  // v102 UI-only release\.[^\n]*', '  // v102 aligns the finished-label code-box point to the physical coder radial centerline; v101 top action icons and prior protected behavior are retained.', text)
              path.write_text(text)
          PY
      - name: Verify v102 identity and critical behavior
        run: |
          grep -q 'coder-radial-codebox-alignment-v102-20260813-1613' app/bootstrap.js
          grep -q 'coder-radial-codebox-alignment-v102-20260813-1613' app.js
          grep -q 'coder-radial-codebox-alignment-v102-20260813-1613' app/update-manager.js
          grep -q 'coder-radial-codebox-alignment-v102-20260813-1613' service-worker.js
          grep -q 'coder-radial-codebox-alignment-v102-20260813-1613' index.html
          node --check app/bootstrap.js
          node --check app.js
          node --check app/update-manager.js
          node --check service-worker.js
          node tests/coder-left-edge-direction-parity-v98.test.js
          node tests/apl-coder-neck-body-final-aggregate.test.js
          node tests/landshark-common-generator-runtime.test.js
          node tests/bottle-orientation-panel.test.js
          node tests/top-view-bottle-renderer.test.js
          node tests/apl-section-handoff-continuity.test.js
          node tests/apl-roller-coverage-default.test.js
          node tests/wipe-direction-machine-parity-v87.test.js
          node tests/wipe-panel-runtime-direction-v88.test.js
          node tests/wipe-panel-semantic-direction-v89.test.js
          node tests/brand-selection-event-authority-v94.test.js
          node tests/community-library-current.test.js
      - name: Commit normalized v102 delivery
        run: |
          git config user.name "Bry4nt06"
          git config user.email "139938543+Bry4nt06@users.noreply.github.com"
          git add index.html app.js app/bootstrap.js app/update-manager.js service-worker.js
          git commit -m "Normalize staging delivery identity for v102"
          git push origin main
