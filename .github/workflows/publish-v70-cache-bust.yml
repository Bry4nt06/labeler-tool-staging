name: Publish V70 cache bust

on:
  push:
    paths:
      - ".github/workflows/publish-v70-cache-bust.yml"

permissions:
  contents: write

jobs:
  update-cache-references:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update staging cache references
        shell: python
        run: |
          from pathlib import Path

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          old = "app/bootstrap.js?v=0.9.10-bootstrap-independent-navigation-v69-20260811-1305"
          new = "app/bootstrap.js?v=0.9.10-compact-build-parameters-v70-20260811-1350"
          if old not in text and new not in text:
              raise SystemExit("Expected bootstrap reference was not found in index.html")
          text = text.replace(old, new)
          index.write_text(text, encoding="utf-8")

          sw = Path("service-worker.js")
          text = sw.read_text(encoding="utf-8")
          old_cache = 'const CACHE_NAME = "servoforge-labeler-staging-v0.9.10-bootstrap-independent-navigation-v69";'
          new_cache = 'const CACHE_NAME = "servoforge-labeler-staging-v0.9.10-compact-build-parameters-v70";'
          if old_cache not in text and new_cache not in text:
              raise SystemExit("Expected V69 cache name was not found in service-worker.js")
          text = text.replace(old_cache, new_cache)

          compact_asset = '  "./app/compact-build-parameters-integration.js",\n'
          if compact_asset not in text:
              anchor = '  "./app/bootstrap.js",\n'
              if anchor not in text:
                  raise SystemExit("Bootstrap core-asset anchor not found in service-worker.js")
              text = text.replace(anchor, anchor + compact_asset, 1)
          sw.write_text(text, encoding="utf-8")

      - name: Commit V70 cache references
        run: |
          if git diff --quiet -- index.html service-worker.js; then
            echo "Cache references already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Cache bust staging build v70"
          git push origin HEAD:main
