name: Remove coding servo runtime once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-coding-runtime-once.yml"
      - "tools/remove_coding_runtime.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: servoforge-remove-coding-runtime
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch final coder exports and apply sweep
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/remove_coding_runtime.py')
          text = path.read_text(encoding='utf-8')
          row_anchor = 'row_builder = row_builder.replace("    coderHandoffPlan,\\n", "")'
          row_fixed = 'row_builder = row_builder.replace("    coderHandoffPlan,\\n", "").replace("    coderHandoffPlan\\n", "")'
          if row_anchor in text:
              text = text.replace(row_anchor, row_fixed, 1)
          issue_anchor = 'if re.search(r"coder|coding", issue_factory, re.I):'
          issue_fixed = 'issue_factory = issue_factory.replace("    coderHandoffStatus\\n", "")\n' + issue_anchor
          if issue_anchor not in text:
              raise SystemExit('issue-factory cleanup patch anchor missing')
          text = text.replace(issue_anchor, issue_fixed, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/remove_coding_runtime.py
      - name: Validate transformed staging runtime
        run: |
          node --check app.js
          node --check app/bootstrap.js
          node --check app/apl-map-profile-generation.js
          node --check app/apl-seed-profile.js
          node --check app/apl-final-aggregate-terminal-integration.js
          node --check app/orientation-constraint-target-service.js
          node --check app/orientation-constraint-program-planner.js
          node --check app/orientation-constraint-planner-integration.js
          node --check app/machine-terminal-policy-integration.js
          node --check app/sensor-orientation-default-map-fix-integration.js
          node --check drivers/profile/map-object-orientation-driver.js
          node --check drivers/profile/orientation-constraint-planner-driver.js
          node --check drivers/profile/map-object-row-builder-driver.js
          node --check drivers/profile/orientation-issue-factory-driver.js
          node tests/apl-final-aggregate-terminal.test.js
          ! grep -E 'coder-orientation-driver|coder-handoff-driver|map-object-coder-after-wipe|coder-window-reference-handoff|coding-cycle-normalization|topmodul-coder-prehold|clockwise-code-box-orientation|coder-rest-grammar-repair' app.js app/bootstrap.js app/simulation-collapsible-integration.js
          ! grep -E 'Direct Turn for Coding|Hold for Coding|Turn for Coding|codingWindow|codingObject' app/apl-map-profile-generation.js app/apl-seed-profile.js
          git diff --check
      - name: Commit staging coding removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Disable coding servo path and stop after final aggregate"
          git push origin HEAD:main
