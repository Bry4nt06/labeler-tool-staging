name: Remove Legacy Zone and Site Metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-zone-site-legacy.yml

permissions:
  contents: write

concurrency:
  group: remove-servoforge-zone-site-legacy
  cancel-in-progress: false

jobs:
  remove-zone-site-legacy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove legacy metadata
        run: python3 scripts/remove_zone_site_legacy.py

      - name: Validate cleanup
        shell: bash
        run: |
          set -euo pipefail
          ! test -e app/zone-site-configuration.js
          ! grep -R -n -E '\b(NAZ|FCL|SAS|UKI|WMB|CVL|COB|JAX|BVL|HOB|STL)\b' \
            app drivers config index.html styles.css service-worker.js || exit 1
          ! grep -R -n -E 'defaultZoneSiteConfiguration|normalizeZoneSiteConfiguration|ensureSelectedZoneAndSite|mapLocationFor|mapLocationLabel|mapLibraryLocation|mapsForMapLibraryLocation|mapZone|mapSite|bindZoneSiteDeveloperMenu|developerZoneSiteEditor|exportZoneSiteConfig|importZoneSiteConfig|zone-site-configuration|zone-site-editor|zone-site-selection' \
            app drivers index.html styles.css service-worker.js || exit 1
          grep -q 'Delete map "${map.name}"? This cannot be undone.' app/wipe-down-builder.js
          grep -q 'Save map "${proposedName}"?' app/wipe-down-builder.js
          find app drivers -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check app.js
          node --check service-worker.js
          python3 -m json.tool config/company-default-settings.json >/dev/null

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Zone/Site legacy code is already removed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove Zone and Site from maps and settings'
          git push origin HEAD:main
