name: Repair bootstrap-independent workspace navigation v69

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-bootstrap-independent-navigation-v69.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply v69 navigation repair
        run: python3 scripts/publish-bootstrap-independent-navigation-v69.py
      - name: Validate v69 navigation repair
        run: |
          node --check app/controllers/tabs-controller.js
          node --check app/bootstrap.js
          node --check service-worker.js
          node --check tests/top-navigation-recovery.test.js
          node tests/top-navigation-recovery.test.js
      - name: Commit v69 navigation repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app/bootstrap.js service-worker.js update-manifest.json tests/top-navigation-recovery.test.js
          git commit -m "Publish bootstrap-independent workspace navigation v69"
          git push origin HEAD:main
