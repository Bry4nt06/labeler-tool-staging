name: Reapply Specs and Sensor Guidance 0.9.11

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rerun-spec-sensor-0.9.11.yml

permissions:
  contents: write

jobs:
  update:
    if: contains(github.event.head_commit.message, '[rerun-spec-sensor-0.9.11]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reapply the prepared update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('.github/workflows/apply-spec-sensor-guidance-0.9.11.yml')
          source = source_path.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          block = source[start:end]
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines())
          exec(compile(code, str(source_path), 'exec'), {})

          test_path = Path('tests/specification-required-fields.test.js')
          test_source = test_path.read_text(encoding='utf-8')
          old = 'assert.deepStrictEqual(requirements.validateState(valid), []);'
          new = 'assert.strictEqual(requirements.validateState(valid).length, 0);'
          if old not in test_source:
              raise RuntimeError('Missing cross-realm assertion anchor.')
          test_path.write_text(test_source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run focused regression checks
        shell: bash
        run: |
          node --check app/controllers/specification-required-fields-controller.js
          node --check app/apl-label-sensor-reference-integration.js
          node --check drivers/profile/orientation-issue-factory-driver.js
          node tests/specification-required-fields.test.js
          node tests/sensor-guidance-visibility.test.js
          node tests/map-double-click-coder-segment-grammar.test.js
          node tests/validation-diagnostics-summary-fit.test.js

      - name: Commit staging release
        shell: bash
        run: |
          rm -f .github/workflows/apply-spec-sensor-guidance-0.9.11.yml
          rm -f .github/workflows/rerun-spec-sensor-0.9.11.yml
          git config user.name "ServoForge Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Release ServoForge staging 0.9.11"
          git push origin HEAD:main
