name: Retry TopModul DTS3 RPC Angle v328

on:
  push:
    branches:
      - feature/topmodul-dts3-rpc-angle-v328
    paths:
      - .github/workflows/retry-topmodul-dts3-rpc-angle-v328.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/topmodul-dts3-rpc-angle-v328
          fetch-depth: 0

      - name: Reapply DTS3 feature steps
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-topmodul-dts3-rpc-angle-v328.yml').read_text(encoding='utf-8')
          names = [
              'Add TopModul DTS variant and RPC angle driver',
              'Wire DTS variants into map builder and RPC program presentation',
              'Load DTS runtime and bump staging build',
              'Add DTS3 regression coverage',
          ]
          for name in names:
              marker = f'      - name: {name}\n'
              start = workflow.index(marker)
              run_marker = '        run: |\n'
              run_start = workflow.index(run_marker, start) + len(run_marker)
              next_step = workflow.find('\n      - name:', run_start)
              if next_step < 0:
                  next_step = len(workflow)
              block = workflow[run_start:next_step]
              lines = block.splitlines()
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
              print(f'Running feature step: {name}')
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
          PY

      - name: Validate DTS3 feature scope
        shell: bash
        run: |
          set -euo pipefail
          node --check drivers/translation/topmodul-rpc-angle-driver.js
          node --check app/topmodul-dts-machine-variant-integration.js
          node --check app/map-builder-controls.js
          node --check app/servo-program-table-renderer.js
          node --check app/controllers/servo-program-controller.js
          node --check app/controllers/servo-program-event-controller.js
          node --check app/controllers/transfer-controller.js
          node --check app/servo-program-print-integration.js
          node tests/topmodul-dts3-rpc-angle-v328.test.js
          grep -q 'TopModul (DTS3)' app/defaults.js
          grep -q 'TopModul (DTS4)' app/defaults.js
          grep -q 'topmodul-rpc-angle-driver.js' app/bootstrap.js
          grep -q 'topmodul-rpc-angle-driver.js' service-worker.js
          grep -q 'topmodul-dts3-rpc-angle-v328-20260910-1832' update-manifest.json

      - name: Commit DTS3 feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ServoForge Staging Builder"
          git config user.email "actions@users.noreply.github.com"
          git add drivers/translation/topmodul-rpc-angle-driver.js app/topmodul-dts-machine-variant-integration.js app/defaults.js app/map-builder-controls.js app/servo-program-table-renderer.js app/controllers/servo-program-controller.js app/controllers/servo-program-event-controller.js app/controllers/transfer-controller.js app/servo-program-print-integration.js app/bootstrap.js app.js app/profile-generation.js app/update-manager.js index.html service-worker.js update-manifest.json tests/topmodul-dts3-rpc-angle-v328.test.js
          git commit -m "Add TopModul DTS3 RPC 45-degree table-angle support [skip ci]"
          git push origin HEAD:feature/topmodul-dts3-rpc-angle-v328
