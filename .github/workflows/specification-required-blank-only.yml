name: Specification Required Blank Only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/specification-required-blank-only.yml

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[spec-required-blank-only]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Make required-specification validation blank-only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          controller_path = Path('app/controllers/specification-sensor-guidance-controller.js')
          source = controller_path.read_text(encoding='utf-8')

          replacement = r'''  function validateBottle(spec, index, issues) {
    const rowName = String(spec?.bottleType || `Bottle row ${index + 1}`);
    if (!String(spec?.bottleType || "").trim()) {
      addIssue(issues, "bottle", index, "bottleType", rowName, "Bottle Type is required.");
    }
    ["diameterTargetMm", "radiusReductionMm"].forEach((field) => {
      if (!Number.isFinite(finite(spec?.[field]))) {
        addIssue(issues, "bottle", index, field, rowName, `${FIELD_NAMES[field]} is required.`);
      }
    });
  }

  function validateLabel(spec, index, issues) {
    const rowName = String(spec?.brand || `Label row ${index + 1}`);
    if (!String(spec?.brand || "").trim()) addIssue(issues, "label", index, "brand", rowName, "Brand is required.");
    if (!String(spec?.specNumber || "").trim()) addIssue(issues, "label", index, "specNumber", rowName, "Spec # is required.");
    if (!["apl", "cold-glue"].includes(String(spec?.applicationMode || "").toLowerCase())) {
      addIssue(issues, "label", index, "applicationMode", rowName, "Application is required.");
    }

    NUMERIC_LABEL_FIELDS.forEach((field) => {
      if (!Number.isFinite(finite(spec?.[field]))) {
        addIssue(issues, "label", index, field, rowName, `${FIELD_NAMES[field]} is required.`);
      }
    });
  }

'''

          pattern = re.compile(r'  function validateBottle\(spec, index, issues\) \{.*?\n  function validateSpecifications\(', re.S)
          match = pattern.search(source)
          if not match:
              raise SystemExit('Unable to locate specification validation block.')
          source = source[:match.start()] + replacement + '  function validateSpecifications(' + source[match.end():]
          source = source.replace('    minimumLabelMm: MIN_LABEL_MM,\n', '    blankOnly: true,\n')
          controller_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/specification-sensor-guidance.test.js')
          test = test_path.read_text(encoding='utf-8')
          start = test.index('const partialNeck = validState();')
          end = test.index('\n[\n  "plannedLabelVisibilityPercent"', start)
          zero_tests = r'''const allZero = validState();
Object.assign(allZero.bottleSpecs[0], {
  diameterTargetMm: 0,
  radiusReductionMm: 0
});
Object.assign(allZero.labelSpecs[0], {
  bodyLengthMm: 0,
  backLengthMm: 0,
  neckHeightMm: 0,
  neckLengthMm: 0,
  neckBottomCurveMm: 0,
  neckBottomCircumferenceMm: 0,
  codeBoxCenterMm: 0
});
assert.strictEqual(requirements.validateState(allZero).length, 0, "Numeric zero must count as a completed input.");

const blankNumeric = validState();
blankNumeric.labelSpecs[0].neckHeightMm = "";
assert.ok(requirements.validateState(blankNumeric).some((issue) => issue.field === "neckHeightMm"));

const blankBottle = validState();
blankBottle.bottleSpecs[0].diameterTargetMm = "";
assert.ok(requirements.validateState(blankBottle).some((issue) => issue.field === "diameterTargetMm"));
'''
          test = test[:start] + zero_tests + test[end:]
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Run focused regression
        run: node tests/specification-sensor-guidance.test.js

      - name: Commit correction
        shell: bash
        run: |
          rm -f .github/workflows/specification-required-blank-only.yml
          git config user.name "ServoForge Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Treat zero as a completed required specification value"
          git push origin HEAD:main
