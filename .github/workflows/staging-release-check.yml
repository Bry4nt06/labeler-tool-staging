name: Staging Release Check

on:
  push:
    branches:
      - main
      - "milestone/**"
      - "hotfix/**"
  pull_request:

permissions:
  contents: read

jobs:
  static-release-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)

      - name: Validate JSON documents
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done < <(find . -type f -name '*.json' -not -path './node_modules/*' -print0)

      - name: Verify release version alignment
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path('.')
          manifest = json.loads((root / 'update-manifest.json').read_text(encoding='utf-8'))
          notes = json.loads((root / 'release-notes.json').read_text(encoding='utf-8'))
          index = (root / 'index.html').read_text(encoding='utf-8')
          worker = (root / 'service-worker.js').read_text(encoding='utf-8')
          updater = (root / 'app' / 'update-manager.js').read_text(encoding='utf-8')
          expected = str(manifest.get('version', '')).strip()
          errors = []

          if not expected:
              errors.append('update-manifest.json has no version')

          meta = re.search(r'<meta\s+name="application-version"\s+content="([^"]+)"', index)
          if not meta or meta.group(1) != expected:
              errors.append(f'index application version is {meta.group(1) if meta else "missing"}; expected {expected}')

          asset_versions = re.findall(r'(?:src|href)="[^"]+\?v=([^"]+)"', index)
          mismatched = sorted({version for version in asset_versions if version != expected})
          if not asset_versions:
              errors.append('index has no versioned assets')
          if mismatched:
              errors.append(f'index contains mismatched asset versions: {mismatched}')

          if notes.get('currentVersion') != expected:
              errors.append(f'release-notes currentVersion is {notes.get("currentVersion")}; expected {expected}')
          if not any(str(item.get('version')) == expected for item in notes.get('releases', [])):
              errors.append(f'release-notes has no entry for {expected}')

          if f'servoforge-labeler-staging-v{expected}' not in worker:
              errors.append('service-worker cache version is not aligned')
          if f'RELEASE_VERSION = "{expected}"' not in updater:
              errors.append('update-manager release version is not aligned')

          if errors:
              print('\n'.join(f'ERROR: {item}' for item in errors))
              sys.exit(1)
          print(f'Release {expected} is aligned across shell, assets, manifest, notes, worker, and updater.')
          PY
