name: Validate APL neck wipe completion
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check modified domain syntax
        run: |
          node --check app/wipe-analysis-service.js
          node --check app/apl-map-profile-generation.js
          node --check app/apl-finished-centerline-completion-integration.js
          node --check app/apl-roller-section-handoff-integration.js
          node --check drivers/geometry/label-geometry-driver.js
      - name: Neck wipe and machine-isolation regressions
        run: node --test tests/apl-neck-complete-reverse-wipe.test.js tests/apl-center-tack-inside-wipe-completion.test.js tests/dts3-map-program-isolation-v331.test.js
      - name: Existing handoff, update and startup regressions
        run: |
          npm run test:apl-handoff
          npm run test:update
          npm run prestart
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - name: Install browser harness
        run: npm install --no-save puppeteer-core@24.16.0
      - name: Exercise final generated program in Chrome
        run: |
          python3 -m http.server 8000 >/tmp/neck-wipe-http.log 2>&1 &
          node tests/apl-neck-wipe-browser.test.cjs
