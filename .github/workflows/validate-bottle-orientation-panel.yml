name: Validate Bottle Orientation Panel

on:
  push:
    branches: [main]
    paths:
      - "app/bottle-orientation-panel-integration.js"
      - "app/bottle-orientation-panel-recovery-integration.js"
      - "app/animation-runtime.js"
      - "app/bootstrap.js"
      - "service-worker.js"
      - "update-manifest.json"
      - "tests/bottle-orientation-panel.test.js"
      - ".github/workflows/validate-bottle-orientation-panel.yml"
  pull_request:
    paths:
      - "app/bottle-orientation-panel-integration.js"
      - "app/bottle-orientation-panel-recovery-integration.js"
      - "app/animation-runtime.js"
      - "app/bootstrap.js"
      - "service-worker.js"
      - "update-manifest.json"
      - "tests/bottle-orientation-panel.test.js"
      - ".github/workflows/validate-bottle-orientation-panel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: |
          node --check app/bottle-orientation-panel-integration.js
          node --check app/bottle-orientation-panel-recovery-integration.js
          node --check tests/bottle-orientation-panel.test.js
      - name: Run bottle orientation panel regression
        run: node tests/bottle-orientation-panel.test.js
