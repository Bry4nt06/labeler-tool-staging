name: Validate Bottle Type Selection

on:
  push:
    branches: [main]
    paths:
      - "app/controllers/build-inputs-controller.js"
      - "app/label-specification-service.js"
      - "tests/bottle-selection-regeneration.test.js"
      - ".github/workflows/validate-bottle-selection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch committed regression files
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          mkdir -p app/controllers tests
          curl --fail --silent --show-error --location \
            "$base/app/controllers/build-inputs-controller.js" \
            --output app/controllers/build-inputs-controller.js
          curl --fail --silent --show-error --location \
            "$base/app/label-specification-service.js" \
            --output app/label-specification-service.js
          curl --fail --silent --show-error --location \
            "$base/tests/bottle-selection-regeneration.test.js" \
            --output tests/bottle-selection-regeneration.test.js
      - name: Check JavaScript syntax
        run: |
          node --check app/controllers/build-inputs-controller.js
          node --check app/label-specification-service.js
          node --check tests/bottle-selection-regeneration.test.js
      - name: Run Bottle Type selection regression
        run: node tests/bottle-selection-regeneration.test.js
