name: Validate coder radial v102
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-coder-radial-v102.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check drivers/profile/coder-orientation-driver.js
          node --check app/apl-coder-codebox-orientation-integration.js
          node --check app/profile-generation.js
      - name: Coder and Land Shark
        run: |
          node tests/coder-left-edge-direction-parity-v98.test.js
          node tests/apl-coder-neck-body-final-aggregate.test.js
          node tests/landshark-common-generator-runtime.test.js
      - name: Bottle Orientation and APL
        run: |
          node tests/bottle-orientation-panel.test.js
          node tests/top-view-bottle-renderer.test.js
          node tests/apl-section-handoff-continuity.test.js
          node tests/apl-roller-coverage-default.test.js
      - name: Direction parity
        run: |
          node tests/wipe-direction-machine-parity-v87.test.js
          node tests/wipe-panel-runtime-direction-v88.test.js
          node tests/wipe-panel-semantic-direction-v89.test.js
      - name: Brand and Community
        run: |
          node tests/brand-selection-event-authority-v94.test.js
          node tests/community-library-current.test.js
