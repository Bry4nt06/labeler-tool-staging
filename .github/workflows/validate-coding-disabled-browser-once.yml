name: Browser validate coding-disabled staging

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-coding-disabled-browser-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore base APL seed and keep two-label path coder-free
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin backup-before-coding-removal-20260809
          git show origin/backup-before-coding-removal-20260809:app/apl-seed-profile.js > /tmp/apl-seed-before-coding-removal.js
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('/tmp/apl-seed-before-coding-removal.js').read_text(encoding='utf-8')
          marker = '\n\nfunction generatedAplTwoLabelProfile() {'
          if marker not in source:
              raise SystemExit('Unable to locate two-label profile boundary in backup seed file.')
          seed_prefix = source.split(marker, 1)[0].rstrip() + '\n\n'

          two_label = r'''function generatedAplTwoLabelProfile() {
            const seed = generatedAplSeedProfile();
            const scale = (angle) => window.LabelerGeometryDriver?.scaleTableAngle(angle, {
              enabled: state.autoScaleTableMap,
              currentPitchRadiusMm: state.tablePitchRadiusMm,
              referencePitchRadiusMm: state.referencePitchRadiusMm,
              zeroAngle: state.zeroAngle
            }) ?? angle;
            const point = (pattern, fallback) => {
              const value = mapPointAngle(pattern);
              return Number.isFinite(value) ? value : fallback;
            };
            const pad3 = padProfileTableAngles(3);
            const pad4 = padProfileTableAngles(4);

            const referenceTablePath = [
              seed[0]?.tableAngle,
              seed[1]?.tableAngle,
              seed[2]?.tableAngle,
              seed[3]?.tableAngle,
              seed[4]?.tableAngle,
              seed[5]?.tableAngle,
              seed[6]?.tableAngle,
              seed[7]?.tableAngle,
              seed[8]?.tableAngle,
              scale(point(/Agg 3 (?:Spender|Pallet)/i, 148.5) - profileTiming.spenderArriveEarly),
              scale(pad3[0]), scale(pad3[1]), scale(pad3[2]), scale(pad3[3]),
              scale(point(/Agg 4 (?:Spender|Pallet)/i, 188.5) - profileTiming.spenderArriveEarly),
              scale(pad4[0]), scale(pad4[1]), scale(pad4[2]), scale(pad4[3])
            ];

            const plateAngles = [
              seed[0]?.plateAngle,
              seed[1]?.plateAngle,
              seed[2]?.plateAngle,
              seed[3]?.plateAngle,
              seed[4]?.plateAngle,
              seed[5]?.plateAngle,
              seed[6]?.plateAngle,
              seed[7]?.plateAngle,
              seed[8]?.plateAngle,
              seed[11]?.plateAngle,
              seed[12]?.plateAngle,
              seed[13]?.plateAngle,
              seed[14]?.plateAngle,
              seed[15]?.plateAngle,
              seed[16]?.plateAngle,
              seed[17]?.plateAngle,
              seed[18]?.plateAngle,
              seed[19]?.plateAngle
            ];

            const commands = [3, 3, 7, 3, 7, 3, 7, 3, 7, 3, 7, 7, 3, 7, 3, 7, 7, 3];
            const actions = [
              "Zero Line",
              "Hold for Neck Application - Agg 1",
              "Wipe Turn 1 Neck - Agg 1",
              "Wipe Hold Neck - Agg 1",
              "Wipe Turn 2 Neck - Agg 1",
              "Hold for Neck Application - Agg 2",
              "Wipe Turn 1 Neck - Agg 2",
              "Wipe Hold Neck - Agg 2",
              "Wipe Turn 2 Neck - Agg 2",
              "Hold for Body Application - Agg 3",
              "Wipe Turn 1 Body - Agg 3",
              "Wipe Turn 2 Body - Agg 3",
              "Wipe Hold Body - Agg 3",
              "Turn For Body Application - Agg 4",
              "Hold for Body Application - Agg 4",
              "Wipe Turn 1 Body - Agg 4",
              "Wipe Turn 2 Body - Agg 4",
              "Wipe Hold Body - Agg 4"
            ];

            return actions.map((action, index) => ({
              hmi: index + 1,
              plc: index,
              cmd: commands[index],
              tableAngle: finishAngle(referenceTablePath[index]),
              plateAngle: finishAngle(plateAngles[index]),
              action,
              terminalRest: index === actions.length - 1,
              profileSource: "apl-two-label-reference"
            }));
          }

          window.LabelerAplSeedProfileGenerator = Object.freeze({
            generateSeed: generatedAplSeedProfile,
            generateTwoLabel: generatedAplTwoLabelProfile
          });
          '''
          output = seed_prefix + textwrap.dedent(two_label).lstrip()
          Path('app/apl-seed-profile.js').write_text(output, encoding='utf-8')
          PY
          node --check app/apl-seed-profile.js
          ! grep -E 'Turn for Coding|Hold for Coding|codingWindow|codingObject|codingReady|codingTarget' app/apl-seed-profile.js
          node tests/apl-final-aggregate-terminal.test.js
          git diff --check app/apl-seed-profile.js

      - name: Commit seed repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/apl-seed-profile.js; then
            echo "APL seed already repaired."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/apl-seed-profile.js
            git commit -m "Repair coder-free APL seed profile boundary"
            git push origin HEAD:main
          fi

      - name: Install browser harness
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Exercise real ServoForge staging app
        run: |
          python3 -m http.server 8000 >/tmp/servoforge-http.log 2>&1 &
          cat > /tmp/coding-disabled-browser.cjs <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const puppeteer = require(process.cwd() + '/node_modules/puppeteer-core');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser']
              .find((candidate) => fs.existsSync(candidate));
            assert.ok(executablePath, 'Chrome/Chromium executable not found.');
            const browser = await puppeteer.launch({ executablePath, headless: true, args: ['--no-sandbox','--disable-dev-shm-usage'] });
            try {
              const page = await browser.newPage();
              const pageErrors = [];
              const consoleErrors = [];
              page.on('pageerror', (error) => pageErrors.push(error.stack || error.message || String(error)));
              page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });
              await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForFunction(() => typeof state !== 'undefined' && Array.isArray(state.mapLibrary) && state.mapLibrary.length > 0, { timeout: 20000 });
              await sleep(5000);

              const selected = await page.evaluate(() => {
                const select = document.querySelector('#mapLibrarySelect');
                if (!select) throw new Error('Map library selector is unavailable.');
                const option = [...select.options].find((entry) => /APL\s*6-Aggregate/i.test(entry.textContent || ''))
                  || [...select.options].find((entry) => /apl-6-aggregate/i.test(entry.value || ''));
                if (!option) throw new Error(`APL 6-Aggregate option not found. Options: ${[...select.options].map((entry) => entry.textContent).join(' | ')}`);
                select.value = option.value;
                select.dispatchEvent(new Event('change', { bubbles: true }));
                return { value: option.value, text: option.textContent };
              });
              await sleep(2500);

              const result = await page.evaluate(() => {
                if (typeof applyGeneratedServoProfile !== 'function') throw new Error('applyGeneratedServoProfile is unavailable.');
                applyGeneratedServoProfile();
                const rows = Array.isArray(state.program) ? state.program.map((row) => ({ ...row })) : [];
                const final = rows.at(-1) || null;
                const map = typeof activeMachineMap === 'function' ? activeMachineMap() : null;
                return {
                  mapName: map?.name || '',
                  mapId: map?.id || '',
                  rowCount: rows.length,
                  final,
                  codingRows: rows.filter((row) => /coding|coder|code box/i.test(String(row?.action || ''))),
                  build: window.ServoForgeBootstrapBuild || '',
                  startupError: document.querySelector('.startup-error')?.textContent || '',
                  validationText: document.querySelector('#validationList')?.textContent || ''
                };
              });

              console.log('SELECTED MAP', JSON.stringify(selected));
              console.log('PROGRAM RESULT', JSON.stringify(result, null, 2));
              console.log('PAGE ERRORS', JSON.stringify(pageErrors));
              console.log('CONSOLE ERRORS', JSON.stringify(consoleErrors));

              assert.match(result.build, /coding-disabled-aggregate6-terminal-v49-20260809-2103/);
              assert.match(`${result.mapName} ${result.mapId}`, /APL\s*6-Aggregate|apl-6-aggregate/i);
              assert.ok(result.rowCount > 0, 'Generated program is empty.');
              assert.ok(result.final, 'Generated program has no final row.');
              assert.equal(result.final.cmd, 3, 'Final Aggregate 6 row must be CMD 3 Rest/Hold.');
              assert.equal(result.final.aggregateTerminal, true, 'Final row must be marked as the aggregate terminal.');
              assert.equal(result.final.terminalAggregate, 6, 'Six-aggregate map must terminate on Aggregate 6.');
              assert.match(String(result.final.action || ''), /Agg\s*6/i, 'Final action must belong to Aggregate 6.');
              assert.equal(result.codingRows.length, 0, `Coding actions remain: ${result.codingRows.map((row) => row.action).join(', ')}`);
              assert.equal(result.startupError, '', `Startup error: ${result.startupError}`);
              assert.deepEqual(pageErrors, [], `Browser page errors: ${pageErrors.join('\n')}`);
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error.stack || error);
            process.exitCode = 1;
          });
          NODE
          node /tmp/coding-disabled-browser.cjs
