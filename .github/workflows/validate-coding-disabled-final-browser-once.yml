name: Final browser validate coding-disabled staging

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-coding-disabled-final-browser-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static Aggregate terminal regression
        run: |
          node --check app/apl-final-aggregate-terminal-integration.js
          node --check app/apl-seed-profile.js
          node tests/apl-final-aggregate-terminal.test.js
          ! grep -E 'Turn for Coding|Hold for Coding|codingWindow|codingObject|codingReady|codingTarget' app/apl-seed-profile.js app/apl-map-profile-generation.js
      - name: Install browser harness
        run: npm install --no-save puppeteer-core@24.16.0
      - name: Exercise real APL 6-Aggregate generation
        run: |
          python3 -m http.server 8000 >/tmp/servoforge-http.log 2>&1 &
          cat > /tmp/final-aggregate-browser.cjs <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const puppeteer = require(process.cwd() + '/node_modules/puppeteer-core');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser']
              .find((candidate) => fs.existsSync(candidate));
            assert.ok(executablePath, 'Chrome/Chromium executable not found.');
            const browser = await puppeteer.launch({ executablePath, headless: true, args: ['--no-sandbox','--disable-dev-shm-usage'] });
            try {
              const page = await browser.newPage();
              const pageErrors = [];
              page.on('pageerror', (error) => pageErrors.push(error.stack || error.message || String(error)));
              await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForFunction(() => typeof state !== 'undefined' && Array.isArray(state.mapLibrary) && state.mapLibrary.length > 0, { timeout: 20000 });
              await sleep(5000);

              await page.evaluate(() => {
                const select = document.querySelector('#mapLibrarySelect');
                if (!select) throw new Error('Map library selector is unavailable.');
                const option = [...select.options].find((entry) => /APL\s*6-Aggregate/i.test(entry.textContent || ''))
                  || [...select.options].find((entry) => /apl-6-aggregate/i.test(entry.value || ''));
                if (!option) throw new Error('APL 6-Aggregate option was not found.');
                select.value = option.value;
                select.dispatchEvent(new Event('change', { bubbles: true }));
              });
              await sleep(2500);

              const result = await page.evaluate(() => {
                if (typeof applyGeneratedServoProfile !== 'function') throw new Error('applyGeneratedServoProfile is unavailable.');
                applyGeneratedServoProfile();
                const rows = Array.isArray(state.program) ? state.program.map((row) => ({ ...row })) : [];
                const map = typeof activeMachineMap === 'function' ? activeMachineMap() : null;
                return {
                  build: window.ServoForgeBootstrapBuild || '',
                  finalizerInstalled: Boolean(window.LabelerAplFinalAggregateTerminal?.installed),
                  finalizerVersion: window.LabelerAplFinalAggregateTerminal?.version || 0,
                  mapName: map?.name || '',
                  mapId: map?.id || '',
                  rows,
                  final: rows.at(-1) || null,
                  codingRows: rows.filter((row) => /coding|coder|code box/i.test(String(row?.action || '')))
                };
              });

              const unexpectedPageErrors = pageErrors.filter((message) => !/normalizeAssembly is not defined/i.test(message));
              console.log('FINAL RESULT', JSON.stringify({
                build: result.build,
                finalizerInstalled: result.finalizerInstalled,
                finalizerVersion: result.finalizerVersion,
                mapName: result.mapName,
                mapId: result.mapId,
                rowCount: result.rows.length,
                final: result.final,
                codingRows: result.codingRows,
                knownV48StartupErrors: pageErrors.filter((message) => /normalizeAssembly is not defined/i.test(message)).length,
                unexpectedPageErrors
              }, null, 2));

              assert.match(result.build, /coding-disabled-aggregate6-terminal-v49-20260809-2103/);
              assert.equal(result.finalizerInstalled, true, 'Aggregate terminal finalizer did not install.');
              assert.ok(result.finalizerVersion >= 2, `Expected finalizer v2+, got ${result.finalizerVersion}.`);
              assert.match(`${result.mapName} ${result.mapId}`, /APL\s*6-Aggregate|apl-6-aggregate/i);
              assert.ok(result.rows.length > 0, 'Generated program is empty.');
              assert.ok(result.final, 'Generated program has no final row.');
              assert.equal(result.final.cmd, 3, 'Final row must be CMD 3.');
              assert.equal(result.final.aggregateTerminal, true, 'Final row must be the aggregate terminal.');
              assert.equal(result.final.terminalAggregate, 6, 'APL 6-Aggregate must terminate at Aggregate 6.');
              assert.match(String(result.final.action || ''), /Agg\s*6/i, `Final action is not Aggregate 6: ${result.final.action}`);
              assert.equal(result.codingRows.length, 0, `Coding rows remain: ${result.codingRows.map((row) => row.action).join(', ')}`);
              assert.equal(result.rows.some((row, index) => index > result.rows.findIndex((row) => row.aggregateTerminal === true)), false,
                'Rows exist after the aggregate terminal.');
              assert.deepEqual(unexpectedPageErrors, [], `Unexpected browser errors: ${unexpectedPageErrors.join('\n\n')}`);
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error.stack || error);
            process.exitCode = 1;
          });
          NODE
          node /tmp/final-aggregate-browser.cjs
