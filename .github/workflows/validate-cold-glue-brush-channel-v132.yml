name: Validate canonical Cold Glue brush channel

on:
  push:
    branches: [main]
    paths:
      - "drivers/mechanical/cold-glue-motion-driver.js"
      - "drivers/geometry/label-geometry-driver.js"
      - "app/cold-glue-profile-generation.js"
      - "app/cold-glue-gripper-channel-integration.js"
      - "app/cold-glue-gripper-sequence-integration-v2.js"
      - "app/build-inputs-renderer.js"
      - "app/controllers/build-inputs-controller.js"
      - "app/controllers/specs-controller.js"
      - "app/controllers/setup-event-controller-integration.js"
      - "app/label-specification-service.js"
      - "app/persistence.js"
      - "app/program-summary-service.js"
      - "app/validation.js"
      - "app/defaults.js"
      - "app/map-schema-adapter-integration.js"
      - "config/default-programs/*.json"
      - "app/profile-generation.js"
      - "app/simulation-collapsible-integration.js"
      - "app.js"
      - "service-worker.js"
      - "tests/cold-glue-brush-channel-authority-v132.test.js"
      - "tests/cold-glue-equal-channel-hold-v317.test.js"
      - "tests/cold-glue-slot-topology-guard-v315.test.js"
      - "tests/build-input-brand-authority-v317.test.js"
      - "tests/cold-glue-neck-wrap-policy.test.js"
      - "tests/neck-wrap-geometry.test.js"
      - "tests/neck-wrap-build-input-controller.test.js"
      - "tests/neck-wrap-build-input-renderer.test.js"
      - "tests/neck-wrap-ui-and-profile.test.js"
      - "tests/cold-glue-default-brush-depth.test.js"
      - "tests/map-schema-adapter.test.js"
      - "tests/profile-generation-module-boundaries.test.js"
      - "tests/feature-integration-readiness.test.js"
      - ".github/workflows/validate-cold-glue-brush-channel-v132.yml"
  pull_request:
    branches: [main]
    paths:
      - "drivers/mechanical/cold-glue-motion-driver.js"
      - "drivers/geometry/label-geometry-driver.js"
      - "app/cold-glue-profile-generation.js"
      - "app/cold-glue-gripper-channel-integration.js"
      - "app/cold-glue-gripper-sequence-integration-v2.js"
      - "app/build-inputs-renderer.js"
      - "app/controllers/build-inputs-controller.js"
      - "app/controllers/specs-controller.js"
      - "app/controllers/setup-event-controller-integration.js"
      - "app/label-specification-service.js"
      - "app/persistence.js"
      - "app/program-summary-service.js"
      - "app/validation.js"
      - "app/defaults.js"
      - "app/map-schema-adapter-integration.js"
      - "config/default-programs/*.json"
      - "app/profile-generation.js"
      - "app/simulation-collapsible-integration.js"
      - "app.js"
      - "service-worker.js"
      - "tests/cold-glue-brush-channel-authority-v132.test.js"
      - "tests/cold-glue-equal-channel-hold-v317.test.js"
      - "tests/cold-glue-slot-topology-guard-v315.test.js"
      - "tests/build-input-brand-authority-v317.test.js"
      - "tests/cold-glue-neck-wrap-policy.test.js"
      - "tests/neck-wrap-geometry.test.js"
      - "tests/neck-wrap-build-input-controller.test.js"
      - "tests/neck-wrap-build-input-renderer.test.js"
      - "tests/neck-wrap-ui-and-profile.test.js"
      - "tests/cold-glue-default-brush-depth.test.js"
      - "tests/map-schema-adapter.test.js"
      - "tests/profile-generation-module-boundaries.test.js"
      - "tests/feature-integration-readiness.test.js"
      - ".github/workflows/validate-cold-glue-brush-channel-v132.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging change
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check canonical Cold Glue JavaScript syntax
        run: |
          set -euo pipefail
          node --check drivers/mechanical/cold-glue-motion-driver.js
          node --check drivers/geometry/label-geometry-driver.js
          node --check app/cold-glue-profile-generation.js
          node --check app/cold-glue-gripper-channel-integration.js
          node --check app/cold-glue-gripper-sequence-integration-v2.js
          node --check app/build-inputs-renderer.js
          node --check app/controllers/build-inputs-controller.js
          node --check app/controllers/specs-controller.js
          node --check app/controllers/setup-event-controller-integration.js
          node --check app/label-specification-service.js
          node --check app/persistence.js
          node --check app/program-summary-service.js
          node --check app/validation.js
          node --check app/defaults.js
          node --check app/map-schema-adapter-integration.js
          node --check app/profile-generation.js
          node --check app/simulation-collapsible-integration.js
          node --check app.js
          node --check service-worker.js

      - name: Validate brush-channel motion, wipe direction, default depth, and startup integrity
        run: |
          set -euo pipefail
          node tests/cold-glue-brush-channel-authority-v132.test.js
          node tests/cold-glue-equal-channel-hold-v317.test.js
          node tests/cold-glue-slot-topology-guard-v315.test.js
          node tests/build-input-brand-authority-v317.test.js
          node tests/cold-glue-neck-wrap-policy.test.js
          node tests/neck-wrap-geometry.test.js
          node tests/neck-wrap-build-input-controller.test.js
          node tests/neck-wrap-build-input-renderer.test.js
          node tests/neck-wrap-ui-and-profile.test.js
          node tests/cold-glue-default-brush-depth.test.js
          node tests/map-schema-adapter.test.js
          node tests/assembly-drivers.test.js
          node tests/profile-generation-module-boundaries.test.js
          node tests/feature-integration-readiness.test.js
          node tests/physical-wipe-direction-v125.test.js
          git diff --check
