name: Validate Cold Glue brush direction v128

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "app/cold-glue-brush-direction-v128.js"
      - "tests/cold-glue-brush-direction-v128.test.js"
      - ".github/workflows/validate-cold-glue-brush-direction-v128.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check app/cold-glue-brush-direction-v128.js
          node --check tests/cold-glue-brush-direction-v128.test.js
      - name: Run Cold Glue brush direction regression
        run: node tests/cold-glue-brush-direction-v128.test.js
