name: Validate Cold Glue brush runtime v131

on:
  push:
    branches: [main]
    paths:
      - "app/cold-glue-brush-runtime-v131.js"
      - "app/cold-glue-brush-direction-v128.js"
      - "app/cold-glue-neck-left-right-integration.js"
      - "app/cold-glue-gripper-sequence-integration-v2.js"
      - "app/physical-wipe-direction-v125.js"
      - "app.js"
      - "tests/cold-glue-brush-runtime-v131.test.js"
      - "tests/cold-glue-brush-direction-v128.test.js"
      - "tests/physical-wipe-direction-v125.test.js"
      - ".github/workflows/validate-cold-glue-brush-runtime-v131.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Cold Glue runtime syntax
        run: |
          node --check app/cold-glue-brush-runtime-v131.js
          node --check app/cold-glue-brush-direction-v128.js
          node --check app/cold-glue-neck-left-right-integration.js
          node --check app/cold-glue-gripper-sequence-integration-v2.js
          node --check app.js

      - name: Validate final Cold Glue pre-brush runtime
        run: node tests/cold-glue-brush-runtime-v131.test.js

      - name: Validate center-out direction layer
        run: node tests/cold-glue-brush-direction-v128.test.js

      - name: Validate physical machine direction semantics
        run: node tests/physical-wipe-direction-v125.test.js

      - name: Check diff formatting
        run: git diff --check
