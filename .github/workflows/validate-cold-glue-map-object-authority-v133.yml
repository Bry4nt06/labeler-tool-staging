name: Validate Cold Glue map object authority

on:
  pull_request:
    branches: [main]
    paths:
      - "app/cold-glue-map-service.js"
      - "app/map-runtime-service.js"
      - "app/wipe-down-builder.js"
      - "app/map-builder-slot-service.js"
      - "app/cold-glue-slot-topology-guard-v315.js"
      - "app/company-default-map-catalog-integration.js"
      - "app/map-builder-controls.js"
      - "app/bootstrap.js"
      - "app/controllers/map-builder-action-controller.js"
      - "app/controllers/map-builder-event-controller.js"
      - "app/controllers/map-builder-layout-controller.js"
      - "app/map-builder-controller.js"
      - "tests/cold-glue-map-object-authority-v133.test.js"
      - "tests/map-builder-add-object-v134.test.js"
      - "tests/map-builder-machine-slot-v135.test.js"
      - "tests/cold-glue-slot-topology-guard-v315.test.js"
      - "tests/optional-label-sensors-v136.test.js"
      - "tests/map-runtime-service.test.js"
      - ".github/workflows/validate-cold-glue-map-object-authority-v133.yml"
  push:
    branches: [main]
    paths:
      - "app/cold-glue-map-service.js"
      - "app/map-runtime-service.js"
      - "app/wipe-down-builder.js"
      - "app/map-builder-slot-service.js"
      - "app/cold-glue-slot-topology-guard-v315.js"
      - "app/company-default-map-catalog-integration.js"
      - "app/map-builder-controls.js"
      - "app/bootstrap.js"
      - "app/controllers/map-builder-action-controller.js"
      - "app/controllers/map-builder-event-controller.js"
      - "app/controllers/map-builder-layout-controller.js"
      - "app/map-builder-controller.js"
      - "tests/cold-glue-map-object-authority-v133.test.js"
      - "tests/map-builder-add-object-v134.test.js"
      - "tests/map-builder-machine-slot-v135.test.js"
      - "tests/cold-glue-slot-topology-guard-v315.test.js"
      - "tests/optional-label-sensors-v136.test.js"
      - "tests/map-runtime-service.test.js"
      - ".github/workflows/validate-cold-glue-map-object-authority-v133.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check map runtime syntax
        run: |
          set -euo pipefail
          node --check app/cold-glue-map-service.js
          node --check app/map-runtime-service.js
          node --check app/wipe-down-builder.js
          node --check app/map-builder-slot-service.js
          node --check app/cold-glue-slot-topology-guard-v315.js
          node --check app/company-default-map-catalog-integration.js
          node --check app/bootstrap.js
          node --check app/controllers/map-builder-action-controller.js
          node --check app/controllers/map-builder-event-controller.js
          node --check app/controllers/map-builder-layout-controller.js
          node --check app/map-builder-controller.js

      - name: Validate map object and station topology authority
        run: |
          set -euo pipefail
          node tests/cold-glue-map-object-authority-v133.test.js
          node tests/map-object-drag-and-cold-glue-overwipe-v318.test.js
          node tests/map-builder-add-object-v134.test.js
          node tests/map-builder-machine-slot-v135.test.js
          node tests/cold-glue-slot-topology-guard-v315.test.js
          node tests/optional-label-sensors-v136.test.js
          node tests/map-runtime-service.test.js
          node tests/cold-glue-brush-channel-authority-v132.test.js
          node tests/feature-integration-readiness.test.js
          git diff --check
