name: Validate independent Servo Simulation

on:
  pull_request:
    branches: [main]
    paths:
      - app/simulation-engine.js
      - app/simulation-table-renderer.js
      - app/controllers/simulation-controller.js
      - app/controllers/simulation-editor-controller.js
      - app/controllers/tabs-controller.js
      - app/defaults.js
      - app/persistence.js
      - app/startup-runtime.js
      - index.html
      - package.json
      - tests/simulation-independent-workspace.test.js
      - tests/simulation-draft-persistence-and-print.test.js
      - .github/workflows/validate-independent-servo-simulator.yml
  push:
    branches: [main]
    paths:
      - app/simulation-engine.js
      - app/simulation-table-renderer.js
      - app/controllers/simulation-controller.js
      - app/controllers/simulation-editor-controller.js
      - app/controllers/tabs-controller.js
      - app/defaults.js
      - app/persistence.js
      - app/startup-runtime.js
      - index.html
      - package.json
      - tests/simulation-independent-workspace.test.js
      - tests/simulation-draft-persistence-and-print.test.js
      - .github/workflows/validate-independent-servo-simulator.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check changed JavaScript
        run: |
          node --check app/simulation-engine.js
          node --check app/simulation-table-renderer.js
          node --check app/controllers/simulation-controller.js
          node --check app/controllers/simulation-editor-controller.js
          node --check app/controllers/tabs-controller.js
          node --check app/defaults.js
          node --check app/persistence.js
          node --check app/startup-runtime.js
          node --check tests/simulation-independent-workspace.test.js
      - name: Run simulation regressions
        run: npm run test:simulation
      - name: Run adjacent navigation and map reset regressions
        run: node --test tests/top-navigation-recovery.test.js tests/map-aggregate-custom-simulation-reset.test.js
      - name: Run update lifecycle regression
        run: npm run test:update
      - name: Run startup smoke checks
        run: npm run prestart
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
