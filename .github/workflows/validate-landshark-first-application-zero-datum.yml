name: Validate Landshark first application zero datum

on:
  push:
    branches: [main]
    paths:
      - app.js
      - app/first-application-zero-datum-integration.js
      - app/orientation-constraint-target-service.js
      - app/orientation-constraint-planner-integration.js
      - tests/landshark-first-application-zero-datum.test.js
      - tests/sensor-aim-geometry.test.js
      - tests/sensor-live-visibility-alignment.test.js
      - .github/workflows/validate-landshark-first-application-zero-datum.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check app/first-application-zero-datum-integration.js
          node --check app/orientation-constraint-target-service.js
          node --check app/orientation-constraint-planner-integration.js
          node --check tests/landshark-first-application-zero-datum.test.js
          node --check tests/sensor-aim-geometry.test.js
          node --check tests/sensor-live-visibility-alignment.test.js
      - name: Run Landshark zero-datum and sensor-direction regressions
        run: |
          node tests/landshark-first-application-zero-datum.test.js
          node tests/sensor-aim-geometry.test.js
          node tests/sensor-live-visibility-alignment.test.js
