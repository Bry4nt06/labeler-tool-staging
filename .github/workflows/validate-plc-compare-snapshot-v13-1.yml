name: Validate PLC Compare snapshot v13.1

on:
  pull_request:
    paths:
      - "app/plc-analyzer/l5k-analyzer-compare-snapshot-v13-1.js"
      - "app/plc-analyzer/l5k-analyzer-compare-worker.js"
      - "app/plc-analyzer/plc-analyzer-compare-v5-2.js"
      - "app/plc-analyzer/compare.html"
      - "tests/plc-l5k-analyzer-compare-snapshot-v13-1.test.js"
      - ".github/workflows/validate-plc-compare-snapshot-v13-1.yml"
  push:
    branches:
      - main
    paths:
      - "app/plc-analyzer/l5k-analyzer-compare-snapshot-v13-1.js"
      - "app/plc-analyzer/l5k-analyzer-compare-worker.js"
      - "app/plc-analyzer/plc-analyzer-compare-v5-2.js"
      - "app/plc-analyzer/compare.html"
      - "tests/plc-l5k-analyzer-compare-snapshot-v13-1.test.js"
      - ".github/workflows/validate-plc-compare-snapshot-v13-1.yml"

permissions:
  contents: read

jobs:
  validate-snapshot-v13-1:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out change
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check snapshot compare syntax
        run: |
          set -euo pipefail
          node --check app/plc-analyzer/l5k-analyzer-compare-snapshot-v13-1.js
          node --check app/plc-analyzer/l5k-analyzer-compare-worker.js
          node --check app/plc-analyzer/plc-analyzer-compare-v5-2.js
      - name: Run snapshot compare regressions
        run: node --test tests/plc-l5k-analyzer-compare-snapshot-v13-1.test.js
      - name: Check patch whitespace
        run: |
          set -euo pipefail
          if [[ -n "${{ github.base_ref }}" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^...HEAD
          fi
