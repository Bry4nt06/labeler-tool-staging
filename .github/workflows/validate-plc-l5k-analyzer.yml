name: Validate PLC L5K analyzer

on:
  pull_request:
    paths:
      - "app.js"
      - "app/plc-analyzer/**"
      - "app/troubleshooting/troubleshooting-bootstrap.js"
      - "docs/PLC_L5K_ANALYZER_BUILD.md"
      - "docs/PLC_L5K_ANALYZER_PHASE5_DEPENDENCIES.md"
      - "docs/PLC_L5K_ANALYZER_PHASE6_CALLGRAPH_REVIEW.md"
      - "docs/PLC_L5K_ANALYZER_PHASE7_TASK_SCHEDULING.md"
      - "docs/PLC_L5K_ANALYZER_COMPARE_V7_1_TASK_SCHEDULING.md"
      - "docs/PLC_L5K_ANALYZER_PHASE8_COMMUNICATION_TOPOLOGY.md"
      - "docs/PLC_L5K_ANALYZER_COMPARE_V8_1_COMMUNICATION.md"
      - "docs/PLC_L5K_ANALYZER_PHASE9_MSG_TOPOLOGY.md"
      - "docs/PLC_L5K_ANALYZER_COMPARE_V9_1_MSG.md"
      - "docs/PLC_L5K_ANALYZER_PHASE10_INTRA_PROJECT_CONSISTENCY.md"
      - "docs/PLC_L5K_ANALYZER_COMPARE_V10_1_CONSISTENCY.md"
      - "docs/PLC_L5K_ANALYZER_PHASE11_SEQUENCE_TOPOLOGY.md"
      - "tests/plc-l5k-analyzer*.test.js"
      - ".github/workflows/validate-plc-l5k-analyzer.yml"
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "app/plc-analyzer/**"
      - "app/troubleshooting/troubleshooting-bootstrap.js"
      - "docs/PLC_L5K_ANALYZER_BUILD.md"
      - "docs/PLC_L5K_ANALYZER_PHASE5_DEPENDENCIES.md"
      - "docs/PLC_L5K_ANALYZER_PHASE6_CALLGRAPH_REVIEW.md"
      - "docs/PLC_L5K_ANALYZER_PHASE7_TASK_SCHEDULING.md"
      - "docs/PLC_L5K_ANALYZER_COMPARE_V7_1_TASK_SCHEDULING.md"
      - "docs/PLC_L5K_ANALYZER_PHASE8_COMMUNICATION_TOPOLOGY.md"
      - "docs/PLC_L5K_ANALYZER_COMPARE_V8_1_COMMUNICATION.md"
      - "docs/PLC_L5K_ANALYZER_PHASE9_MSG_TOPOLOGY.md"
      - "docs/PLC_L5K_ANALYZER_COMPARE_V9_1_MSG.md"
      - "docs/PLC_L5K_ANALYZER_PHASE10_INTRA_PROJECT_CONSISTENCY.md"
      - "docs/PLC_L5K_ANALYZER_COMPARE_V10_1_CONSISTENCY.md"
      - "docs/PLC_L5K_ANALYZER_PHASE11_SEQUENCE_TOPOLOGY.md"
      - "tests/plc-l5k-analyzer*.test.js"
      - ".github/workflows/validate-plc-l5k-analyzer.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out change
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check analyzer syntax
        run: |
          set -euo pipefail
          node --check app.js
          node --check app/troubleshooting/troubleshooting-bootstrap.js
          node --check app/plc-analyzer/l5k-analyzer-core.js
          node --check app/plc-analyzer/l5k-analyzer-legacy-v4.js
          node --check app/plc-analyzer/l5k-analyzer-dependencies-v5.js
          node --check app/plc-analyzer/l5k-analyzer-discrepancies-v6.js
          node --check app/plc-analyzer/l5k-analyzer-task-schedule-v7.js
          node --check app/plc-analyzer/l5k-analyzer-communication-v8.js
          node --check app/plc-analyzer/l5k-analyzer-message-v9.js
          node --check app/plc-analyzer/l5k-analyzer-consistency-v10.js
          node --check app/plc-analyzer/l5k-analyzer-sequence-v11.js
          node --check app/plc-analyzer/l5k-analyzer-worker.js
          node --check app/plc-analyzer/plc-analyzer.js
          node --check app/plc-analyzer/plc-analyzer-dependencies-v5.js
          node --check app/plc-analyzer/l5k-analyzer-compare.js
          node --check app/plc-analyzer/l5k-analyzer-compare-dependencies-v5-2.js
          node --check app/plc-analyzer/l5k-analyzer-compare-task-schedule-v7-1.js
          node --check app/plc-analyzer/l5k-analyzer-compare-communication-v8-1.js
          node --check app/plc-analyzer/l5k-analyzer-compare-message-v9-1.js
          node --check app/plc-analyzer/l5k-analyzer-compare-consistency-v10-1.js
          node --check app/plc-analyzer/l5k-analyzer-compare-worker.js
          node --check app/plc-analyzer/plc-analyzer-compare.js
          node --check app/plc-analyzer/plc-analyzer-compare-v5-2.js
          node --check app/plc-analyzer/l5k-analyzer-import.js
          node --check app/plc-analyzer/l5k-analyzer-import-dependencies-v5-1.js
          node --check app/plc-analyzer/plc-analyzer-import.js
          node --check app/plc-analyzer/plc-analyzer-import-v5-1.js
      - name: Run analyzer regressions
        run: node --test tests/plc-l5k-analyzer.test.js tests/plc-l5k-analyzer-compare.test.js tests/plc-l5k-analyzer-import.test.js tests/plc-l5k-analyzer-legacy-v4.test.js tests/plc-l5k-analyzer-dependencies-v5.test.js tests/plc-l5k-analyzer-import-dependencies-v5-1.test.js tests/plc-l5k-analyzer-compare-dependencies-v5-2.test.js tests/plc-l5k-analyzer-compare-task-schedule-v7-1.test.js tests/plc-l5k-analyzer-compare-communication-v8-1.test.js tests/plc-l5k-analyzer-compare-message-v9-1.test.js tests/plc-l5k-analyzer-compare-consistency-v10-1.test.js tests/plc-l5k-analyzer-discrepancies-v6.test.js tests/plc-l5k-analyzer-task-schedule-v7.test.js tests/plc-l5k-analyzer-communication-v8.test.js tests/plc-l5k-analyzer-message-v9.test.js tests/plc-l5k-analyzer-consistency-v10.test.js tests/plc-l5k-analyzer-sequence-v11.test.js
      - name: Check patch whitespace
        run: |
          set -euo pipefail
          if [[ -n "${{ github.base_ref }}" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^...HEAD
          fi
