name: Validate PLC L5K analyzer

on:
  pull_request:
    paths:
      - "app/plc-analyzer/**"
      - "docs/PLC_L5K_ANALYZER_BUILD.md"
      - "tests/plc-l5k-analyzer.test.js"
      - ".github/workflows/validate-plc-l5k-analyzer.yml"
  push:
    branches:
      - main
    paths:
      - "app/plc-analyzer/**"
      - "docs/PLC_L5K_ANALYZER_BUILD.md"
      - "tests/plc-l5k-analyzer.test.js"
      - ".github/workflows/validate-plc-l5k-analyzer.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out change
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check analyzer syntax
        run: |
          set -euo pipefail
          node --check app/plc-analyzer/l5k-analyzer-core.js
          node --check app/plc-analyzer/l5k-analyzer-worker.js
          node --check app/plc-analyzer/plc-analyzer.js
      - name: Run analyzer regressions
        run: node --test tests/plc-l5k-analyzer.test.js
      - name: Check patch whitespace
        run: |
          set -euo pipefail
          if [[ -n "${{ github.base_ref }}" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^...HEAD
          fi
