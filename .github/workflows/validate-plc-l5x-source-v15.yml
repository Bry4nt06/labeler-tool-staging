name: Validate PLC L5X source intake v15

on:
  pull_request:
    paths:
      - "app/plc-analyzer/l5x-analyzer-adapter-v15.js"
      - "app/plc-analyzer/l5x-source-provenance-v15.js"
      - "app/plc-analyzer/l5k-analyzer-worker.js"
      - "app/plc-analyzer/plc-source-intake-ui-v15.js"
      - "app/plc-analyzer/index.html"
      - "app/plc-analyzer/import.html"
      - "tests/plc-l5x-source-v15.test.js"
      - "tests/plc-l5x-ui-v15.test.js"
      - ".github/workflows/validate-plc-l5x-source-v15.yml"
  push:
    branches:
      - main
    paths:
      - "app/plc-analyzer/l5x-analyzer-adapter-v15.js"
      - "app/plc-analyzer/l5x-source-provenance-v15.js"
      - "app/plc-analyzer/l5k-analyzer-worker.js"
      - "app/plc-analyzer/plc-source-intake-ui-v15.js"
      - "app/plc-analyzer/index.html"
      - "app/plc-analyzer/import.html"
      - "tests/plc-l5x-source-v15.test.js"
      - "tests/plc-l5x-ui-v15.test.js"
      - ".github/workflows/validate-plc-l5x-source-v15.yml"

permissions:
  contents: read

jobs:
  validate-v15:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out change
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check v15 source intake syntax
        run: |
          set -euo pipefail
          node --check app/plc-analyzer/l5x-analyzer-adapter-v15.js
          node --check app/plc-analyzer/l5x-source-provenance-v15.js
          node --check app/plc-analyzer/l5k-analyzer-worker.js
          node --check app/plc-analyzer/plc-source-intake-ui-v15.js
      - name: Run v15 L5X regressions
        run: |
          set -euo pipefail
          node --test tests/plc-l5x-source-v15.test.js
          node --test tests/plc-l5x-ui-v15.test.js
      - name: Check patch whitespace
        run: |
          set -euo pipefail
          if [[ -n "${{ github.base_ref }}" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^...HEAD
          fi
