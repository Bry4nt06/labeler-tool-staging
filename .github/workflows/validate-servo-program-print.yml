name: Validate Servo Program print view

on:
  push:
    branches: [main]
    paths:
      - "app/servo-program-print-integration.js"
      - "app/bootstrap.js"
      - "tests/servo-program-print-browser.test.cjs"
      - ".github/workflows/validate-servo-program-print.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-print:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check print module syntax
        run: |
          node --check app/servo-program-print-integration.js
          node --check app/bootstrap.js
      - name: Install browser harness
        run: npm install --no-save puppeteer-core@24.16.0
      - name: Serve staging
        run: python3 -m http.server 8000 >/tmp/servoforge-http.log 2>&1 &
      - name: Verify print button and generated build sheet
        run: node tests/servo-program-print-browser.test.cjs
