name: Validate Servo Program print view

on:
  push:
    branches: [main]
    paths:
      - "app/servo-program-table-renderer.js"
      - "app/servo-program-print-integration.js"
      - "app/controllers/simulation-editor-controller.js"
      - "app/controllers/setup-event-controller-integration.js"
      - "app/simulation-table-renderer.js"
      - "app/servo-program-eight-row-grouping-integration.js"
      - "app/bootstrap.js"
      - "tests/servo-program-print-browser.test.cjs"
      - "tests/simulation-draft-persistence-and-print.test.js"
      - ".github/workflows/validate-servo-program-print.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/servo-program-table-renderer.js"
      - "app/servo-program-print-integration.js"
      - "app/controllers/simulation-editor-controller.js"
      - "app/controllers/setup-event-controller-integration.js"
      - "app/simulation-table-renderer.js"
      - "app/bootstrap.js"
      - "tests/servo-program-print-browser.test.cjs"
      - "tests/simulation-draft-persistence-and-print.test.js"
      - ".github/workflows/validate-servo-program-print.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-print:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Servo Program grouping modules
        run: |
          node --check app/servo-program-table-renderer.js
          node --check app/servo-program-print-integration.js
          node --check app/servo-program-eight-row-grouping-integration.js
          node --check app/bootstrap.js
      - name: Install browser harness
        run: npm install --no-save puppeteer-core@24.16.0
      - name: Serve staging
        run: python3 -m http.server 8000 >/tmp/servoforge-http.log 2>&1 &
      - name: Verify eight-row grouping, printer icon, and print sheet
        run: node tests/servo-program-print-browser.test.cjs
      - name: Verify simulation draft persistence and shared print path
        run: node --test tests/simulation-draft-persistence-and-print.test.js
