name: Validate unrestricted Specs editing

on:
  push:
    branches: [main]
    paths:
      - "app/controllers/specification-required-fields-controller.js"
      - "app/controllers/specs-controller.js"
      - "app/spec-number-retirement-integration.js"
      - "config/default-programs/label-specs.json"
      - "app/bootstrap.js"
      - "tests/specification-required-fields.test.js"
      - ".github/workflows/validate-specification-editing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specification-editing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check specification runtime syntax
        run: |
          node --check app/controllers/specification-required-fields-controller.js
          node --check app/controllers/specs-controller.js
          node --check app/spec-number-retirement-integration.js
          node -e "JSON.parse(require('fs').readFileSync('config/default-programs/label-specs.json','utf8'))"
      - name: Verify Spec number is retired and Specs editing stays non-blocking
        run: node tests/specification-required-fields.test.js
