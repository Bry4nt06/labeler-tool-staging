name: Validate staging delivery branch

on:
  push:
    branches:
      - staging-delivery-stability
    paths:
      - ".github/workflows/validate-staging-delivery-branch.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-delivery-stability
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate update stability
        run: |
          set -euo pipefail
          node --check app/persistence.js
          node --check service-worker.js
          node --check app/locked-map-brand-selector-integration.js
          node tests/map-library-selector.test.js
          node tests/update-build-consistency-v134.test.js
          git diff --check
