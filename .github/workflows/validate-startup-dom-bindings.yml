name: Validate startup DOM bindings

on:
  push:
    paths:
      - "app/startup-dom-binding-guard-integration.js"
      - "app/bootstrap.js"
      - "app/defaults.js"
      - "app/specification-table-renderer.js"
      - "app/machine-data-table-renderer.js"
      - "tests/startup-dom-binding-guard.test.js"
      - ".github/workflows/validate-startup-dom-bindings.yml"
  pull_request:
    paths:
      - "app/startup-dom-binding-guard-integration.js"
      - "app/bootstrap.js"
      - "app/defaults.js"
      - "app/specification-table-renderer.js"
      - "app/machine-data-table-renderer.js"
      - "tests/startup-dom-binding-guard.test.js"
      - ".github/workflows/validate-startup-dom-bindings.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check startup guard syntax
        run: node --check app/startup-dom-binding-guard-integration.js
      - name: Run startup DOM binding regression
        run: node tests/startup-dom-binding-guard.test.js
