name: Validate troubleshooting library

on:
  pull_request:
    paths:
      - "app.js"
      - "app/troubleshooting/**"
      - "service-worker.js"
      - "update-manifest.json"
      - "package.json"
      - "tests/troubleshooting-*.test.js"
      - ".github/workflows/validate-troubleshooting-library.yml"
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "app/troubleshooting/**"
      - "service-worker.js"
      - "update-manifest.json"
      - "package.json"
      - "tests/troubleshooting-*.test.js"
      - ".github/workflows/validate-troubleshooting-library.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out staging change
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check troubleshooting and shell syntax
        run: |
          set -euo pipefail
          node --check app/troubleshooting/diagnostic-library.js
          node --check app/troubleshooting/topmodul-live-diagnostics.js
          node --check app/troubleshooting/topmodul-plc-fault-data.js
          node --check app/troubleshooting/topmodul-plc-fault-catalog.js
          node --check app/troubleshooting/topmodul-fault-drilldown.js
          node --check app/troubleshooting/topmodul-station-scope.js
          node --check app/troubleshooting/topmodul-station-controller-trace.js
          node --check app/troubleshooting/topmodul-station-cause-model.js
          node --check app/troubleshooting/topmodul-labeler-cause-model.js
          node --check app/troubleshooting/topmodul-circuit-trace.js
          node --check app/troubleshooting/topmodul-station-power-circuit.js
          node --check app/troubleshooting/topmodul-station-encoder-circuit.js
          node --check app/troubleshooting/topmodul-station-servo-circuit.js
          node --check app/troubleshooting/topmodul-station-communication-circuit.js
          node --check app/troubleshooting/topmodul-station-process-trace.js
          node --check app/troubleshooting/topmodul-station-foundation-circuit.js
          node --check app/troubleshooting/topmodul-labeler-safety-circuit.js
          node --check app/troubleshooting/topmodul-labeler-drive-utilities-circuit.js
          node --check app/troubleshooting/topmodul-rpc-method-bridge.js
          node --check app/troubleshooting/topmodul-labeler-communication-circuit.js
          node --check app/troubleshooting/topmodul-labeler-container-flow-trace.js
          node --check app/troubleshooting/topmodul-labeler-electrical-protection.js
          node --check app/troubleshooting/topmodul-labeler-lubrication-trace.js
          node --check app/troubleshooting/topmodul-labeler-inspection-coder-trace.js
          node --check app/troubleshooting/topmodul-labeler-operating-state-trace.js
          node --check app/troubleshooting/topmodul-labeler-remaining-gaps-trace.js
          node --check app/troubleshooting/topmodul-live-00067-source-bridge.js
          node --check app/troubleshooting/topmodul-alarm-stack-analyzer.js
          node --check app/troubleshooting/topmodul-encoder-isolation.js
          node --check app/troubleshooting/topmodul-rpc-method-ui.js
          node --check app/troubleshooting/topmodul-fault-drilldown-ui.js
          node --check app/troubleshooting/topmodul-process-trace-ui.js
          node --check app/troubleshooting/topmodul-source-gap-ui.js
          node --check app/troubleshooting/topmodul-alarm-stack-ui.js
          node --check app/troubleshooting/topmodul-encoder-isolation-ui.js
          node --check app/troubleshooting/troubleshooting-app.js
          node --check app.js
          node --check service-worker.js
      - name: Run troubleshooting regressions
        run: npm run test:troubleshooting
      - name: Run startup regressions
        run: npm run prestart
      - name: Check patch whitespace
        run: |
          set -euo pipefail
          if [[ -n "${{ github.base_ref }}" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^...HEAD
          fi
