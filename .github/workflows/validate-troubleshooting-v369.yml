name: Validate troubleshooting v369

on:
  pull_request:
    paths:
      - "app/troubleshooting/new-source-evidence-v369.js"
      - "app/troubleshooting/index.html"
      - "tests/troubleshooting-new-source-evidence-v369.test.js"
      - ".github/workflows/validate-troubleshooting-v369.yml"
  push:
    branches:
      - main
    paths:
      - "app/troubleshooting/new-source-evidence-v369.js"
      - "app/troubleshooting/index.html"
      - "tests/troubleshooting-new-source-evidence-v369.test.js"
      - ".github/workflows/validate-troubleshooting-v369.yml"

permissions:
  contents: read

jobs:
  validate-v369:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out change
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check v369 syntax
        run: node --check app/troubleshooting/new-source-evidence-v369.js
      - name: Run v369 regressions
        run: node --test tests/troubleshooting-new-source-evidence-v369.test.js
      - name: Check patch whitespace
        run: |
          set -euo pipefail
          if [[ -n "${{ github.base_ref }}" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^...HEAD
          fi
