name: Validate troubleshooting v374

on:
  pull_request:
    paths:
      - "app/troubleshooting/**"
      - "tests/troubleshooting-apl-multicontroller-v374.test.js"
      - ".github/workflows/validate-troubleshooting-v374.yml"
  push:
    branches:
      - main
    paths:
      - "app/troubleshooting/**"
      - "tests/troubleshooting-apl-multicontroller-v374.test.js"
      - ".github/workflows/validate-troubleshooting-v374.yml"

permissions:
  contents: read

jobs:
  validate-v374:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out change
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check v374 syntax
        run: |
          set -euo pipefail
          node --check app/troubleshooting/apl-multicontroller-validation-v374.js
          node --check tests/troubleshooting-apl-multicontroller-v374.test.js
      - name: Run v374 regressions
        run: |
          set -euo pipefail
          node --test tests/troubleshooting-apl-multicontroller-v374.test.js
          node --test tests/troubleshooting-site-plc-structural-routing-v373.test.js
          node --test tests/troubleshooting-universal-handoff-v372.test.js
      - name: Check patch whitespace
        run: |
          set -euo pipefail
          if [[ -n "${{ github.base_ref }}" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^...HEAD
          fi
