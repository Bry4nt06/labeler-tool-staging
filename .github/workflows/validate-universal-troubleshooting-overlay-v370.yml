name: Validate universal troubleshooting overlay v370

on:
  pull_request:
    paths:
      - "app/plc-analyzer/l5k-analyzer-troubleshooting-overlay-v7.js"
      - "app/plc-analyzer/plc-analyzer-import-controller-v6.js"
      - "app/troubleshooting/troubleshooting-search-precedence.js"
      - "tests/plc-analyzer-import-portable-overlay-v7.test.js"
      - "tests/troubleshooting-universal-overlay-v370.test.js"
      - ".github/workflows/validate-universal-troubleshooting-overlay-v370.yml"
  push:
    branches:
      - main
    paths:
      - "app/plc-analyzer/l5k-analyzer-troubleshooting-overlay-v7.js"
      - "app/plc-analyzer/plc-analyzer-import-controller-v6.js"
      - "app/troubleshooting/troubleshooting-search-precedence.js"
      - "tests/plc-analyzer-import-portable-overlay-v7.test.js"
      - "tests/troubleshooting-universal-overlay-v370.test.js"
      - ".github/workflows/validate-universal-troubleshooting-overlay-v370.yml"

permissions:
  contents: read

jobs:
  validate-v370:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out change
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check portable overlay syntax
        run: |
          set -euo pipefail
          node --check app/plc-analyzer/l5k-analyzer-troubleshooting-overlay-v7.js
          node --check app/plc-analyzer/plc-analyzer-import-controller-v6.js
          node --check app/troubleshooting/troubleshooting-search-precedence.js
      - name: Run v370 overlay regressions
        run: |
          set -euo pipefail
          node --test tests/plc-analyzer-import-portable-overlay-v7.test.js
          node --test tests/troubleshooting-universal-overlay-v370.test.js
      - name: Check patch whitespace
        run: |
          set -euo pipefail
          git diff --check "origin/${{ github.base_ref }}...HEAD"
