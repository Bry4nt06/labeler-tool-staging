name: Validate Validation Diagnostics

on:
  push:
    branches: [main]
    paths:
      - "drivers/validation/validation-issue-driver.js"
      - "drivers/validation/validation-result-aggregator-driver.js"
      - "app/validation-diagnostics-integration.js"
      - "app/simulation-collapsible-integration.js"
      - "app/apl-section-handoff-continuity-integration.js"
      - "app/bootstrap.js"
      - "tests/validation-diagnostics.test.js"
      - "tests/apl-section-handoff-continuity.test.js"
      - ".github/workflows/validate-validation-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check drivers/validation/validation-issue-driver.js
          node --check drivers/validation/validation-result-aggregator-driver.js
          node --check app/validation-diagnostics-integration.js
          node --check app/simulation-collapsible-integration.js
          node --check app/apl-section-handoff-continuity-integration.js
          node --check tests/validation-diagnostics.test.js
          node --check tests/apl-section-handoff-continuity.test.js
      - name: Run validation regressions
        run: |
          node tests/validation-diagnostics.test.js
          node tests/apl-section-handoff-continuity.test.js
