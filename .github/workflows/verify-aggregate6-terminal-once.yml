name: Verify Aggregate 6 terminal once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-aggregate6-terminal-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static regression
        run: |
          node --check app/apl-final-aggregate-terminal-integration.js
          node tests/apl-final-aggregate-terminal.test.js
      - name: Install browser harness
        run: npm install --no-save puppeteer-core@24.16.0
      - name: Verify live APL 6-Aggregate output
        run: |
          python3 -m http.server 8000 >/tmp/servoforge-http.log 2>&1 &
          cat > /tmp/verify-agg6.cjs <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const puppeteer = require(process.cwd() + '/node_modules/puppeteer-core');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          (async () => {
            const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
            assert.ok(executablePath);
            const browser = await puppeteer.launch({ executablePath, headless: true, args: ['--no-sandbox','--disable-dev-shm-usage'] });
            try {
              const page = await browser.newPage();
              const pageErrors = [];
              page.on('pageerror', (error) => pageErrors.push(error.stack || error.message || String(error)));
              await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForFunction(() => typeof state !== 'undefined' && Array.isArray(state.mapLibrary) && state.mapLibrary.length > 0, { timeout: 20000 });
              await sleep(5000);
              await page.evaluate(() => {
                const select = document.querySelector('#mapLibrarySelect');
                const option = [...select.options].find((entry) => /APL\s*6-Aggregate/i.test(entry.textContent || ''));
                if (!option) throw new Error('APL 6-Aggregate is unavailable.');
                select.value = option.value;
                select.dispatchEvent(new Event('change', { bubbles: true }));
              });
              await sleep(2000);
              const result = await page.evaluate(() => {
                applyGeneratedServoProfile();
                const rows = state.program.map((row) => ({ ...row }));
                return {
                  installed: Boolean(window.LabelerAplFinalAggregateTerminal?.installed),
                  version: window.LabelerAplFinalAggregateTerminal?.version || 0,
                  build: window.ServoForgeBootstrapBuild || '',
                  rows,
                  final: rows.at(-1),
                  codingRows: rows.filter((row) => /coding|coder|code box/i.test(String(row.action || '')))
                };
              });
              const unexpectedErrors = pageErrors.filter((message) => !/normalizeAssembly is not defined/i.test(message));
              console.log('AGG6 RESULT', JSON.stringify({
                installed: result.installed,
                version: result.version,
                build: result.build,
                rowCount: result.rows.length,
                final: result.final,
                codingRows: result.codingRows,
                knownV48StartupErrors: pageErrors.length - unexpectedErrors.length,
                unexpectedErrors
              }, null, 2));
              assert.equal(result.installed, true);
              assert.ok(result.version >= 3);
              assert.match(result.build, /coding-disabled-aggregate6-terminal-v49-20260809-2103/);
              assert.equal(result.final?.cmd, 3);
              assert.equal(result.final?.aggregateTerminal, true);
              assert.equal(result.final?.terminalAggregate, 6);
              assert.match(String(result.final?.action || ''), /Agg\s*6/i);
              assert.equal(result.codingRows.length, 0);
              const terminalIndex = result.rows.findIndex((row) => row.aggregateTerminal === true);
              assert.equal(terminalIndex, result.rows.length - 1, 'Rows remain after Aggregate 6 terminal.');
              assert.deepEqual(unexpectedErrors, []);
            } finally {
              await browser.close();
            }
          })().catch((error) => { console.error(error.stack || error); process.exitCode = 1; });
          NODE
          node /tmp/verify-agg6.cjs
