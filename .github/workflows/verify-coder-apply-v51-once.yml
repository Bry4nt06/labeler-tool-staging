name: Verify applied coder code-box pipeline v51

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-coder-apply-v51-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser harness
        run: npm install --no-save puppeteer-core@24.16.0
      - name: Verify actual applied program
        run: |
          python3 -m http.server 8000 >/tmp/servoforge-http.log 2>&1 &
          cat > /tmp/verify-coder-apply.cjs <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const puppeteer = require(process.cwd() + '/node_modules/puppeteer-core');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find((candidate) => fs.existsSync(candidate));
            assert.ok(executablePath, 'Chrome/Chromium executable not found.');
            const browser = await puppeteer.launch({ executablePath, headless: true, args: ['--no-sandbox','--disable-dev-shm-usage'] });
            try {
              const page = await browser.newPage();
              const pageErrors = [];
              page.on('pageerror', (error) => pageErrors.push(error.stack || error.message || String(error)));
              await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForFunction(() => typeof state !== 'undefined'
                && typeof applyGeneratedServoProfile === 'function'
                && window.LabelerAplCoderCodeBoxOrientation?.installed
                && window.LabelerAplFinalAggregateTerminal?.installed, { timeout: 20000 });
              await sleep(3000);

              const result = await page.evaluate(async () => {
                const [labelSpecs, bottleSpecs, defaultMap] = await Promise.all([
                  fetch('./config/default-programs/label-specs.json', { cache: 'no-store' }).then((response) => response.json()),
                  fetch('./config/default-programs/bottle-specs.json', { cache: 'no-store' }).then((response) => response.json()),
                  fetch('./config/default-programs/map-apl-6-aggregate.json', { cache: 'no-store' }).then((response) => response.json())
                ]);
                state.labelSpecs = labelSpecs;
                state.bottleSpecs = bottleSpecs;
                state.mapLibrary = [defaultMap];
                state.activeMapId = defaultMap.id;
                state.applicationMode = 'apl';
                loadMachineMapIntoRuntime(defaultMap, false);
                const landShark = labelSpecs.find((entry) => /LandShark/i.test(entry.brand));
                state.selectedBrand = landShark.brand;
                state.selectedBottle = landShark.bottleType;
                applyLabelLengthStationRules();
                applyGeneratedServoProfile();
                return {
                  rows: state.program.map((row) => ({
                    hmi: row.hmi,
                    cmd: row.cmd,
                    tableAngle: row.tableAngle,
                    plateAngle: row.plateAngle,
                    action: row.action,
                    codingMotion: row.codingMotion,
                    codingHold: row.codingHold,
                    codingTerminal: row.codingTerminal,
                    terminalRest: row.terminalRest,
                    preCoderMarginDeg: row.preCoderMarginDeg,
                    codeBoxCenterMm: row.codeBoxCenterMm
                  })),
                  coderPlan: state.motionPlan?.coderPlan || null,
                  termination: state.motionPlan?.termination || null
                };
              });

              console.log('APPLIED CODER RESULT', JSON.stringify(result, null, 2));
              const turn = result.rows.find((row) => row.codingMotion === true);
              const hold = result.rows.find((row) => row.codingHold === true);
              assert.ok(turn, 'Applied program lost the coder CMD 7 move.');
              assert.ok(hold, 'Applied program lost the coder CMD 3 hold.');
              assert.equal(turn.tableAngle, 290.5);
              assert.equal(turn.cmd, 7);
              assert.equal(hold.tableAngle, 299);
              assert.equal(hold.cmd, 3);
              assert.equal(hold.plateAngle, -135);
              assert.equal(hold.preCoderMarginDeg, 5);
              assert.equal(hold.codeBoxCenterMm, 15);
              assert.equal(result.rows.at(-1).hmi, hold.hmi, 'Coder hold must remain the final applied row.');
              assert.equal(result.rows.some((row) => Number(row.tableAngle) > 299), false, 'Applied pipeline must not recreate a post-coder or 359-degree row.');
              assert.equal(result.rows.some((row) => Number(row.tableAngle) === 359), false, 'Applied pipeline recreated the retired 359-degree terminal.');
              assert.equal(result.termination?.tableAngle, 299);
              assert.equal(result.termination?.section, 'coding');
              assert.equal(result.coderPlan?.status, 'ready');
              assert.ok(result.coderPlan?.plannedRatio < 21);

              const unexpected = pageErrors.filter((message) => !/normalizeAssembly is not defined/i.test(message));
              assert.deepEqual(unexpected, [], `Unexpected browser errors: ${unexpected.join('\n\n')}`);
            } finally {
              await browser.close();
            }
          })().catch((error) => { console.error(error.stack || error); process.exitCode = 1; });
          NODE
          node /tmp/verify-coder-apply.cjs
