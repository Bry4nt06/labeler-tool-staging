name: Verify Mic Family diagnostics v52

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-mic-family-diagnostics-v52-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save puppeteer-core@24.16.0
      - name: Inspect Mic Family program and diagnostics
        run: |
          python3 -m http.server 8000 >/tmp/servoforge-http.log 2>&1 &
          cat > /tmp/inspect-mic.cjs <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const puppeteer = require(process.cwd() + '/node_modules/puppeteer-core');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async () => {
            const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
            assert.ok(executablePath, 'Chrome/Chromium executable not found');
            const browser = await puppeteer.launch({ executablePath, headless: true, args:['--no-sandbox','--disable-dev-shm-usage'] });
            try {
              const page = await browser.newPage();
              const pageErrors = [];
              page.on('pageerror', e => pageErrors.push(e.stack || e.message || String(e)));
              await page.goto('http://127.0.0.1:8000/index.html', { waitUntil:'domcontentloaded', timeout:30000 });
              await page.waitForFunction(() => typeof state !== 'undefined' && typeof applyGeneratedServoProfile === 'function' && window.LabelerProgramOptimizerDriver?.analyze && window.LabelerServoPipelineValidator?.analyze, { timeout:20000 });
              await sleep(4000);
              const result = await page.evaluate(async () => {
                const [labelSpecs, bottleSpecs, map] = await Promise.all([
                  fetch('./config/default-programs/label-specs.json', {cache:'no-store'}).then(r=>r.json()),
                  fetch('./config/default-programs/bottle-specs.json', {cache:'no-store'}).then(r=>r.json()),
                  fetch('./config/default-programs/map-45h-topmodul-3-label-apl-wipe-down-pads.json', {cache:'no-store'}).then(r=>r.json())
                ]);
                state.labelSpecs = labelSpecs;
                state.bottleSpecs = bottleSpecs;
                state.mapLibrary = [map];
                state.activeMapId = map.id;
                state.applicationMode = 'apl';
                loadMachineMapIntoRuntime(map, false);
                const mic = labelSpecs.find(entry => /Mic Family/i.test(entry.brand));
                if (!mic) throw new Error('Mic Family recipe not found');
                state.selectedBrand = mic.brand;
                state.selectedBottle = mic.bottleType;
                applyLabelLengthStationRules();
                applyGeneratedServoProfile();
                const rows = state.program.map(row => ({
                  hmi:row.hmi, cmd:row.cmd, tableAngle:row.tableAngle, plateAngle:row.plateAngle,
                  action:row.action, station:row.station, aggregate:row.aggregate, section:row.section,
                  stage:row.stage, wipeReference:row.wipeReference, motionSource:row.motionSource,
                  plannerIntent:row.plannerIntent, plannedRotation:row.plannedRotation,
                  objectIds:row.objectIds, terminalRest:row.terminalRest
                }));
                const context = {
                  rows: state.program,
                  map,
                  machineType: map.machineType || map.name,
                  applicationMode:'apl',
                  plan: state.motionTranslation?.plan || state.motionPlan?.planner || state.plannerPreview || null,
                  translation: state.motionTranslation || state.motionPlan?.translation || null,
                  machineProfile:'TOPMODUL',
                  profileId: state.motionTranslation?.profileId || state.motionPlan?.translation?.profileId || state.selectedMotionProfileId || state.defaultMotionProfileId || 'rest-correction',
                  maxMoveRatio: state.maxMoveRatio,
                  tolerance:0.001
                };
                const pipeline = window.LabelerServoPipelineValidator.analyze(context);
                const optimizer = window.LabelerProgramOptimizerDriver.analyze(state.program, { map, maxMoveRatio:state.maxMoveRatio, plan:context.plan });
                return {
                  brand:mic.brand, bottle:state.selectedBottle, rowCount:rows.length,
                  focusRows:rows.filter(r => r.hmi >= 14 && r.hmi <= 32),
                  pipelineIssues:(pipeline.issues||[]).filter(i=>i.level!=='ok'),
                  optimizerIssues:(optimizer.diagnostics||[]).filter(i=>i.level==='bad' || i.level==='warn'),
                  pageErrors
                };
              });
              console.log('MIC FAMILY DIAGNOSTICS', JSON.stringify(result,null,2));
            } finally { await browser.close(); }
          })().catch(e => { console.error(e.stack || e); process.exitCode=1; });
          NODE
          node /tmp/inspect-mic.cjs
