name: Verify Mic Family diagnostics v52

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-mic-family-diagnostics-v52-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save puppeteer-core@24.16.0
      - name: Verify Mic Family applied program and diagnostics
        run: |
          python3 -m http.server 8000 >/tmp/servoforge-http.log 2>&1 &
          cat > /tmp/verify-mic.cjs <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const puppeteer = require(process.cwd() + '/node_modules/puppeteer-core');
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
            assert.ok(executablePath, 'Chrome/Chromium executable not found');
            const browser = await puppeteer.launch({ executablePath, headless:true, args:['--no-sandbox','--disable-dev-shm-usage'] });
            try {
              const page = await browser.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.stack || error.message || String(error)));
              await page.goto('http://127.0.0.1:8000/index.html', { waitUntil:'domcontentloaded', timeout:30000 });
              await page.waitForFunction(() => typeof state !== 'undefined'
                && typeof applyGeneratedServoProfile === 'function'
                && window.LabelerProgramOptimizerDriver?.analyze
                && window.LabelerServoPipelineValidator?.analyze
                && window.LabelerAplPostWipeSensorContinuityFallback?.installed
                && window.LabelerPostWipeCoveragePolicy?.version >= 4, { timeout:20000 });
              await sleep(3000);

              const result = await page.evaluate(async () => {
                const [labelSpecs, bottleSpecs, map] = await Promise.all([
                  fetch('./config/default-programs/label-specs.json', {cache:'no-store'}).then(response => response.json()),
                  fetch('./config/default-programs/bottle-specs.json', {cache:'no-store'}).then(response => response.json()),
                  fetch('./config/default-programs/map-45h-topmodul-3-label-apl-wipe-down-pads.json', {cache:'no-store'}).then(response => response.json())
                ]);
                state.labelSpecs = labelSpecs;
                state.bottleSpecs = bottleSpecs;
                state.mapLibrary = [map];
                state.activeMapId = map.id;
                state.applicationMode = 'apl';
                loadMachineMapIntoRuntime(map, false);
                const mic = labelSpecs.find(entry => /Mic Family/i.test(entry.brand));
                if (!mic) throw new Error('Mic Family recipe not found');
                state.selectedBrand = mic.brand;
                state.selectedBottle = mic.bottleType;
                applyLabelLengthStationRules();
                applyGeneratedServoProfile();

                const rows = state.program;
                const plan = state.motionTranslation?.plan || state.motionPlan?.planner || state.plannerPreview || null;
                const pipeline = window.LabelerServoPipelineValidator.analyze({
                  rows, map,
                  machineType:map.machineType || map.name,
                  applicationMode:'apl',
                  plan,
                  translation:state.motionTranslation || state.motionPlan?.translation || null,
                  machineProfile:state.motionTranslation?.machineProfile || state.motionPlan?.translation?.machineProfile || 'TOPMODUL',
                  profileId:state.motionTranslation?.profileId || state.motionPlan?.translation?.profileId || state.selectedMotionProfileId || state.defaultMotionProfileId || 'rest-correction',
                  maxMoveRatio:state.maxMoveRatio,
                  tolerance:0.001
                });
                const optimizer = window.LabelerProgramOptimizerDriver.analyze(rows, { map, maxMoveRatio:state.maxMoveRatio, plan });
                const frames = window.LabelerProgramOptimizerDriver.buildFrames(rows, { map, plan });
                const classifier = window.LabelerProgramOptimizerDriver.physicalContactFrame;
                return {
                  brand:mic.brand,
                  bottle:state.selectedBottle,
                  rowCount:rows.length,
                  rows:rows.map(row => ({
                    hmi:row.hmi, cmd:row.cmd, tableAngle:row.tableAngle, plateAngle:row.plateAngle,
                    action:row.action, sensorId:row.sensorId,
                    postWipeSensorSatisfied:row.postWipeSensorSatisfied,
                    plannedLabelVisibilityPercent:row.plannedLabelVisibilityPercent,
                    codingHold:row.codingHold, codingWindowStart:row.codingWindowStart,
                    codingReadyTableAngle:row.codingReadyTableAngle, preCoderMarginDeg:row.preCoderMarginDeg
                  })),
                  pipelineBad:(pipeline.issues || []).filter(issue => issue.level === 'bad'),
                  optimizerIssues:(optimizer.diagnostics || []).filter(issue => issue.level === 'bad' || issue.level === 'warn'),
                  optimizerStatus:optimizer.status,
                  contactClass:typeof classifier === 'function'
                    ? frames.filter(frame => /Wipe Turn|Orient .*Re-Wipe/i.test(frame.action || '')).map(frame => ({
                        hmi:frame.hmi, action:frame.action, physicalContact:classifier(frame)
                      }))
                    : [],
                  continuity:state.motionPlan?.aplPostWipeSensorContinuity || null,
                  fallbackVersion:window.LabelerAplPostWipeSensorContinuityFallback?.version || null,
                  coverageVersion:window.LabelerPostWipeCoveragePolicy?.version || null,
                  mapCoverageV3:window.LabelerProgramOptimizerDriver?.mapAwareCoverageV3 === true
                };
              });

              console.log('MIC FAMILY V52 RESULT', JSON.stringify({...result, pageErrors}, null, 2));
              assert.equal(result.fallbackVersion, 1);
              assert.equal(result.coverageVersion, 4);

              const staleSensorRows = result.rows.filter(row => row.sensorId === 'default-neck-body-inspection'
                && /Orient Body Label for Sensor/i.test(row.action || ''));
              assert.equal(staleSensorRows.length, 0, 'Stale Body sensor correction remained after the final wipe already satisfied visibility.');

              const bodyHold = result.rows.find(row => /Wipe Hold Body - Agg 4/i.test(row.action || ''));
              assert.ok(bodyHold, 'Body wipe hold was not generated.');
              assert.equal(bodyHold.postWipeSensorSatisfied, true);
              assert.ok(Number(bodyHold.plannedLabelVisibilityPercent) >= 50);

              for (let index = 0; index < result.rows.length - 1; index += 1) {
                const row = result.rows[index];
                const next = result.rows[index + 1];
                if (Number(row.cmd) !== 3 || Number(next.cmd) !== 7) continue;
                assert.ok(Math.abs(Number(next.plateAngle) - Number(row.plateAngle)) <= 0.001,
                  `CMD 7 HMI ${next.hmi} does not inherit preceding Rest angle: ${row.plateAngle} -> ${next.plateAngle}`);
              }

              assert.equal(result.pipelineBad.some(issue => issue.code === 'machine-grammar-rest-motion'), false,
                `Rest-motion fault remained: ${JSON.stringify(result.pipelineBad)}`);
              assert.equal(result.pipelineBad.length, 0, `Unexpected pipeline BAD issues: ${JSON.stringify(result.pipelineBad)}`);

              const falseCoverage = result.optimizerIssues.filter(issue => issue.code === 'optimizer-wipe-contact'
                && /^\s*Orient\b/i.test(issue.message || ''));
              assert.deepEqual(falseCoverage, [], `Re-wipe orientation still produced coverage faults: ${JSON.stringify(falseCoverage)}`);

              result.contactClass.filter(frame => /^\s*Orient\b/i.test(frame.action || '')).forEach(frame => {
                assert.equal(frame.physicalContact, false, `${frame.action} must be free-space orientation.`);
              });
              result.contactClass.filter(frame => /\bWipe Turn\b/i.test(frame.action || '')).forEach(frame => {
                assert.equal(frame.physicalContact, true, `${frame.action} must remain physical wipe contact.`);
              });

              const coderHold = result.rows.find(row => row.codingHold === true);
              if (coderHold) {
                assert.equal(Number(coderHold.preCoderMarginDeg), 5);
                assert.equal(Number(coderHold.tableAngle), Number(coderHold.codingReadyTableAngle));
                assert.equal(Number(coderHold.codingWindowStart) - Number(coderHold.tableAngle), 5);
                assert.equal(result.rows.at(-1).hmi, coderHold.hmi);
              }

              const unexpectedErrors = pageErrors.filter(message => !/normalizeAssembly is not defined/i.test(message));
              assert.deepEqual(unexpectedErrors, [], `Unexpected browser errors: ${unexpectedErrors.join('\n\n')}`);
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error.stack || error); process.exitCode = 1; });
          NODE
          node /tmp/verify-mic.cjs
