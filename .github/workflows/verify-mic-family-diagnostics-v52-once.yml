name: Verify Mic Family diagnostics v52

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-mic-family-diagnostics-v52-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save puppeteer-core@24.16.0
      - name: Inspect Mic Family program and diagnostics
        run: |
          python3 -m http.server 8000 >/tmp/servoforge-http.log 2>&1 &
          cat > /tmp/inspect-mic.cjs <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const puppeteer = require(process.cwd() + '/node_modules/puppeteer-core');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async () => {
            const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
            assert.ok(executablePath, 'Chrome/Chromium executable not found');
            const browser = await puppeteer.launch({ executablePath, headless: true, args:['--no-sandbox','--disable-dev-shm-usage'] });
            try {
              const page = await browser.newPage();
              await page.goto('http://127.0.0.1:8000/index.html', { waitUntil:'domcontentloaded', timeout:30000 });
              await page.waitForFunction(() => typeof state !== 'undefined' && typeof applyGeneratedServoProfile === 'function' && window.LabelerProgramOptimizerDriver?.analyze && window.LabelerServoPipelineValidator?.analyze && window.LabelerOrientationConstraintTargetService?.targetFor, { timeout:20000 });
              await sleep(4000);
              const result = await page.evaluate(async () => {
                const [labelSpecs, bottleSpecs, map] = await Promise.all([
                  fetch('./config/default-programs/label-specs.json', {cache:'no-store'}).then(r=>r.json()),
                  fetch('./config/default-programs/bottle-specs.json', {cache:'no-store'}).then(r=>r.json()),
                  fetch('./config/default-programs/map-45h-topmodul-3-label-apl-wipe-down-pads.json', {cache:'no-store'}).then(r=>r.json())
                ]);
                state.labelSpecs = labelSpecs;
                state.bottleSpecs = bottleSpecs;
                state.mapLibrary = [map];
                state.activeMapId = map.id;
                state.applicationMode = 'apl';
                loadMachineMapIntoRuntime(map, false);
                const mic = labelSpecs.find(entry => /Mic Family/i.test(entry.brand));
                state.selectedBrand = mic.brand;
                state.selectedBottle = mic.bottleType;
                applyLabelLengthStationRules();
                applyGeneratedServoProfile();
                const rows = state.program;
                const bodyHold = rows.find(row => row.hmi === 21);
                const sensor = map.objects.find(item => item.id === 'default-neck-body-inspection');
                const svc = window.LabelerOrientationConstraintTargetService;
                const target = svc.targetFor(sensor, 'body', rows, Number(bodyHold.plateAngle), Number(sensor.angle ?? sensor.start));
                const optimizer = window.LabelerProgramOptimizerDriver.analyze(rows, { map, maxMoveRatio:state.maxMoveRatio, plan:state.motionTranslation?.plan || state.motionPlan?.planner || null });
                const pipeline = window.LabelerServoPipelineValidator.analyze({ rows, map, machineType:map.machineType, applicationMode:'apl', machineProfile:'TOPMODUL', maxMoveRatio:state.maxMoveRatio, tolerance:0.001 });
                return {
                  currentPlate:Number(bodyHold.plateAngle),
                  sensorTarget:target,
                  targetRotation:Number(target.target) - Number(bodyHold.plateAngle),
                  targetRatio:Math.abs(Number(target.target) - Number(bodyHold.plateAngle)) / (214.5 - 209.5),
                  focusRows:rows.filter(r=>r.hmi>=20&&r.hmi<=24).map(r=>({hmi:r.hmi,cmd:r.cmd,tableAngle:r.tableAngle,plateAngle:r.plateAngle,action:r.action,sensorId:r.sensorId,plannedRotation:r.plannedRotation,plannedRatio:r.plannedRatio})),
                  pipelineIssues:(pipeline.issues||[]).filter(i=>i.level!=='ok'),
                  optimizerIssues:(optimizer.diagnostics||[]).filter(i=>i.level==='bad'||i.level==='warn')
                };
              });
              console.log('MIC SENSOR TARGET', JSON.stringify(result,null,2));
            } finally { await browser.close(); }
          })().catch(e => { console.error(e.stack || e); process.exitCode=1; });
          NODE
          node /tmp/inspect-mic.cjs
